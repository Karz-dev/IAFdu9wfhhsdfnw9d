</div>


<script type="module">

    import * as THREE from
        "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


    /* =========================================================
       BASIC SETUP
    ========================================================= */

    const canvas =
        document.getElementById("game");

    const scene =
        new THREE.Scene();

    scene.background =
        new THREE.Color(0x020307);


    const camera =
        new THREE.PerspectiveCamera(
            75,
            window.innerWidth /
            window.innerHeight,
            0.05,
            100
        );


    camera.rotation.order =
        "YXZ";


    const renderer =
        new THREE.WebGLRenderer({
            canvas,
            antialias: true
        });


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );


    renderer.shadowMap.enabled =
        true;

    renderer.shadowMap.type =
        THREE.PCFSoftShadowMap;


    /* =========================================================
       GAME STATE
    ========================================================= */

    const LOOP_TIME = 60;

    let running = false;

    let won = false;

    let timeRemaining =
        LOOP_TIME;

    let loopNumber = 1;

    let lastTime = 0;

    let mouseLocked = false;

    let keyCollected = false;

    let flashlightCollected = false;

    let flashlightOn = false;


    /* =========================================================
       PLAYER
    ========================================================= */

    const player = {

        position:
            new THREE.Vector3(
                0,
                1.65,
                6
            ),

        height: 1.65,

        radius: 0.28,

        speed: 3.1,

        yaw: 0,

        pitch: 0

    };


    /* =========================================================
       INPUT
    ========================================================= */

    const keys = {

        w: false,
        a: false,
        s: false,
        d: false

    };


    window.addEventListener(
        "keydown",
        event => {

            if (event.code === "KeyW") {
                keys.w = true;
                event.preventDefault();
            }

            if (event.code === "KeyA") {
                keys.a = true;
                event.preventDefault();
            }

            if (event.code === "KeyS") {
                keys.s = true;
                event.preventDefault();
            }

            if (event.code === "KeyD") {
                keys.d = true;
                event.preventDefault();
            }

            if (event.code === "KeyE") {

                if (!event.repeat) {
                    interact();
                }

            }

            if (event.code === "KeyF") {

                if (!event.repeat) {
                    toggleFlashlight();
                }

            }

        }
    );


    window.addEventListener(
        "keyup",
        event => {

            if (event.code === "KeyW") {
                keys.w = false;
            }

            if (event.code === "KeyA") {
                keys.a = false;
            }

            if (event.code === "KeyS") {
                keys.s = false;
            }

            if (event.code === "KeyD") {
                keys.d = false;
            }

        }
    );


    window.addEventListener(
        "blur",
        () => {

            keys.w = false;
            keys.a = false;
            keys.s = false;
            keys.d = false;

        }
    );


    /* =========================================================
       MOUSE LOOK
    ========================================================= */

    canvas.addEventListener(
        "click",
        () => {

            if (running) {

                canvas.requestPointerLock();

            }

        }
    );


    document.addEventListener(
        "pointerlockchange",
        () => {

            mouseLocked =
                document.pointerLockElement === canvas;

        }
    );


    document.addEventListener(
        "mousemove",
        event => {

            if (!mouseLocked || !running) {
                return;
            }

            player.yaw -=
                event.movementX * 0.0022;

            player.pitch -=
                event.movementY * 0.0022;

            player.pitch =
                Math.max(
                    -1.45,
                    Math.min(
                        1.45,
                        player.pitch
                    )
                );

        }
    );


    /* =========================================================
       AUDIO ENGINE
    ========================================================= */

    let audioContext = null;

    let masterGain = null;

    let ambientGain = null;

    let audioStarted = false;

    let lastFootstep = 0;

    let ambientTimer = 0;


    function startAudio() {

        if (audioStarted) {
            return;
        }

        audioStarted = true;

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

        masterGain =
            audioContext.createGain();

        masterGain.gain.value =
            0.55;

        masterGain.connect(
            audioContext.destination
        );


        ambientGain =
            audioContext.createGain();

        ambientGain.gain.value =
            0.035;

        ambientGain.connect(
            masterGain
        );


        createAmbientHum();

    }


    function createAmbientHum() {

        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();

        oscillator.type =
            "sine";

        oscillator.frequency.value =
            46;

        gain.gain.value =
            0.08;

        oscillator.connect(gain);

        gain.connect(ambientGain);

        oscillator.start();

    }


    function playFootstep() {

        if (!audioStarted) {
            return;
        }

        const now =
            audioContext.currentTime;


        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();


        oscillator.type =
            "triangle";

        oscillator.frequency.setValueAtTime(
            90 + Math.random() * 35,
            now
        );

        oscillator.frequency.exponentialRampToValueAtTime(
            45,
            now + 0.08
        );


        gain.gain.setValueAtTime(
            0.0001,
            now
        );

        gain.gain.exponentialRampToValueAtTime(
            0.08,
            now + 0.008
        );

        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            now + 0.12
        );


        oscillator.connect(gain);

        gain.connect(masterGain);

        oscillator.start(now);

        oscillator.stop(
            now + 0.13
        );

    }


    function playClick() {

        if (!audioStarted) {
            return;
        }

        const now =
            audioContext.currentTime;

        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();


        oscillator.type =
            "square";

        oscillator.frequency.value =
            850;


        gain.gain.setValueAtTime(
            0.04,
            now
        );

        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            now + 0.05
        );


        oscillator.connect(gain);

        gain.connect(masterGain);

        oscillator.start(now);

        oscillator.stop(
            now + 0.06
        );

    }


    function playDrawerSound() {

        if (!audioStarted) {
            return;
        }

        const now =
            audioContext.currentTime;


        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();


        oscillator.type =
            "sawtooth";

        oscillator.frequency.setValueAtTime(
            100,
            now
        );

        oscillator.frequency.linearRampToValueAtTime(
            55,
            now + 0.25
        );


        gain.gain.setValueAtTime(
            0.0001,
            now
        );

        gain.gain.exponentialRampToValueAtTime(
            0.12,
            now + 0.03
        );

        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            now + 0.3
        );


        oscillator.connect(gain);

        gain.connect(masterGain);

        oscillator.start(now);

        oscillator.stop(
            now + 0.32
        );

    }


    function playKeySound() {

        if (!audioStarted) {
            return;
        }

        const now =
            audioContext.currentTime;


        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();


        oscillator.type =
            "sine";

        oscillator.frequency.setValueAtTime(
            500,
            now
        );

        oscillator.frequency.exponentialRampToValueAtTime(
            900,
            now + 0.25
        );


        gain.gain.setValueAtTime(
            0.0001,
            now
        );

        gain.gain.exponentialRampToValueAtTime(
            0.12,
            now + 0.02
        );

        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            now + 0.35
        );


        oscillator.connect(gain);

        gain.connect(masterGain);

        oscillator.start(now);

        oscillator.stop(
            now + 0.4
        );

    }


    function playDoorSound() {

        if (!audioStarted) {
            return;
        }

        const now =
            audioContext.currentTime;


        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();


        oscillator.type =
            "sawtooth";

        oscillator.frequency.setValueAtTime(
            65,
            now
        );

        oscillator.frequency.linearRampToValueAtTime(
            30,
            now + 0.65
        );


        gain.gain.setValueAtTime(
            0.0001,
            now
        );

        gain.gain.exponentialRampToValueAtTime(
            0.16,
            now + 0.05
        );

        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            now + 0.75
        );


        oscillator.connect(gain);

        gain.connect(masterGain);

        oscillator.start(now);

        oscillator.stop(
            now + 0.8
        );

    }


    function playCreepySound() {

        if (!audioStarted) {
            return;
        }

        const now =
            audioContext.currentTime;


        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();


        oscillator.type =
            "sine";

        oscillator.frequency.setValueAtTime(
            160,
            now
        );

        oscillator.frequency.exponentialRampToValueAtTime(
            42,
            now + 2.5
        );


        gain.gain.setValueAtTime(
            0.0001,
            now
        );

        gain.gain.exponentialRampToValueAtTime(
            0.05,
            now + 0.8
        );

        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            now + 2.7
        );


        oscillator.connect(gain);

        gain.connect(masterGain);

        oscillator.start(now);

        oscillator.stop(
            now + 2.8
        );

    }


    /* =========================================================
       FLASHLIGHT
    ========================================================= */

    const flashlight =
        new THREE.SpotLight(
            0xffffff,
            0,
            18,
            Math.PI / 7,
            0.55,
            1.5
        );


    flashlight.castShadow =
        true;

    flashlight.shadow.mapSize.width =
        512;

    flashlight.shadow.mapSize.height =
        512;


    camera.add(
        flashlight
    );


    const flashlightTarget =
        new THREE.Object3D();


    scene.add(
        flashlightTarget
    );


    flashlight.target =
        flashlightTarget;


    scene.add(
        camera
    );


    function updateFlashlight() {

        if (!flashlightOn) {

            flashlight.intensity =
                0;

            return;

        }


        flashlight.intensity =
            8;


        const direction =
            new THREE.Vector3(
                0,
                0,
                -1
            );

        direction.applyQuaternion(
            camera.quaternion
        );


        flashlightTarget.position.copy(
            camera.position
        );


        flashlightTarget.position.add(
            direction.multiplyScalar(10)
        );

    }


    function toggleFlashlight() {

        if (!flashlightCollected) {
            return;
        }

        flashlightOn =
            !flashlightOn;

        document.getElementById(
            "flashlightStatus"
        ).textContent =
            flashlightOn
                ? "Flashlight: ON"
                : "Flashlight: OFF";

        playClick();

    }


    /* =========================================================
       MATERIALS
    ========================================================= */

    const wallMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x20242b,
            roughness: 0.9
        });


    const floorMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x111419,
            roughness: 1
        });


    const ceilingMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x090b0f,
            roughness: 1
        });


    const woodMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x28231f,
            roughness: 0.85
        });


    const darkWoodMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x151311,
            roughness: 0.9
        });


    const metalMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x353940,
            roughness: 0.7,
            metalness: 0.25
        });


    /* =========================================================
       HELPERS
    ========================================================= */

    const collisionBoxes = [];


    function addBox(
        x,
        y,
        z,
        width,
        height,
        depth,
        material,
        collide = true
    ) {

        const geometry =
            new THREE.BoxGeometry(
                width,
                height,
                depth
            );


        const mesh =
            new THREE.Mesh(
                geometry,
                material
            );


        mesh.position.set(
            x,
            y,
            z
        );


        mesh.castShadow =
            true;

        mesh.receiveShadow =
            true;


        scene.add(mesh);


        if (collide) {

            collisionBoxes.push({
                x,
                z,
                halfWidth:
                    width / 2,
                halfDepth:
                    depth / 2
            });

        }


        return mesh;

    }


    function addFloor(
        x,
        z,
        width,
        depth
    ) {

        return addBox(
            x,
            0,
            z,
            width,
            0.2,
            depth,
            floorMaterial,
            false
        );

    }


    /* =========================================================
       OFFICE
    ========================================================= */

    const OFFICE_WIDTH = 12;

    const OFFICE_DEPTH = 15;


    function buildOffice() {

        addFloor(
            0,
            0,
            OFFICE_WIDTH,
            OFFICE_DEPTH
        );


        /* Ceiling */

        addBox(
            0,
            3.4,
            0,
            OFFICE_WIDTH,
            0.2,
            OFFICE_DEPTH,
            ceilingMaterial,
            false
        );


        /* Back wall */

        addBox(
            0,
            1.7,
            -7.4,
            OFFICE_WIDTH,
            3.4,
            0.25,
            wallMaterial
        );


        /* Left wall */

        addBox(
            -5.9,
            1.7,
            0,
            0.25,
            3.4,
            OFFICE_DEPTH,
            wallMaterial
        );


        /* Right wall */

        addBox(
            5.9,
            1.7,
            0,
            0.25,
            3.4,
            OFFICE_DEPTH,
            wallMaterial
        );


        /*
            Front wall with central opening.
        */

        addBox(
            -3.8,
            1.7,
            7.4,
            4.2,
            3.4,
            0.25,
            wallMaterial
        );


        addBox(
            3.8,
            1.7,
            7.4,
            4.2,
            3.4,
            0.25,
            wallMaterial
        );


        /* =====================================================
           DOORWAY TO MAZE
        ===================================================== */

        addBox(
            0,
            3.0,
            7.4,
            3.2,
            0.8,
            0.25,
            wallMaterial
        );


        const mazeSign =
            makeTextSprite(
                "MAZE",
                "#dddddd",
                1.2
            );


        mazeSign.position.set(
            0,
            2.45,
            7.05
        );


        scene.add(
            mazeSign
        );


        /* =====================================================
           DESK
        ===================================================== */

        addBox(
            -2.7,
            1.05,
            -1.6,
            3.8,
            0.18,
            1.5,
            woodMaterial
        );


        addBox(
            -4.15,
            0.5,
            -1.6,
            0.18,
            1,
            1.3,
            woodMaterial
        );


        addBox(
            -1.25,
            0.5,
            -1.6,
            0.18,
            1,
            1.3,
            woodMaterial
        );


        /* Monitor */

        addBox(
            -2.7,
            1.65,
            -1.75,
            1.55,
            0.9,
            0.12,
            metalMaterial,
            false
        );


        addBox(
            -2.7,
            1.15,
            -1.75,
            0.12,
            0.35,
            0.12,
            metalMaterial,
            false
        );


        const monitorScreen =
            addBox(
                -2.7,
                1.65,
                -1.67,
                1.35,
                0.7,
                0.02,
                new THREE.MeshStandardMaterial({
                    color: 0x050709,
                    emissive: 0x020304
                }),
                false
            );


        /* Keyboard */

        addBox(
            -2.7,
            1.17,
            -0.85,
            1.1,
            0.05,
            0.4,
            metalMaterial,
            false
        );


        /* =====================================================
           CHAIR
        ===================================================== */

        addBox(
            -2.7,
            0.7,
            0.2,
            1.15,
            0.18,
            1.15,
            darkWoodMaterial,
            false
        );


        addBox(
            -2.7,
            1.35,
            0.65,
            0.95,
            1.1,
            0.15,
            darkWoodMaterial,
            false
        );


        /* =====================================================
           BOOKSHELF
        ===================================================== */

        createBookshelf(
            3.9,
            -4.8
        );


        createBookshelf(
            3.9,
            -1.2
        );


        /* =====================================================
           FILING CABINET
        ===================================================== */

        createFilingCabinet(
            -4.1,
            3.7
        );


        /* =====================================================
           LAMP
        ===================================================== */

        const lampLight =
            new THREE.PointLight(
                0xffc477,
                0.7,
                5
            );


        lampLight.position.set(
            -2.7,
            2.1,
            -1.6
        );


        lampLight.castShadow =
            true;

        scene.add(
            lampLight
        );


        const lamp =
            addBox(
                -2.7,
                1.95,
                -1.6,
                0.25,
                0.45,
                0.25,
                metalMaterial,
                false
            );


        /* =====================================================
           FLASHLIGHT CABINET
        ===================================================== */

        createSpecialCabinet(
            3.9,
            2.6
        );

    }


    /* =========================================================
       BOOKSHELF
    ========================================================= */

    function createBookshelf(

    const maze = [

        "#######.#######",

        "#.#####.#####.#",
        "#.#...#.#.....#",
        "#.#.#.#.#.###.#",
        "#...#...#...#.#",
        "###.#####.#.#.#",
        "#...#.....#...#",
        "#.###.#########",
        "#.....#.......#",
        "#.#####.#####.#",
        "#.......#...K.#",
        "#######.#######"

    ];


    const MAZE_CELL = 1;

    const mazeRows =
        maze.length;

    const mazeColumns =
        maze[0].length;

    const mazeWidth =
        mazeColumns * MAZE_CELL;

    const mazeOriginX =
        -mazeWidth / 2 +
        MAZE_CELL / 2;

    const mazeStartZ =
        8.1;

    const mazeOriginZ =
        mazeStartZ +
        MAZE_CELL / 2;


    const mazeWalls = [];


    function buildMaze() {

        for (
            let row = 0;
            row < mazeRows;
            row++
        ) {

            for (
                let col = 0;
                col < mazeColumns;
                col++
            ) {

                const cell =
                    maze[row][col];


                const x =
                    mazeOriginX +
                    col * MAZE_CELL;

                const z =
                    mazeOriginZ +
                    row * MAZE_CELL;


                if (cell === "#") {

                    addBox(
                        x,
                        1.5,
                        z,
                        MAZE_CELL,
                        3,
                        MAZE_CELL,
                        wallMaterial
                    );


                    mazeWalls.push({
                        x,
                        z
                    });

                }


                if (cell === "S") {

                    const sign =
                        makeTextSprite(
                            "ENTER",
                            "#aaaaaa",
                            0.6
                        );


                    sign.position.set(
                        x,
                        2.4,
                        z
                    );


                    scene.add(
                        sign
                    );

                }


                if (cell === "K") {

                    mazeKey.position.set(
                        x,
                        0.35,
                        z
                    );

                }

            }

        }


        addFloor(
            0,
            mazeStartZ +
            mazeRows / 2,
            mazeWidth,
            mazeRows
        );


        createMazeExit();

    }

    /* =========================================================
       TEXT SPRITES
    ========================================================= */

    function makeTextSprite(
        text,
        color,
        size
    ) {

        const canvas =
            document.createElement(
                "canvas"
            );


        canvas.width =
            512;

        canvas.height =
            128;


        const context =
            canvas.getContext(
                "2d"
            );


        context.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        context.font =
            "bold 64px Arial";


        context.textAlign =
            "center";

        context.textBaseline =
            "middle";


        context.fillStyle =
            color;


        context.fillText(
            text,
            canvas.width / 2,
            canvas.height / 2
        );


        const texture =
            new THREE.CanvasTexture(
                canvas
            );


        const material =
            new THREE.SpriteMaterial({
                map: texture,
                transparent: true
            });


        const sprite =
            new THREE.Sprite(
                material
            );


        sprite.scale.set(
            size * 3,
            size * 0.75,
            1
        );


        return sprite;

    }


    /* =========================================================
       COLLISION
    ========================================================= */

    function circleIntersectsBox(
        px,
        pz,
        radius,
        box
    ) {

        const closestX =
            Math.max(
                box.x - box.halfWidth,
                Math.min(
                    px,
                    box.x + box.halfWidth
                )
            );


        const closestZ =
            Math.max(
                box.z - box.halfDepth,
                Math.min(
                    pz,
                    box.z + box.halfDepth
                )
            );


        const dx =
            px - closestX;

        const dz =
            pz - closestZ;


        return (
            dx * dx +
            dz * dz
        ) < radius * radius;

    }


    function collidesAt(
        x,
        z
    ) {

        for (
            const box of collisionBoxes
        ) {

            if (
                circleIntersectsBox(
                    x,
                    z,
                    player.radius,
                    box
                )
            ) {

                return true;

            }

        }


        return false;

    }


    /* =========================================================
       MOVEMENT
    ========================================================= */

    function updateMovement(
        dt
    ) {

        let moveX = 0;

        let moveZ = 0;


        if (keys.w) {
            moveZ -= 1;
        }

        if (keys.s) {
            moveZ += 1;
        }

        if (keys.a) {
            moveX -= 1;
        }

        if (keys.d) {
            moveX += 1;
        }


        const moving =
            moveX !== 0 ||
            moveZ !== 0;


        if (!moving) {
            return false;
        }


        const length =
            Math.hypot(
                moveX,
                moveZ
            );


        moveX /= length;

        moveZ /= length;


        const sin =
            Math.sin(
                player.yaw
            );

        const cos =
            Math.cos(
                player.yaw
            );


        const worldX =
            moveX * cos -
            moveZ * sin;


        const worldZ =
            moveX * sin +
            moveZ * cos;


        const distance =
            player.speed * dt;


        const newX =
            player.position.x +
            worldX * distance;


        const newZ =
            player.position.z +
            worldZ * distance;


        if (
            !collidesAt(
                newX,
                player.position.z
            )
        ) {

            player.position.x =
                newX;

        }


        if (
            !collidesAt(
                player.position.x,
                newZ
            )
        ) {

            player.position.z =
                newZ;

        }


        if (
            audioStarted &&
            performance.now() -
            lastFootstep >
            430
        ) {

            playFootstep();

            lastFootstep =
                performance.now();

        }


        return true;

    }

       CAMERA

    function updateCamera() {

        camera.rotation.x =

    }


    /* =========================================================
       DRAWERS
    ========================================================= */

    function updateDrawers(
        dt
    ) {

        for (
            const drawer of drawers
        ) {

            const target =
                drawer.open
                    ? drawer.targetZ - 0.45
                    : drawer.targetZ;


            drawer.group.position.z =
                THREE.MathUtils.lerp(
                    drawer.group.position.z,
                    target,
                    Math.min(
                        1,
                        dt * 12
                    )
                );

        }

    }


    function getNearbyDrawer() {

        let closest = null;

        let closestDistance =
            1.5;


        for (
            const drawer of drawers
        ) {

            const dx =
                player.position.x -
                drawer.group.position.x;


            const dz =
                player.position.z -
                drawer.group.position.z;


            const distance =
                Math.hypot(
                    dx,
                    dz
                );


            if (
                distance <
                closestDistance
            ) {

                closest =
                    drawer;

                closestDistance =
                    distance;

            }

        }


        return closest;

    }


    function getNearbyShelf() {

        let closest = null;

        let closestDistance =
            1.6;


        for (
            const shelf of shelfObjects
        ) {

            const dx =
                player.position.x -
                shelf.x;


            const dz =
                player.position.z -
                shelf.z;


            const distance =
                Math.hypot(
                    dx,
                    dz
                );


            if (
                distance <
                closestDistance
            ) {

                closest =
                    shelf;

                closestDistance =
                    distance;

            }

        }


        return closest;

    }


    /* =========================================================
       INTERACTION
    ========================================================= */

    function interact() {

        if (!running) {
            return;
        }


        /* Key in office drawer */

        if (
            keyDrawer.open &&
            !keyCollected
        ) {

            const distance =
                player.position.distanceTo(
                    keyGroup.position
                );


            if (
                distance < 1.2
            ) {

                keyCollected =
                    true;

                keyGroup.visible =
                    false;

                playKeySound();

                showMessage(
                    "You found a key."
                );

                updateStatus();

                return;

            }

        }


        /* Flashlight */

        if (
            flashlightDrawer.open &&
            !flashlightCollected
        ) {

            const distance =
                player.position.distanceTo(
                    flashlightItem.position
                );


            if (
                distance < 1.2
            ) {

                flashlightCollected =
                    true;

                flashlightItem.visible =
                    false;

                playKeySound();

                showMessage(
                    "A flashlight. Finally."
                );

                updateStatus();

                return;

            }

        }


        /* Drawer */

        const drawer =
            getNearbyDrawer();


        if (drawer) {

            drawer.open =
                !drawer.open;

            playDrawerSound();

            return;

        }


        /* Shelves */

        const shelf =
            getNearbyShelf();


        if (
            shelf &&
            !shelf.searched
        ) {

            shelf.searched =
                true;

            showMessage(
                "Nothing useful."
            );

            playClick();

            return;

        }


        /* Maze key */

        if (
            mazeKey.visible &&
            player.position.distanceTo(
                mazeKey.position
            ) < 1.1
        ) {

            mazeKey.visible =
                false;

            keyCollected =
                true;

            playKeySound();

            showMessage(
                "This key feels... wrong."
            );

            updateStatus();

            return;

        }


        /* Exit */

        if (exitObject) {

            const distance =
                Math.hypot(
                    player.position.x -
                    exitObject.x,
                    player.position.z -
                    exitObject.z
                );


            if (
                distance < 1.7
            ) {

                if (!keyCollected) {

                    showMessage(
                        "Locked."
                    );

                    playClick();

                    return;

                }


                playDoorSound();

                winGame();

            }

        }

    }

    /* =========================================================
       PROMPTS
    ========================================================= */

    function updatePrompt() {

        const prompt =
            document.getElementById(
                "prompt"
            );


        if (!running) {

            prompt.style.opacity =
                "0";

            return;

        }


        let text = "";


        const drawer =
            getNearbyDrawer();


        if (drawer) {

            text =
                drawer.open
                    ? "[E] Close drawer"
                    : "[E] Open drawer";

        }


        if (
            keyDrawer.open &&
            !keyCollected &&
            player.position.distanceTo(
                keyGroup.position
            ) < 1.2
        ) {

            text =
                "[E] Pick up key";

        }


        if (
            flashlightDrawer.open &&
            !flashlightCollected &&
            player.position.distanceTo(
                flashlightItem.position
            ) < 1.2
        ) {

            text =
                "[E] Pick up flashlight";

        }


        const shelf =
            getNearbyShelf();


        if (
            shelf &&
            !shelf.searched &&
            !text
        ) {

            text =
                "[E] Search shelf";

        }


        if (
            exitObject
        ) {

            const distance =
                Math.hypot(
                    player.position.x -
                    exitObject.x,
                    player.position.z -
                    exitObject.z
                );


            if (
                distance < 1.7
            ) {

                text =
                    keyCollected
                        ? "[E] Open exit"
                        : "[E] The door is locked";

            }

        }


        prompt.textContent =
            text;


        prompt.style.opacity =
            text
                ? "1"
                : "0";

    }

    ========================================================= */

    function updateAmbient(
        dt
    ) {

        if (!audioStarted) {
            return;
        }


        ambientTimer -=
            dt;


        if (
            ambientTimer <= 0
        ) {

            ambientTimer =
                8 +
                Math.random() * 14;


            if (
                Math.random() <
                0.45
            ) {

            }

        }

    /* =========================================================
       LOOP RESET
    ========================================================= */

    function resetLoop() {

        player.position.set(
            0,
            1.65,
            6
        );


        player.yaw =
            0;

        player.pitch =
            0;


        timeRemaining =
            LOOP_TIME;


        /* Close every drawer */

        for (
            const drawer of drawers
        ) {

            drawer.open =
                false;

        }


        /*
            The important objects stay
            discovered between loops.
        */

        keyDrawer.hasKey =
            !keyCollected;


        flashlightDrawer.hasFlashlight =
            !flashlightCollected;


        keyGroup.visible =
            false;

        flashlightItem.visible =
            false;


        flashlightOn =
            false;


        document.getElementById(
            "flashlightStatus"
        ).textContent =
            flashlightCollected
                ? "Flashlight: OFF"
                : "Flashlight: NOT FOUND";


        /*
            Maze key only appears after
            the office key is found.
        */

        mazeKey.visible =
            false;


        updateStatus();

        updateCamera();

    }

    ========================================================= */

        won =

        running =

        document.exitPointerLock();


        document.getElementById(
            "winScreen"
        ).style.display =
            "flex";

    /* =========================================================
       START
    ========================================================= */

    function startGame() {

        startAudio();


        if (
            audioContext &&
            audioContext.state ===
            "suspended"
        ) {

            audioContext.resume();

        }


        running =
            true;

        won =
            false;


        loopNumber =
            1;


        keyCollected =
            false;

        flashlightCollected =
            false;


        document.getElementById(
            "startScreen"
        ).style.display =
            "none";


        document.getElementById(
            "gameOverScreen"
        ).style.display =
            "none";


        document.getElementById(
            "winScreen"
        ).style.display =
            "none";


        resetLoop();


        lastTime =
            performance.now();


        canvas.requestPointerLock();

    }


    /* =========================================================
       LOOP UPDATE
    ========================================================= */

    function update(
        dt
    ) {

        timeRemaining -=
            dt;


        if (
            timeRemaining <= 0
        ) {

            timeRemaining =
                0;

            gameOver();

            return;

        }


        const moving =
            updateMovement(
                dt
            );


        updateDrawers(
            dt
        );


        updateKeyPosition();

        updateFlashlightItem();

        updateFlashlight();

        updateCamera();

        updatePrompt();

        updateAmbient(
            dt
        );


        /*
            Once the office key is collected,
            reveal the maze key.
        */

        if (
            keyCollected &&
            player.position.z >
            mazeStartZ - 1
        ) {

            mazeKey.visible =
                true;

        }


        document.getElementById(
            "timer"
        ).textContent =
            timeRemaining.toFixed(
                1
            );


        document.getElementById(
            "loopCounter"
        ).textContent =
            "LOOP " +
            loopNumber;

    }


    /* =========================================================
       RENDER LOOP
    ========================================================= */

    function animate(
        time
    ) {

        requestAnimationFrame(
            animate
        );


        if (!running) {

            renderer.render(
                scene,
                camera
            );

            return;

        }


        const dt =
            Math.min(
                (time - lastTime) /
                1000,
                0.05
            );


        lastTime =
            time;


        update(
            dt
        );


        renderer.render(
            scene,
            camera
        );

    }


    /* =========================================================
       RESIZE
    ========================================================= */

    window.addEventListener(
        "resize",
        () => {

            camera.aspect =
                window.innerWidth /
                window.innerHeight;


            camera.updateProjectionMatrix();


            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );

        }
    );


    /* =========================================================
       BUILD GAME
    ========================================================= */

    buildOffice();

    buildMaze();

    setupLighting();

    resetLoop();

    updateCamera();


    /* =========================================================
       BUTTONS
    ========================================================= */

    document.getElementById(
        "startButton"
    ).addEventListener(
        "click",
        startGame
    );


    document.getElementById(
        "restartButton"
    ).addEventListener(
        "click",
        () => {

            startGame();

        }
    );


    document.getElementById(
        "winRestartButton"
    ).addEventListener(
        "click",
        () => {

            startGame();

        }
    );


    /* =========================================================
       START RENDERING
    ========================================================= */

    animate(
        performance.now()
    );

</script>
