<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>LOOP</title>


<style>

* {
    box-sizing: border-box;
}


html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #05070d;

    font-family: Arial, sans-serif;

    color: white;

    user-select: none;

}


canvas {

    display: block;

    width: 100vw;
    height: 100vh;

}


#startScreen,
#gameOverScreen {

    position: fixed;

    inset: 0;

    z-index: 20;

    display: flex;

    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle at center,
            rgba(35, 50, 85, 0.35),
            rgba(3, 5, 10, 0.96)
        );

}


#gameOverScreen {

    display: none;

}


.panel {

    width: min(520px, 90vw);

    padding: 36px;

    text-align: center;

    border:
        1px solid
        rgba(255,255,255,0.12);

    border-radius: 20px;

    background:
        rgba(10, 14, 25, 0.92);

    box-shadow:
        0 20px 80px rgba(0,0,0,0.55),
        inset 0 1px 0 rgba(255,255,255,0.05);

}


h1 {

    margin: 0 0 10px;

    font-size: 54px;

    letter-spacing: 8px;

}


.subtitle {

    margin: 0 0 28px;

    color: #aebbd4;

    line-height: 1.6;

}


button {

    border: 0;

    border-radius: 12px;

    padding: 13px 28px;

    background: #315de8;

    color: white;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,0.3);

}


button:hover {

    background: #4670f5;

}


#hud {

    position: fixed;

    inset: 0;

    z-index: 10;

    pointer-events: none;

}


#timer {

    position: absolute;

    top: 18px;
    left: 20px;

    font-size: 25px;

    font-weight: bold;

    text-shadow:
        0 2px 8px black;

}


#loopCounter {

    position: absolute;

    top: 52px;
    left: 20px;

    color: #aebbd4;

    font-size: 15px;

    text-shadow:
        0 2px 8px black;

}


#roomName {

    position: absolute;

    top: 18px;
    right: 20px;

    font-size: 15px;

    color: #aebbd4;

    text-shadow:
        0 2px 8px black;

}


#crosshair {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 12px;
    height: 12px;

    transform:
        translate(-50%, -50%);

}


#crosshair::before,
#crosshair::after {

    content: "";

    position: absolute;

    background:
        rgba(255,255,255,0.8);

}


#crosshair::before {

    width: 12px;
    height: 2px;

    left: 0;
    top: 5px;

}


#crosshair::after {

    width: 2px;
    height: 12px;

    left: 5px;
    top: 0;

}


#prompt {

    position: absolute;

    left: 50%;
    bottom: 80px;

    transform:
        translateX(-50%);

    padding: 9px 14px;

    border-radius: 10px;

    background:
        rgba(0,0,0,0.55);

    color: white;

    font-size: 15px;

}


#message {

    position: absolute;

    left: 50%;
    bottom: 30px;

    transform:
        translateX(-50%);

    color: #b9c7e3;

    font-size: 14px;

    text-shadow:
        0 2px 8px black;

}


#controls {

    margin-top: 18px;

    color: #8e9ab0;

    font-size: 13px;

    line-height: 1.7;

}

</style>

</head>


<body>


<canvas id="game"></canvas>


<div id="hud">

    <div id="timer">
        60.0
    </div>


    <div id="loopCounter">
        Loop 1
    </div>


    <div id="roomName">
        ROOM 1
    </div>


    <div id="crosshair"></div>


    <div id="prompt"></div>


    <div id="message">
        Find the key.
    </div>

</div>


<div id="startScreen">

    <div class="panel">

        <h1>
            LOOP
        </h1>


        <p class="subtitle">

            You have 60 seconds.<br>

            Find the key, open the door,
            and discover what waits beyond it.

        </p>


        <button id="startButton">

            START LOOP

        </button>


        <div id="controls">

            WASD — Move<br>

            Mouse — Look around<br>

            E — Interact<br>

            ESC — Release mouse
            (WASD still works)

        </div>

    </div>

</div>


<div id="gameOverScreen">

    <div class="panel">

        <h1 id="endingTitle">
            LOOP
        </h1>


        <p
            id="endingText"
            class="subtitle"
        >

            Time ran out.

        </p>


        <button id="restartButton">

            RESTART

        </button>

    </div>

</div>


<script type="module">


import * as THREE from
    "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


/* =========================================================
   RENDERER
========================================================= */


const canvas =
    document.getElementById("game");


const renderer =
    new THREE.WebGLRenderer({

        canvas: canvas,

        antialias: true

    });


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);


renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


renderer.shadowMap.enabled = true;


/* =========================================================
   SCENE
========================================================= */


const scene =
    new THREE.Scene();


scene.background =
    new THREE.Color(
        0x05070d
    );


/* =========================================================
   CAMERA
========================================================= */


const camera =
    new THREE.PerspectiveCamera(

        75,

        window.innerWidth /
        window.innerHeight,

        0.1,

        200

    );


camera.rotation.order =
    "YXZ";


/* =========================================================
   GAME STATE
========================================================= */


const LOOP_LENGTH = 60;


let running = false;


let loopNumber = 1;


let loopTime =
    LOOP_LENGTH;


let lastTime = 0;


let pointerLocked = false;


/* =========================================================
   PERSISTENT MEMORY
========================================================= */


const memory = {

    keyFound: false,

    mazeEntered: false,

    mazeKeyFound: false,

    finalDoorOpened: false

};


/* =========================================================
   PLAYER
========================================================= */


const player = {

    position:
        new THREE.Vector3(
            0,
            1.7,
            0
        ),

    radius: 0.35,

    speed: 5.2,

    yaw: 0,

    pitch: 0

};


/* =========================================================
   KEYBOARD
========================================================= */


/*
   IMPORTANT:

   WASD is completely independent
   from pointer lock.

   This means pressing ESC will NOT
   stop the player from moving.
*/


const keys = {

    w: false,

    a: false,

    s: false,

    d: false

};


window.addEventListener(
    "keydown",
    event => {


        if (
            event.code ===
            "KeyW"
        ) {

            keys.w = true;

            event.preventDefault();

        }


        if (
            event.code ===
            "KeyA"
        ) {

            keys.a = true;

            event.preventDefault();

        }


        if (
            event.code ===
            "KeyS"
        ) {

            keys.s = true;

            event.preventDefault();

        }


        if (
            event.code ===
            "KeyD"
        ) {

            keys.d = true;

            event.preventDefault();

        }


        if (
            event.code ===
            "KeyE"
        ) {

            interact();

        }

    }
);


window.addEventListener(
    "keyup",
    event => {


        if (
            event.code ===
            "KeyW"
        ) {

            keys.w = false;

        }


        if (
            event.code ===
            "KeyA"
        ) {

            keys.a = false;

        }


        if (
            event.code ===
            "KeyS"
        ) {

            keys.s = false;

        }


        if (
            event.code ===
            "KeyD"
        ) {

            keys.d = false;

        }

    }
);


/*
   Prevent stuck keys if the
   browser loses focus.
*/


window.addEventListener(
    "blur",
    () => {

        keys.w = false;

        keys.a = false;

        keys.s = false;

        keys.d = false;

    }
);


/* =========================================================
   MOUSE LOOK
========================================================= */


document.addEventListener(
    "pointerlockchange",
    () => {

        pointerLocked =
            document.pointerLockElement ===
            canvas;

    }
);


document.addEventListener(
    "mousemove",
    event => {


        /*
           ONLY mouse look requires
           pointer lock.

           WASD does not.
        */


        if (!pointerLocked) {

            return;

        }


        const sensitivity =
            0.0022;


        player.yaw -=
            event.movementX *
            sensitivity;


        player.pitch -=
            event.movementY *
            sensitivity;


        const limit =
            Math.PI / 2 -
            0.05;


        player.pitch =
            Math.max(

                -limit,

                Math.min(
                    limit,
                    player.pitch
                )

            );

    }
);


/*
   Clicking the game captures
   the mouse for looking around.
*/


canvas.addEventListener(
    "click",
    () => {


        if (
            running &&
            !pointerLocked
        ) {

            canvas.requestPointerLock()
                .catch(
                    () => {}
                );

        }

    }
);


/* =========================================================
   WORLD
========================================================= */


const worldGroup =
    new THREE.Group();


scene.add(
    worldGroup
);


/* =========================================================
   MAZE
========================================================= */


const maze = [

    "###############",

    "#S............#",

    "#.#####.#####.#",

    "#.#...#.#.....#",

    "#.#.#.#.#.###.#",

    "#...#...#...#.#",

    "###.#####.#.#.#",

    "#...#.....#...#",

    "#.###.#########",

    "#.....#.......#",

    "#.#####.#####.#",

    "#.......#...K.#",

    "###############"

];


const CELL_SIZE = 2;


const mazeWidth =
    maze[0].length *
    CELL_SIZE;


const mazeHeight =
    maze.length *
    CELL_SIZE;


const room2OffsetZ = 18;


/*
   These bounds cover the complete
   maze instead of cutting it off.
*/


const worldMinX =
    -mazeWidth / 2 - 1;


const worldMaxX =
    mazeWidth / 2 + 1;


const worldMinZ =
    -8;


const worldMaxZ =
    room2OffsetZ +
    mazeHeight +
    1;


/* =========================================================
   MATERIALS
========================================================= */


const floorMaterial =
    new THREE.MeshStandardMaterial({

        color: 0x151b29,

        roughness: 0.9

    });


const wallMaterial =
    new THREE.MeshStandardMaterial({

        color: 0x2a3448,

        roughness: 0.85

    });


const ceilingMaterial =
    new THREE.MeshStandardMaterial({

        color: 0x0d111b,

        roughness: 1

    });


const doorMaterial =
    new THREE.MeshStandardMaterial({

        color: 0x4d5c79,

        roughness: 0.7

    });


const keyMaterial =
    new THREE.MeshStandardMaterial({

        color: 0xffd54a,

        emissive: 0x8a6200,

        emissiveIntensity: 1.8,

        metalness: 0.4,

        roughness: 0.3

    });


/* =========================================================
   COLLISION
========================================================= */


const collisionBoxes = [];


function addCollisionBox(

    x,
    y,
    z,
    width,
    height,
    depth

) {

    collisionBoxes.push({

        minX:
            x -
            width / 2,

        maxX:
            x +
            width / 2,

        minY:
            y -
            height / 2,

        maxY:
            y +
            height / 2,

        minZ:
            z -
            depth / 2,

        maxZ:
            z +
            depth / 2

    });

}


/* =========================================================
   CUBE
========================================================= */


function addCube(

    x,
    y,
    z,

    width,
    height,
    depth,

    material,

    collision = true

) {


    const geometry =
        new THREE.BoxGeometry(

            width,
            height,
            depth

        );


    const mesh =
        new THREE.Mesh(

            geometry,

            material

        );


    mesh.position.set(

        x,
        y,
        z

    );


    mesh.castShadow = true;

    mesh.receiveShadow = true;


    worldGroup.add(
        mesh
    );


    if (collision) {

        addCollisionBox(

            x,
            y,
            z,

            width,
            height,
            depth

        );

    }


    return mesh;

}


/* =========================================================
   ROOM 1
========================================================= */


function buildRoom1() {


    /*
       Floor
    */


    addCube(

        0,
        -0.15,
        0,

        16,
        0.3,
        16,

        floorMaterial,

        false

    );


    /*
       Ceiling
    */


    addCube(

        0,
        4,
        0,

        16,
        0.3,
        16,

        ceilingMaterial,

        false

    );


    /*
       Back wall
    */


    addCube(

        0,
        2,
        -8,

        16,
        4,
        0.4,

        wallMaterial

    );


    /*
       Left wall
    */


    addCube(

        -8,
        2,
        0,

        0.4,
        4,
        16,

        wallMaterial

    );


    /*
       Right wall
    */


    addCube(

        8,
        2,
        0,

        0.4,
        4,
        16,

        wallMaterial

    );


    /*
       Front wall.

       There is a doorway in the
       centre.
    */


    addCube(

        -6,
        2,
        8,

        4,
        4,
        0.4,

        wallMaterial

    );


    addCube(

        6,
        2,
        8,

        4,
        4,
        0.4,

        wallMaterial

    );


    /*
       Main door
    */


    mainDoor =
        addCube(

            0,
            2,
            8,

            3.8,
            4,
            0.35,

            doorMaterial,

            false

        );


    /*
       Normal key
    */


    normalKey =
        createKey(

            -4.5,
            1.1,
            -2

        );

}


/* =========================================================
   MAZE
========================================================= */


function buildMaze() {


    /*
       Maze floor
    */


    addCube(

        0,

        -0.15,

        room2OffsetZ +
        mazeHeight / 2 -
        CELL_SIZE / 2,

        mazeWidth,

        0.3,

        mazeHeight,

        floorMaterial,

        false

    );


    /*
       Maze ceiling
    */


    addCube(

        0,

        4,

        room2OffsetZ +
        mazeHeight / 2 -
        CELL_SIZE / 2,

        mazeWidth,

        0.3,

        mazeHeight,

        ceilingMaterial,

        false

    );


    const startX =
        -mazeWidth / 2 +
        CELL_SIZE / 2;


    const startZ =
        room2OffsetZ +
        CELL_SIZE / 2;


    for (
        let row = 0;
        row < maze.length;
        row++
    ) {


        for (
            let col = 0;
            col < maze[row].length;
            col++
        ) {


            const cell =
                maze[row][col];


            const x =
                startX +
                col *
                CELL_SIZE;


            const z =
                startZ +
                row *
                CELL_SIZE;


            if (
                cell === "#"
            ) {

                addCube(

                    x,
                    2,
                    z,

                    CELL_SIZE,
                    4,
                    CELL_SIZE,

                    wallMaterial

                );

            }


            if (
                cell === "K"
            ) {

                mazeKey =
                    createKey(

                        x,
                        1.1,
                        z

                    );

            }

        }

    }


    /*
       Final door at the end
       of the maze.
    */


    finalDoor =
        addCube(

            0,
            2,

            room2OffsetZ +
            mazeHeight -
            CELL_SIZE,

            3.5,
            4,
            0.35,

            doorMaterial,

            false

        );

}


/* =========================================================
   KEYS
========================================================= */


function createKey(

    x,
    y,
    z

) {


    const group =
        new THREE.Group();


    group.position.set(

        x,
        y,
        z

    );


    const ring =
        new THREE.Mesh(

            new THREE.TorusGeometry(

                0.28,
                0.08,
                12,
                24

            ),

            keyMaterial

        );


    ring.rotation.x =
        Math.PI / 2;


    group.add(
        ring
    );


    const stem =
        new THREE.Mesh(

            new THREE.BoxGeometry(

                0.12,
                0.55,
                0.12

            ),

            keyMaterial

        );


    stem.position.y =
        -0.2;


    group.add(
        stem
    );


    const light =
        new THREE.PointLight(

            0xffd54a,

            1.5,

            5

        );


    group.add(
        light
    );


    worldGroup.add(
        group
    );


    return group;

}


/* =========================================================
   OBJECT VARIABLES
========================================================= */


let mainDoor = null;

let finalDoor = null;


let mainDoorOpen = false;

let finalDoorOpen = false;


let normalKey = null;

let mazeKey = null;


/* =========================================================
   LIGHTING
========================================================= */


const ambientLight =
    new THREE.AmbientLight(

        0x7180a0,

        0.35

    );


scene.add(
    ambientLight
);


const mainLight =
    new THREE.PointLight(

        0x9db7ff,

        30,

        25

    );


mainLight.position.set(

    0,
    3.5,
    0

);


mainLight.castShadow = true;


scene.add(
    mainLight
);


const mazeLight =
    new THREE.PointLight(

        0x6075a8,

        25,

        30

    );


mazeLight.position.set(

    0,
    3.5,

    room2OffsetZ +
    mazeHeight / 2

);


mazeLight.castShadow = true;


scene.add(
    mazeLight
);


/* =========================================================
   BUILD
========================================================= */


buildRoom1();

buildMaze();


/* =========================================================
   DISTANCE
========================================================= */


function distanceToPlayer(
    object
) {


    if (!object) {

        return Infinity;

    }


    return player.position.distanceTo(

        object.position

    );

}


/* =========================================================
   INTERACT
========================================================= */


function interact() {


    if (!running) {

        return;

    }


    /*
       First key
    */


    if (

        normalKey &&

        normalKey.visible &&

        distanceToPlayer(
            normalKey
        ) < 2.2

    ) {


        memory.keyFound =
            true;


        normalKey.visible =
            false;


        showMessage(

            "You found the key. The door can be opened."

        );


        return;

    }


    /*
       Main door
    */


    if (

        mainDoor &&

        distanceToPlayer(
            mainDoor
        ) < 3

    ) {


        if (
            !memory.keyFound
        ) {

            showMessage(

                "The door is locked."

            );

            return;

        }


        openMainDoor();

        return;

    }


    /*
       Maze key
    */


    if (

        mazeKey &&

        mazeKey.visible &&

        distanceToPlayer(
            mazeKey
        ) < 2.2

    ) {


        memory.mazeKeyFound =
            true;


        mazeKey.visible =
            false;


        showMessage(

            "You found the second key."

        );


        return;

    }


    /*
       Final door
    */


    if (

        finalDoor &&

        distanceToPlayer(
            finalDoor
        ) < 3

    ) {


        if (
            !memory.mazeKeyFound
        ) {

            showMessage(

                "This door needs another key."

            );

            return;

        }


        openFinalDoor();

    }

}


/* =========================================================
   MAIN DOOR
========================================================= */


function openMainDoor() {


    if (
        mainDoorOpen
    ) {

        return;

    }


    mainDoorOpen =
        true;


    memory.mazeEntered =
        true;


    mainDoor.userData.opening =
        true;


    showMessage(

        "The door opens."

    );

}


/* =========================================================
   FINAL DOOR
========================================================= */


function openFinalDoor() {


    if (
        finalDoorOpen
    ) {

        return;

    }


    finalDoorOpen =
        true;


    memory.finalDoorOpened =
        true;


    finalDoor.userData.opening =
        true;


    showMessage(

        "You escaped the loop."

    );


    setTimeout(

        () => {

            endGame(
                true
            );

        },

        900

    );

}


/* =========================================================
   DOOR ANIMATION
========================================================= */


function updateDoors(
    delta
) {


    if (

        mainDoor &&

        mainDoor.userData.opening

    ) {


        mainDoor.position.y +=
            delta * 5;


        if (
            mainDoor.position.y > 7
        ) {

            mainDoor.position.y =
                7;

        }

    }


    if (

        finalDoor &&

        finalDoor.userData.opening

    ) {


        finalDoor.position.y +=
            delta * 5;


        if (
            finalDoor.position.y > 7
        ) {

            finalDoor.position.y =
                7;

        }

    }

}


/* =========================================================
   COLLISION
========================================================= */


function collidesAt(
    x,
    z
) {


    const r =
        player.radius;


    for (
        const box of collisionBoxes
    ) {


        if (

            x + r > box.minX &&

            x - r < box.maxX &&

            z + r > box.minZ &&

            z - r < box.maxZ

        ) {


            /*
               Main door has no collision
               when it is open.
            */


            if (

                mainDoor &&

                !mainDoorOpen &&

                boxBelongsToDoor(

                    box,

                    mainDoor

                )

            ) {

                continue;

            }


            return true;

        }

    }


    return false;

}


function boxBelongsToDoor(
    box,
    door
) {


    return (

        Math.abs(

            (
                box.minX +
                box.maxX
            ) / 2 -

            door.position.x

        ) < 0.1

        &&

        Math.abs(

            (
                box.minZ +
                box.maxZ
            ) / 2 -

            door.position.z

        ) < 0.1

    );

}


/* =========================================================
   MOVEMENT
========================================================= */


/*
   THIS IS THE IMPORTANT PART.

   There is NO:

       if (!pointerLocked) return;

   here.

   Therefore WASD works whether the
   mouse is captured or not.
*/


function updateMovement(
    delta
) {


    let forward = 0;

    let strafe = 0;


    if (keys.w) {

        forward += 1;

    }


    if (keys.s) {

        forward -= 1;

    }


    if (keys.d) {

        strafe += 1;

    }


    if (keys.a) {

        strafe -= 1;

    }


    if (

        forward === 0 &&

        strafe === 0

    ) {

        return;

    }


    /*
       Stop diagonal movement from
       being faster.
    */


    const length =
        Math.hypot(

            forward,
            strafe

        );


    forward /=
        length;


    strafe /=
        length;


    /*
       Movement direction is based
       on camera yaw.
    */


    const forwardX =
        -Math.sin(
            player.yaw
        );


    const forwardZ =
        -Math.cos(
            player.yaw
        );


    const rightX =
        Math.cos(
            player.yaw
        );


    const rightZ =
        -Math.sin(
            player.yaw
        );


    const moveX =

        (

            forwardX *
            forward +

            rightX *
            strafe

        )

        *

        player.speed

        *

        delta;


    const moveZ =

        (

            forwardZ *
            forward +

            rightZ *
            strafe

        )

        *

        player.speed

        *

        delta;


    /*
       X collision
    */


    const nextX =
        player.position.x +
        moveX;


    if (

        !collidesAt(

            nextX,

            player.position.z

        )

    ) {

        player.position.x =
            nextX;

    }


    /*
       Z collision
    */


    const nextZ =
        player.position.z +
        moveZ;


    if (

        !collidesAt(

            player.position.x,

            nextZ

        )

    ) {

        player.position.z =
            nextZ;

    }


    /*
       Full world bounds.

       These now cover the maze.
    */


    player.position.x =
        THREE.MathUtils.clamp(

            player.position.x,

            worldMinX +
            player.radius,

            worldMaxX -
            player.radius

        );


    player.position.z =
        THREE.MathUtils.clamp(

            player.position.z,

            worldMinZ +
            player.radius,

            worldMaxZ -
            player.radius

        );

}


/* =========================================================
   CAMERA
========================================================= */


function updateCamera() {


    camera.position.copy(
        player.position
    );


    camera.rotation.order =
        "YXZ";


    camera.rotation.y =
        player.yaw;


    camera.rotation.x =
        player.pitch;

}


/* =========================================================
   ROOM NAME
========================================================= */


function updateRoomName() {


    const roomName =
        document.getElementById(
            "roomName"
        );


    if (

        player.position.z >
        9

    ) {

        roomName.textContent =
            "ROOM 2 — MAZE";

    } else {

        roomName.textContent =
            "ROOM 1";

    }

}


/* =========================================================
   PROMPT
========================================================= */


function updatePrompt() {


    const prompt =
        document.getElementById(
            "prompt"
        );


    let text = "";


    if (

        normalKey &&

        normalKey.visible &&

        distanceToPlayer(
            normalKey
        ) < 2.2

    ) {

        text =
            "Press E — Pick up key";

    }


    if (

        mainDoor &&

        distanceToPlayer(
            mainDoor
        ) < 3

    ) {


        if (
            memory.keyFound
        ) {

            text =
                "Press E — Open door";

        } else {

            text =
                "Locked door";

        }

    }


    if (

        mazeKey &&

        mazeKey.visible &&

        distanceToPlayer(
            mazeKey
        ) < 2.2

    ) {

        text =
            "Press E — Pick up key";

    }


    if (

        finalDoor &&

        distanceToPlayer(
            finalDoor
        ) < 3

    ) {


        if (
            memory.mazeKeyFound
        ) {

            text =
                "Press E — Open final door";

        } else {

            text =
                "The final door is locked";

        }

    }


    prompt.textContent =
        text;

}


/* =========================================================
   MESSAGE
========================================================= */


let messageTimer = null;


function showMessage(
    text
) {


    const message =
        document.getElementById(
            "message"
        );


    message.textContent =
        text;


    clearTimeout(
        messageTimer
    );


    messageTimer =
        setTimeout(

            () => {

                message.textContent =
                    "";

            },

            3000

        );

}


/* =========================================================
   RESET LOOP
========================================================= */


function resetLoop() {


    /*
       Player reset
    */


    player.position.set(

        0,
        1.7,
        0

    );


    player.yaw = 0;

    player.pitch = 0;


    /*
       Keys remain remembered.
    */


    if (normalKey) {

        normalKey.visible =
            !memory.keyFound;

    }


    if (mazeKey) {

        mazeKey.visible =
            !memory.mazeKeyFound;

    }


    /*
       Reset doors.
    */


    mainDoorOpen =
        false;


    finalDoorOpen =
        false;


    if (mainDoor) {

        mainDoor.position.y =
            2;

        mainDoor.userData.opening =
            false;

    }


    if (finalDoor) {

        finalDoor.position.y =
            2;

        finalDoor.userData.opening =
            false;

    }


    /*
       Remembered first key means
       the main door stays open.
    */


    if (
        memory.keyFound
    ) {

        mainDoorOpen =
            true;

        mainDoor.position.y =
            7;

    }


    /*
       Remembered maze key means
       final door stays open.
    */


    if (
        memory.mazeKeyFound
    ) {

        finalDoorOpen =
            true;

        finalDoor.position.y =
            7;

    }


    loopTime =
        LOOP_LENGTH;


    document.getElementById(
        "loopCounter"
    ).textContent =

        "Loop " +
        loopNumber;


    showMessage(

        memory.mazeEntered

            ? "You remember what lies beyond the door."

            : "Find the key."

    );


    updateCamera();

}


/* =========================================================
   TIMER
========================================================= */


function updateTimer(
    delta
) {


    loopTime -=
        delta;


    if (
        loopTime <= 0
    ) {


        loopTime =
            0;


        updateTimerDisplay();


        loopNumber++;


        resetLoop();


        return;

    }


    updateTimerDisplay();

}


function updateTimerDisplay() {


    const timer =
        document.getElementById(
            "timer"
        );


    timer.textContent =
        loopTime.toFixed(1);

}


/* =========================================================
   END GAME
========================================================= */


function endGame(
    won
) {


    running =
        false;


    if (
        document.pointerLockElement
    ) {

        document.exitPointerLock();

    }


    const screen =
        document.getElementById(
            "gameOverScreen"
        );


    const title =
        document.getElementById(
            "endingTitle"
        );


    const text =
        document.getElementById(
            "endingText"
        );


    if (won) {


        title.textContent =
            "YOU ESCAPED";


        text.textContent =
            "You broke the loop.";

    }


}


/* =========================================================
   START GAME
========================================================= */


function startGame() {


    document.getElementById(
        "startScreen"
    ).style.display =
        "none";


    document.getElementById(
        "gameOverScreen"
    ).style.display =
        "none";


    loopNumber =
        1;


    running =
        true;


    /*
       WASD works immediately.

       Pointer lock is optional.
    */


    resetLoop();


    lastTime =
        performance.now();


    requestAnimationFrame(
        gameLoop
    );


    /*
       Try to capture mouse.

       If the browser refuses,
       WASD still works.
    */


    canvas.requestPointerLock()
        .catch(
            () => {}
        );

}


/* =========================================================
   RESTART
========================================================= */


function restartGame() {


    memory.keyFound =
        false;


    memory.mazeEntered =
        false;


    memory.mazeKeyFound =
        false;


    memory.finalDoorOpened =
        false;


    startGame();

}


/* =========================================================
   BUTTONS
========================================================= */


document.getElementById(
    "startButton"
).addEventListener(

    "click",

    startGame

);


document.getElementById(
    "restartButton"
).addEventListener(

    "click",

    restartGame

);


/* =========================================================
   RESIZE
========================================================= */


window.addEventListener(
    "resize",
    () => {


        camera.aspect =

            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

            window.innerWidth,
            window.innerHeight

        );

    }
);


/* =========================================================
   MAIN GAME LOOP
========================================================= */


function gameLoop(
    time
) {


    if (!running) {

        return;

    }


    const delta =

        Math.min(

            (
                time -
                lastTime
            ) / 1000,

            0.05

        );


    lastTime =
        time;


    updateMovement(
        delta
    );


    updateDoors(
        delta
    );


    updateTimer(
        delta
    );


    updateCamera();


    updateRoomName();


    updatePrompt();


    renderer.render(

        scene,

        camera

    );


    requestAnimationFrame(
        gameLoop
    );

}


/* =========================================================
   INITIAL DRAW
========================================================= */


resetLoop();


updateCamera();


updateTimerDisplay();


renderer.render(

    scene,

    camera

);

</script>

</body>

</html>
