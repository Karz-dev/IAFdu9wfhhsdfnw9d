    width: min(520px, 90vw);
    padding: 44px;
    text-align: center;
    background: rgba(7,7,7,.95);
    border: 1px solid rgba(255,255,255,.08);

}

.panel h1 {
    margin: 0 0 12px;
    font-size: 54px;
    letter-spacing: 14px;
}

.panel p {
    color: #999;
    line-height: 1.7;
}

button {
    margin-top: 22px;
    padding: 13px 35px;
    border: 1px solid #555;
    background: #151515;
    color: white;
    font-size: 15px;
    cursor: pointer;
}

button:hover {
    background: #242424;
}

.hidden {
    display: none;
}

<!--

<script>

window.THREE_READY = new Promise(
    (resolve, reject) => {

        const sources = [

            "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js",

            "https://unpkg.com/three@0.180.0/build/three.min.js"

        ];

        let index = 0;


        function loadNext() {

            if (index >= sources.length) {

                reject(
                    new Error(
                        "Three.js could not be loaded."
                    )
                );

                return;

            }


            const script =
                document.createElement("script");

            script.src =
                sources[index++];

            script.onload =
                () => resolve();

            script.onerror =
                () => {

                    script.remove();

                    loadNext();

                };

            document.head.appendChild(
                script
            );

        }


        loadNext();

    }
);

</script>

<script>

THREE_READY.then(
    () => {

        startThreeGame();

    }
).catch(
    () => {

        document.getElementById(
            "message"
        ).textContent =
            "Three.js could not be loaded. Check your internet connection.";

    }
);


function startThreeGame() {


/* =========================================================
   THREE.JS
========================================================= */

const THREE =
    window.THREE;


/* =========================================================
   SCENE
========================================================= */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(
        0x050505
    );

scene.fog =
    new THREE.FogExp2(
        0x070707,
        0.038
    );


/* =========================================================
   CAMERA
========================================================= */

const camera =
    new THREE.PerspectiveCamera(
        75,
        window.innerWidth /
        window.innerHeight,
        0.05,
        100
    );


/* =========================================================
   RENDERER
========================================================= */

const renderer =
    new THREE.WebGLRenderer({
        antialias: true
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   MATERIALS
========================================================= */

const floorMat =
    new THREE.MeshStandardMaterial({
        color: 0x202124,
        roughness: 0.95
    });

const ceilingMat =
    new THREE.MeshStandardMaterial({
        color: 0x141517,
        roughness: 1
    });

const wallMat =
    new THREE.MeshStandardMaterial({
        color: 0x36383c,
        roughness: 0.9
    });

const wallDarkMat =
    new THREE.MeshStandardMaterial({
        color: 0x242529,
        roughness: 1
    });

const woodMat =
    new THREE.MeshStandardMaterial({
        color: 0x3b3028,
        roughness: 0.9
    });

const metalMat =
    new THREE.MeshStandardMaterial({
        color: 0x55575a,
        metalness: 0.25,
        roughness: 0.8
    });

const darkMat =
    new THREE.MeshStandardMaterial({
        color: 0x111214,
        roughness: 1
    });


/* =========================================================
   WORLD
========================================================= */

const world =
    new THREE.Group();

scene.add(
    world
);


const collisionBoxes = [];


function addBox(
    w,
    h,
    d,
    material,
    x,
    y,
    z,
    collision = false
) {

    const mesh =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                w,
                h,
                d
            ),
            material
        );

    mesh.position.set(
        x,
        y,
        z
    );

    mesh.castShadow = true;
    mesh.receiveShadow = true;

    world.add(
        mesh
    );


    if (collision) {

        collisionBoxes.push({

            minX:
                x - w / 2,

            maxX:
                x + w / 2,

            minZ:
                z - d / 2,

            maxZ:
                z + d / 2

        });

    }


    return mesh;

}


/* =========================================================
   FLOOR / CEILING
========================================================= */

addBox(
    56,
    0.2,
    82,
    floorMat,
    0,
    -0.1,
    20
);

addBox(
    56,
    0.2,
    82,
    ceilingMat,
    0,
    3.8,
    20
);


/* =========================================================
   OUTER WALLS
========================================================= */

addBox(
    0.4,
    3.8,
    82,
    wallMat,
    -28,
    1.9,
    20,
    true
);

addBox(
    0.4,
    3.8,
    82,
    wallMat,
    28,
    1.9,
    20,
    true
);

addBox(
    56,
    3.8,
    0.4,
    wallMat,
    0,
    1.9,
    -21,
    true
);

addBox(
    56,
    3.8,
    0.4,
    wallMat,
    0,
    1.9,
    61,
    true
);


/* =========================================================
   OFFICE ROOMS
========================================================= */

/*
    Front section is deliberately divided
    into smaller rooms and corridors.
*/


const officeWalls = [

    [-15, -9, 0.35, 24],
    [15, -9, 0.35, 24],

    [-21, 3, 12, 0.35],
    [-9, 3, 10, 0.35],

    [9, 3, 10, 0.35],
    [21, 3, 12, 0.35],

    [-21, 15, 0.35, 14],
    [21, 15, 0.35, 14],

    [-21, 23, 14, 0.35],
    [21, 23, 14, 0.35],

    [-14, 31, 0.35, 12],
    [14, 31, 0.35, 12],

    [-21, 37, 14, 0.35],
    [21, 37, 14, 0.35]
];


for (
    const w of officeWalls
) {

    addBox(
        w[2],
        3.8,
        w[3],
        wallMat,
        w[0],
        1.9,
        w[1],
        true
    );

}


/* =========================================================
   MAZE
========================================================= */

/*
    Large enclosed maze section.

    It has lots of turns, dead ends and
    narrow passages.
*/

const mazeWalls = [

    [-20, 45, 0.35, 8],
    [-12, 45, 0.35, 16],
    [-4, 45, 0.35, 8],

    [4, 45, 0.35, 16],
    [12, 45, 0.35, 8],
    [20, 45, 0.35, 16],

    [-16, 41, 8, 0.35],
    [-8, 49, 8, 0.35],
    [0, 41, 8, 0.35],
    [8, 49, 8, 0.35],
    [16, 41, 8, 0.35],

    [-20, 53, 8, 0.35],
    [-12, 57, 8, 0.35],
    [-4, 53, 8, 0.35],
    [4, 57, 8, 0.35],
    [12, 53, 8, 0.35],
    [20, 57, 8, 0.35]
];


for (
    const w of mazeWalls
) {

    addBox(
        w[2],
        3.8,
        w[3],
        wallDarkMat,
        w[0],
        1.9,
        w[1],
        true
    );

}


/* =========================================================
   DESKS
========================================================= */

function createDesk(
    x,
    z,
    rotation = 0
) {

    const group =
        new THREE.Group();

    group.position.set(
        x,
        0,
        z
    );

    group.rotation.y =
        rotation;

    world.add(
        group
    );


    const top =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                2.7,
                0.15,
                1.2
            ),
            woodMat
        );

    top.position.y =
        1.05;

    top.castShadow = true;

    group.add(
        top
    );


    for (
        const sx of [-1, 1]
    ) {

        for (
            const sz of [-1, 1]
        ) {

            const leg =
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        0.12,
                        1,
                        0.12
                    ),
                    metalMat
                );

            leg.position.set(
                sx * 1.05,
                0.5,
                sz * 0.4
            );

            group.add(
                leg
            );

        }

    }


    const monitor =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.1,
                0.7,
                0.12
            ),
            darkMat
        );

    monitor.position.set(
        0,
        1.5,
        -0.18
    );

    group.add(
        monitor
    );


    const screen =
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                0.9,
                0.5
            ),
            new THREE.MeshStandardMaterial({
                color: 0x151b21,
                emissive: 0x101923,
                emissiveIntensity: 0.35
            })
        );

    screen.position.set(
        0,
        1.5,
        -0.245
    );

    group.add(
        screen
    );


    const keyboard =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                0.9,
                0.05,
                0.32
            ),
            metalMat
        );

    keyboard.position.set(
        0,
        1.15,
        0.25
    );

    group.add(
        keyboard
    );


    const chair =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                0.85,
                0.15,
                0.85
            ),
            darkMat
        );

    chair.position.set(
        0,
        0.7,
        1.25
    );

    group.add(
        chair
    );

}


createDesk(
    -8,
    -14
);

createDesk(
    8,
    -14,
    Math.PI
);

createDesk(
    -22,
    10,
    Math.PI / 2
);

createDesk(
    22,
    10,
    -Math.PI / 2
);

createDesk(
    -22,
    29,
    Math.PI / 2
);

createDesk(
    22,
    29,
    -Math.PI / 2
);


/* =========================================================
   BOOKSHELVES
========================================================= */

function createShelf(
    x,
    z,
    rotation = 0
) {

    const group =
        new THREE.Group();

    group.position.set(
        x,
        0,
        z
    );

    group.rotation.y =
        rotation;

    world.add(
        group
    );


    const body =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                2.8,
                2.8,
                0.45
            ),
            woodMat
        );

    body.position.y =
        1.4;

    group.add(
        body
    );


    for (
        let level = 0;
        level < 4;
        level++
    ) {

        for (
            let b = 0;
            b < 6;
            b++
        ) {

            const book =
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        0.24,
                        0.42,
                        0.08
                    ),
                    new THREE.MeshStandardMaterial({
                        color:
                            0x303030 +
                            Math.floor(
                                Math.random() *
                                0x252525
                            )
                    })
                );

            book.position.set(
                -0.9 + b * 0.36,
                0.55 +
                level * 0.58,
                -0.3
            );

            group.add(
                book
            );

        }

    }

}


createShelf(
    -11,
    -5
);

createShelf(
    11,
    -5
);

createShelf(
    -24,
    20,
    Math.PI / 2
);

createShelf(
    24,
    20,
    -Math.PI / 2
);


/* =========================================================
   FILING CABINETS
========================================================= */

function createCabinet(
    x,
    z,
    rotation = 0
) {

    const group =
        new THREE.Group();

    group.position.set(
        x,
        0,
        z
    );

    group.rotation.y =
        rotation;

    world.add(
        group
    );


    const body =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.15,
                2.2,
                0.7
            ),
            metalMat
        );

    body.position.y =
        1.1;

    group.add(
        body
    );


    for (
        let i = 0;
        i < 4;
        i++
    ) {

        const drawer =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    0.95,
                    0.37,
                    0.05
                ),
                darkMat
            );

        drawer.position.set(
            0,
            0.43 +
            i * 0.48,
            -0.38
        );

        group.add(
            drawer
        );

        const handle =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    0.3,
                    0.04,
                    0.05
                ),
                metalMat
            );

        handle.position.set(
            0,
            0.43 +
            i * 0.48,
            -0.42
        );

        group.add(
            handle
        );

    }

}


createCabinet(
    -11,
    8
);

createCabinet(
    -11,
    27
);

createCabinet(
    11,
    8
);

createCabinet(
    11,
    27
);


/* =========================================================
   PLAYER
========================================================= */

const player = {

    x: 0,

    y: 1.65,

    z: -18,

    yaw: 0,

    pitch: 0,

    speed: 4.2,

    radius: 0.35

};


camera.position.set(
    player.x,
    player.y,
    player.z
);


/* =========================================================
   INPUT
========================================================= */

const keys = {};


window.addEventListener(
    "keydown",
    event => {

        keys[event.code] = true;


        if (
            event.code === "KeyF" &&
            running
        ) {

            flashlightOn =
                !flashlightOn;

            updateFlashlight();

            updateFlashlightUI();

        }


        if (
            event.code === "KeyE" &&
            running
        ) {

            interact();

        }

    }
);


window.addEventListener(
    "keyup",
    event => {

        keys[event.code] = false;

    }
);


/* =========================================================
   MOUSE LOOK
========================================================= */

renderer.domElement.addEventListener(
    "click",
    () => {

        if (
            running
        ) {

            renderer.domElement
                .requestPointerLock();

        }

    }
);


document.addEventListener(
    "mousemove",
    event => {

        if (
            document.pointerLockElement !==
            renderer.domElement
        ) {

            return;

        }


        player.yaw -=
            event.movementX *
            0.0022;


        player.pitch -=
            event.movementY *
            0.0022;


        player.pitch =
            Math.max(
                -1.45,
                Math.min(
                    1.45,
                    player.pitch
                )
            );

    }
);


/* =========================================================
   FLASHLIGHT
========================================================= */

let flashlightOn = true;


const flashlight =
    new THREE.SpotLight(
        0xffffff,
        12,
        28,
        Math.PI / 6,
        0.45,
        1.2
    );

flashlight.castShadow =
    true;

flashlight.shadow.mapSize.set(
    1024,
    1024
);

flashlight.position.set(
    0,
    -0.05,
    -0.15
);

camera.add(
    flashlight
);


const flashlightTarget =
    new THREE.Object3D();

scene.add(
    flashlightTarget
);

flashlight.target =
    flashlightTarget;


function updateFlashlight() {

    flashlight.intensity =
        flashlightOn
            ? 12
            : 0;


    const direction =
        new THREE.Vector3(
            0,
            0,
            -1
        );

    direction.applyQuaternion(
        camera.quaternion
    );


    flashlightTarget.position.copy(
        camera.position
    );


    flashlightTarget.position.add(
        direction.multiplyScalar(
            20
        )
    );

}


function updateFlashlightUI() {

    document.getElementById(
        "flashlightStatus"
    ).textContent =
        "FLASHLIGHT: " +
        (
            flashlightOn
                ? "ON"
                : "OFF"
        );

}


/* =========================================================
   ROOM LIGHTS
========================================================= */

const lightPositions = [

    [-8, -14],
    [8, -14],

    [-21, 10],
    [21, 10],

    [-21, 29],
    [21, 29],

    [-4, 43],
    [4, 43],

    [-20, 53],
    [-4, 53],
    [12, 53],

    [-12, 58],
    [4, 58],
    [20, 58]

];


for (
    const p of lightPositions
) {

    const light =
        new THREE.PointLight(
            0xcbd7e6,
            0.75,
            8
        );

    light.position.set(
        p[0],
        3.35,
        p[1]
    );

    light.castShadow =
        true;

    light.shadow.mapSize.set(
        256,
        256
    );

    scene.add(
        light
    );


    const fixture =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.5,
                0.07,
                0.35
            ),
            new THREE.MeshStandardMaterial({
                color: 0xaaaaaa,
                emissive: 0x777777,
                emissiveIntensity: 0.5
            })
        );

    fixture.position.set(
        p[0],
        3.65,
        p[1]
    );

    world.add(
        fixture
    );

}


/* =========================================================
   KEY
========================================================= */

let keyCollected =
    false;

let drawerOpen =
    false;


const drawerPosition =
    new THREE.Vector3(
        -11,
        1.1,
        27
    );


const key =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            0.12,
            0.04,
            0.35
        ),
        new THREE.MeshStandardMaterial({
            color: 0xffd45c,
            emissive: 0x664400,
            emissiveIntensity: 0.8
        })
    );

key.position.set(
    -11,
    1.22,
    27
);

key.rotation.y =
    0.6;

key.visible =
    false;

world.add(
    key
);


/* =========================================================
   INTERACTION
========================================================= */

function interact() {

    const dx =
        player.x -
        drawerPosition.x;

    const dz =
        player.z -
        drawerPosition.z;

    const distance =
        Math.hypot(
            dx,
            dz
        );


    if (
        distance < 2.3 &&
        !keyCollected
    ) {

        if (
            !drawerOpen
        ) {

            drawerOpen =
                true;

            key.visible =
                true;

            showMessage(
                "The drawer slides open."
            );

            playTone(
                160,
                0.15,
                "sawtooth"
            );

        }
        else {

            keyCollected =
                true;

            key.visible =
                false;

            showMessage(
                "You found a key."
            );

            playTone(
                660,
                0.08,
                "sine"
            );

            setTimeout(
                () => {

                    playTone(
                        880,
                        0.12,
                        "sine"
                    );

                },
                90
            );


            /*
                Horror system begins
                immediately after discovery.
            */

            horror.unlocked =
                true;

            horror.cooldown =
                4;

        }

    }

}


/* =========================================================
   PROMPT
========================================================= */

function updatePrompt() {

    const dx =
        player.x -
        drawerPosition.x;

    const dz =
        player.z -
        drawerPosition.z;

    const distance =
        Math.hypot(
            dx,
            dz
        );


    if (
        distance < 2.3 &&
        !keyCollected
    ) {

        document.getElementById(
            "prompt"
        ).textContent =
            drawerOpen
                ? "[E] Take the key"
                : "[E] Open drawer";

        return;

    }


    document.getElementById(
        "prompt"
    ).textContent =
        "";

}


/* =========================================================
   COLLISION
========================================================= */

function collides(
    x,
    z
) {

    const r =
        player.radius;


    for (
        const b of collisionBoxes
    ) {

        const closestX =
            Math.max(
                b.minX,
                Math.min(
                    x,
                    b.maxX
                )
            );

        const closestZ =
            Math.max(
                b.minZ,
                Math.min(
                    z,
                    b.maxZ
                )
            );


        const dx =
            x -
            closestX;

        const dz =
            z -
            closestZ;


        if (
            dx * dx +
            dz * dz <
            r * r
        ) {

            return true;

        }

    }


    return false;

}


/* =========================================================
   MOVEMENT
========================================================= */

function updateMovement(
    dt
) {

    let forward = 0;
    let side = 0;


    if (
        keys["KeyW"]
    ) {

        forward += 1;

    }

    if (
        keys["KeyS"]
    ) {

        forward -= 1;

    }

    if (
        keys["KeyD"]
    ) {

        side += 1;

    }

    if (
        keys["KeyA"]
    ) {

        side -= 1;

    }


    const forwardX =
        -Math.sin(
            player.yaw
        );

    const forwardZ =
        -Math.cos(
            player.yaw
        );


    const rightX =
        Math.cos(
            player.yaw
        );

    const rightZ =
        -Math.sin(
            player.yaw
        );


    let moveX =
        forwardX *
        forward +
        rightX *
        side;

    let moveZ =
        forwardZ *
        forward +
        rightZ *
        side;


    const length =
        Math.hypot(
            moveX,
            moveZ
        );


    if (
        length > 0
    ) {

        moveX /=
            length;

        moveZ /=
            length;

    }


    const amount =
        player.speed *
        dt;


    const nextX =
        player.x +
        moveX *
        amount;


    const nextZ =
        player.z +
        moveZ *
        amount;


    if (
        !collides(
            nextX,
            player.z
        )
    ) {

        player.x =
            nextX;

    }


    if (
        !collides(
            player.x,
            nextZ
        )
    ) {

        player.z =
            nextZ;

    }


    return length > 0;

}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera() {

    camera.position.set(
        player.x,
        player.y,
        player.z
    );

    camera.rotation.order =
        "YXZ";

    camera.rotation.y =
        player.yaw;

    camera.rotation.x =
        player.pitch;


    updateFlashlight();

}


/* =========================================================
   AUDIO
========================================================= */

let audioContext =
    null;

let masterGain =
    null;

let footstepTimer =
    0;


function startAudio() {

    if (
        audioContext
    ) {

        if (
            audioContext.state ===
            "suspended"
        ) {

            audioContext.resume();

        }

        return;

    }


    audioContext =
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();


    masterGain =
        audioContext.createGain();

    masterGain.gain.value =
        0.25;

    masterGain.connect(
        audioContext.destination
    );


    const hum =
        audioContext
            .createOscillator();

    const humGain =
        audioContext
            .createGain();

    hum.type =
        "sine";

    hum.frequency.value =
        43;

    humGain.gain.value =
        0.025;

    hum.connect(
        humGain
    );

    humGain.connect(
        masterGain
    );

    hum.start();

}


function playTone(
    frequency,
    duration,
    type = "sine",
    volume = 0.08
) {

    if (
        !audioContext
    ) {

        return;

    }


    const now =
        audioContext.currentTime;


    const oscillator =
        audioContext
            .createOscillator();

    const gain =
        audioContext
            .createGain();


    oscillator.type =
        type;

    oscillator.frequency.value =
        frequency;


    gain.gain.setValueAtTime(
        0.0001,
        now
    );

    gain.gain.exponentialRampToValueAtTime(
        volume,
        now + 0.02
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + duration
    );


    oscillator.connect(
        gain
    );

    gain.connect(
        masterGain
    );


    oscillator.start(
        now
    );

    oscillator.stop(
        now +
        duration +
        0.03
    );

}


/* =========================================================
   FOOTSTEPS
========================================================= */

function updateFootsteps(
    moving,
    dt
) {

    if (
        !moving
    ) {

        footstepTimer =
            0;

        return;

    }


    footstepTimer -=
        dt;


    if (
        footstepTimer <= 0
    ) {

        playTone(
            62,
            0.06,
            "triangle",
            0.055
        );

        footstepTimer =
            0.43;

    }

}


/* =========================================================
   MESSAGE
========================================================= */

let messageTimeout;


function showMessage(
    text
) {

    const element =
        document.getElementById(
            "message"
        );

    element.textContent =
        text;


    clearTimeout(
        messageTimeout
    );


    if (
        text
    ) {

        messageTimeout =
            setTimeout(
                () => {

                    element.textContent =
                        "";

                },
                2200
            );

    }

}


/* =========================================================
   HORROR ENTITY
========================================================= */

const horror = {

    unlocked: false,

    active: false,

    cooldown: 0,

    life: 0,

    side: 1,

    x: 0,

    z: 0,

    targetX: 0,

    targetZ: 0

};


const horrorGroup =
    new THREE.Group();

scene.add(
    horrorGroup
);


/* Body */

const horrorBody =
    new THREE.Mesh(
        new THREE.CapsuleGeometry(
            0.3,
            1.25,
            4,
            8
        ),
        new THREE.MeshStandardMaterial({
            color: 0x020202,
            roughness: 1
        })
    );

horrorBody.position.y =
    1.0;

horrorGroup.add(
    horrorBody
);


/* Head */

const horrorHead =
    new THREE.Mesh(
        new THREE.SphereGeometry(
            0.32,
            12,
            12
        ),
        new THREE.MeshStandardMaterial({
            color: 0x010101,
            roughness: 1
        })
    );

horrorHead.position.y =
    2.0;

horrorGroup.add(
    horrorHead
);


/* =========================================================
   FIND HORROR POSITION
========================================================= */

const horrorSpots = [

    {
        x: -13,
        z: 1,
        side: 1
    },

    {
        x: 13,
        z: 1,
        side: -1
    },

    {
        x: -17,
        z: 18,
        side: 1
    },

    {
        x: 17,
        z: 18,
        side: -1
    },

    {
        x: -7,
        z: 34,
        side: 1
    },

    {
        x: 7,
        z: 34,
        side: -1
    },

    {
        x: -17,
        z: 48,
        side: 1
    },

    {
        x: 17,
        z: 48,
        side: -1
    },

    {
        x: -7,
        z: 55,
        side: 1
    },

    {
        x: 9,
        z: 55,
        side: -1
    }

];


function spawnHorror() {

    if (
        !horror.unlocked ||
        horror.active ||
        horror.cooldown > 0
    ) {

        return;

    }


    const spot =
        horrorSpots[
            Math.floor(
                Math.random() *
                horrorSpots.length
            )
        ];


    const distance =
        Math.hypot(
            player.x - spot.x,
            player.z - spot.z
        );


    if (
        distance < 7
    ) {

        return;

    }


    horror.x =
        spot.x;

    horror.z =
        spot.z;

    horror.side =
        spot.side;


    horrorGroup.position.set(
        horror.x,
        0,
        horror.z
    );


    horrorGroup.rotation.y =
        Math.atan2(
            player.x - horror.x,
            player.z - horror.z
        );


    horrorGroup.visible =
        true;

    horror.active =
        true;

    horror.life =
        1.8;


    /*
       Low, unsettling sound.
    */

    playTone(
        38,
        0.7,
        "sine",
        0.055
    );

}


/* =========================================================
   HORROR UPDATE
========================================================= */

function updateHorror(
    dt
) {

    if (
        !horror.unlocked
    ) {

        return;

    }


    if (
        horror.cooldown > 0
    ) {

        horror.cooldown -=
            dt;

    }


    if (
        !horror.active
    ) {

        /*
           Give the player a little time
           before the first encounter.
        */

        if (
            Math.random() <
            dt * 0.035
        ) {

            spawnHorror();

        }

        return;

    }


    horror.life -=
        dt;


    /*
       Slowly retreat while facing
       the player.
    */

    const dx =
        player.x -
        horrorGroup.position.x;

    const dz =
        player.z -
        horrorGroup.position.z;


    const distance =
        Math.hypot(
            dx,
            dz
        );


    horrorGroup.lookAt(
        player.x,
        1.4,
        player.z
    );


    if (
        distance < 3
    ) {

        horror.life =
            Math.min(
                horror.life,
                0.25
            );

    }


    if (
        horror.life <= 0
    ) {

        horror.active =
            false;

        horrorGroup.visible =
            false;

        horror.cooldown =
            7 +
            Math.random() * 8;

    }

}


/* =========================================================
   HORROR VISIBILITY
========================================================= */

function updateHorrorVisibility() {

    if (
        !horror.active
    ) {

        return;

    }


    /*
       Flashlight makes the silhouette
       much easier to notice.
    */

    if (
        flashlightOn
    ) {

        horrorBody.material.emissive =
            new THREE.Color(
                0x090909
            );

    }
    else {

        horrorBody.material.emissive =
            new THREE.Color(
                0x000000
            );

    }

}


/* =========================================================
   LOOP
========================================================= */

let running =
    false;

let loopNumber =
    1;

let timeLeft =
    60;

let lastTime =
    performance.now();


function resetLoop() {

    player.x =
        0;

    player.y =
        1.65;

    player.z =
        -18;

    player.yaw =
        0;

    player.pitch =
        0;


    keyCollected =
        false;

    drawerOpen =
        false;

    key.visible =
        false;


    horror.unlocked =
        false;

    horror.active =
        false;

    horror.cooldown =
        0;

    horror.life =
        0;

    horrorGroup.visible =
        false;


    timeLeft =
        60;


    updateCamera();

}


/* =========================================================
   LOOP RESET
========================================================= */

function loopReset() {

    loopNumber++;


    document.getElementById(
        "loopCounter"
    ).textContent =
        "LOOP " +
        loopNumber;


    resetLoop();


    showMessage(
        "Something feels different."
    );

}


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop(
    time
) {

    if (
        !running
    ) {

        return;

    }


    const dt =
        Math.min(
            (time - lastTime) /
            1000,
            0.05
        );


    lastTime =
        time;


    timeLeft -=
        dt;


    if (
        timeLeft <= 0
    ) {

        timeLeft =
            0;


        loopReset();

    }


    const moving =
        updateMovement(
            dt
        );


    updateCamera();

    updatePrompt();

    updateFootsteps(
        moving,
        dt
    );

    updateHorror(
        dt
    );

    updateHorrorVisibility();


    document.getElementById(
        "timer"
    ).textContent =
        timeLeft.toFixed(
            1
        );


    renderer.render(
        scene,
        camera
    );


    requestAnimationFrame(
        gameLoop
    );

}


/* =========================================================
   START
========================================================= */

function startGame() {

    startAudio();


    document.getElementById(
        "startScreen"
    ).classList.add(
        "hidden"
    );


    document.getElementById(
        "endScreen"
    ).classList.add(
        "hidden"
    );


    loopNumber =
        1;


    document.getElementById(
        "loopCounter"
    ).textContent =
        "LOOP 1";


    resetLoop();


    flashlightOn =
        true;

    updateFlashlight();

    updateFlashlightUI();


    running =
        true;


    lastTime =
        performance.now();


    renderer.domElement
        .requestPointerLock();


    requestAnimationFrame(
        gameLoop
    );

}


/* =========================================================
   BUTTONS
========================================================= */

document.getElementById(
    "startButton"
).addEventListener(
    "click",
    startGame
);


document.getElementById(
    "restartButton"
).addEventListener(
    "click",
    startGame
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


/* =========================================================
   INITIAL
========================================================= */

flashlightOn =
    true;

updateFlashlight();

updateFlashlightUI();

updateCamera();

renderer.render(
    scene,
    camera
);

}

</script>
