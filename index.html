<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>LOOP</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    background: #050505;

    font-family:
        Arial,
        sans-serif;

    color: white;
}

canvas {
    display: block;
}


/* ================================
   MENU
================================ */

#menu {

    position: fixed;

    inset: 0;

    z-index: 100;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    background:
        radial-gradient(
            circle,
            #252525 0%,
            #090909 45%,
            #000 100%
        );
}


#menu h1 {

    margin: 0;

    font-size: 72px;

    letter-spacing: 16px;

    text-shadow:
        0 0 30px rgba(255,255,255,.12);

}


#menu p {

    margin:
        12px 0 30px;

    color: #888;

}


#play {

    padding:
        15px 55px;

    border: 1px solid #555;

    border-radius: 8px;

    background: #191919;

    color: white;

    font-size: 21px;

    font-weight: bold;

    cursor: pointer;

    transition:
        background .2s,
        transform .2s;

}


#play:hover {

    background: #303030;

    transform:
        scale(1.04);

}


#loading {

    margin-top: 15px;

    min-height: 18px;

    color: #777;

    font-size: 13px;

}


/* ================================
   HUD
================================ */

#hud {

    position: fixed;

    inset: 0;

    z-index: 10;

    pointer-events: none;

}


#timer {

    position: absolute;

    top: 20px;

    left: 20px;

    font-size: 25px;

    font-weight: bold;

    text-shadow:
        0 2px 7px black;

}


#objective {

    position: absolute;

    top: 56px;

    left: 20px;

    font-size: 14px;

    color: #aaa;

    text-shadow:
        0 2px 7px black;

}


#crosshair {

    position: absolute;

    left: 50%;

    top: 50%;

    width: 5px;

    height: 5px;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background: white;

    opacity: .8;

}


#message {

    position: absolute;

    bottom: 55px;

    left: 50%;

    transform:
        translateX(-50%);

    color: #ddd;

    font-size: 16px;

    text-shadow:
        0 2px 7px black;

    white-space: nowrap;

}


#hint {

    position: absolute;

    bottom: 16px;

    left: 50%;

    transform:
        translateX(-50%);

    color: #666;

    font-size: 12px;

}

</style>

</head>


<body>


<!-- ================================
     MENU
================================ -->

<div id="menu">

    <h1>LOOP</h1>

    <p>
        Something is wrong with this place.
    </p>

    <button id="play">
        ENTER
    </button>

    <div id="loading"></div>

</div>


<!-- ================================
     HUD
================================ -->

<div id="hud">

    <div id="timer">
        60.0
    </div>

    <div id="objective">
        Find the key.
    </div>

    <div id="crosshair"></div>

    <div id="message"></div>

    <div id="hint">
        WASD • Mouse • F flashlight • E interact
    </div>

</div>


<!-- ================================
     THREE.JS
================================ -->

<script src="./three.js"></script>


<script>

/* =========================================================
   CHECK THREE.JS
========================================================= */

const playButton =
    document.getElementById("play");

const loading =
    document.getElementById("loading");


if (
    typeof THREE === "undefined"
) {

    loading.textContent =
        "Three.js failed to load.";

    playButton.disabled =
        true;

    throw new Error(
        "Three.js was not loaded."
    );

}


/* =========================================================
   MENU
========================================================= */

const menu =
    document.getElementById("menu");

const timerText =
    document.getElementById("timer");

const objectiveText =
    document.getElementById("objective");

const messageText =
    document.getElementById("message");


let started =
    false;


/* =========================================================
   SCENE
========================================================= */

const scene =
    new THREE.Scene();


scene.background =
    new THREE.Color(
        0x050505
    );


scene.fog =
    new THREE.FogExp2(
        0x050505,
        0.032
    );


/* =========================================================
   CAMERA
========================================================= */

const camera =
    new THREE.PerspectiveCamera(

        75,

        window.innerWidth /
        window.innerHeight,

        0.05,

        200

    );


/* =========================================================
   RENDERER
========================================================= */

const renderer =
    new THREE.WebGLRenderer({

        antialias: true

    });


renderer.setSize(

    window.innerWidth,
    window.innerHeight

);


renderer.setPixelRatio(

    Math.min(
        window.devicePixelRatio,
        2
    )

);


renderer.shadowMap.enabled =
    true;


renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;


document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   PLAYER
========================================================= */

const player = {

    position:
        new THREE.Vector3(
            0,
            1.7,
            8
        ),

    speed:
        4.2,

    radius:
        .35

};


let yaw =
    0;

let pitch =
    0;


/* =========================================================
   GAME STATE
========================================================= */

let running =
    false;

let loopTime =
    60;

let hasKey =
    false;

let drawerOpened =
    false;

let inMaze =
    false;

let mazeExit =
    false;

let messageTimer =
    0;


/* =========================================================
   INPUT
========================================================= */

const keys = {};


window.addEventListener(
    "keydown",
    function(event) {

        keys[event.code] =
            true;


        if (
            event.code === "KeyF" &&
            running
        ) {

            flashlightOn =
                !flashlightOn;

            flashlight.visible =
                flashlightOn;

        }


        if (
            event.code === "KeyE" &&
            running
        ) {

            interact();

        }

    }
);


window.addEventListener(
    "keyup",
    function(event) {

        keys[event.code] =
            false;

    }
);


/* =========================================================
   MATERIALS
========================================================= */

const wallMaterial =
    new THREE.MeshStandardMaterial({

        color:
            0x292929,

        roughness:
            .95

    });


const floorMaterial =
    new THREE.MeshStandardMaterial({

        color:
            0x151515,

        roughness:
            1

    });


const ceilingMaterial =
    new THREE.MeshStandardMaterial({

        color:
            0x0d0d0d,

        roughness:
            1

    });


const woodMaterial =
    new THREE.MeshStandardMaterial({

        color:
            0x332820,

        roughness:
            .9

    });


const metalMaterial =
    new THREE.MeshStandardMaterial({

        color:
            0x303030,

        metalness:
            .45,

        roughness:
            .6

    });


/* =========================================================
   COLLISION
========================================================= */

const colliders = [];


function createBox(

    x,
    y,
    z,

    sx,
    sy,
    sz,

    material,

    collide = true

) {

    const geometry =
        new THREE.BoxGeometry(

            sx,
            sy,
            sz

        );


    const mesh =
        new THREE.Mesh(

            geometry,
            material

        );


    mesh.position.set(
        x,
        y,
        z
    );


    mesh.castShadow =
        true;

    mesh.receiveShadow =
        true;


    scene.add(
        mesh
    );


    if (
        collide
    ) {

        colliders.push({

            x: x,
            z: z,

            sx: sx,
            sz: sz

        });

    }


    return mesh;

}


/* =========================================================
   FLOOR
========================================================= */

createBox(

    0,
    -.1,
    0,

    80,
    .2,
    80,

    floorMaterial,

    false

);


/* =========================================================
   CEILING
========================================================= */

createBox(

    0,
    5,
    0,

    80,
    .2,
    80,

    ceilingMaterial,

    false

);


/* =========================================================
   OUTER WALLS
========================================================= */

createBox(
    0,
    2.5,
    -35,
    70,
    5,
    .5,
    wallMaterial
);


createBox(
    0,
    2.5,
    35,
    70,
    5,
    .5,
    wallMaterial
);


createBox(
    -35,
    2.5,
    0,
    .5,
    5,
    70,
    wallMaterial
);


createBox(
    35,
    2.5,
    0,
    .5,
    5,
    70,
    wallMaterial
);


/* =========================================================
   OFFICE WALLS
========================================================= */

createBox(
    -12,
    2.5,
    -18,
    25,
    5,
    .5,
    wallMaterial
);


createBox(
    12,
    2.5,
    -18,
    20,
    5,
    .5,
    wallMaterial
);


createBox(
    -22,
    2.5,
    0,
    .5,
    5,
    25,
    wallMaterial
);


createBox(
    15,
    2.5,
    0,
    .5,
    5,
    25,
    wallMaterial
);


/* =========================================================
   DESKS
========================================================= */

function makeDesk(
    x,
    z
) {

    createBox(
        x,
        .8,
        z,
        3.5,
        .25,
        1.6,
        woodMaterial
    );


    createBox(
        x - 1.45,
        .4,
        z,
        .2,
        .8,
        1.3,
        woodMaterial
    );


    createBox(
        x + 1.45,
        .4,
        z,
        .2,
        .8,
        1.3,
        woodMaterial
    );


    createBox(
        x,
        1.45,
        z,
        1.2,
        1.1,
        .12,
        metalMaterial,
        false
    );


    createBox(
        x,
        1.12,
        z - .05,
        .8,
        .08,
        .5,
        metalMaterial,
        false
    );

}


makeDesk(-28,-8);
makeDesk(-18,-8);
makeDesk(-8,-8);

makeDesk(-28,5);
makeDesk(-18,5);

makeDesk(5,-8);
makeDesk(5,4);

makeDesk(25,-8);


/* =========================================================
   CHAIRS
========================================================= */

function makeChair(
    x,
    z
) {

    createBox(
        x,
        .65,
        z,
        .8,
        .15,
        .8,
        metalMaterial
    );


    createBox(
        x,
        1.2,
        z + .35,
        .75,
        1,
        .12,
        metalMaterial
    );

}


makeChair(-28,-5.8);
makeChair(-18,-5.8);
makeChair(-8,-5.8);

makeChair(-28,7.2);
makeChair(-18,7.2);


/* =========================================================
   SHELVES
========================================================= */

function makeShelf(
    x,
    z
) {

    createBox(
        x,
        2,
        z,
        .6,
        4,
        4,
        woodMaterial
    );


    for (
        let i = 0;
        i < 4;
        i++
    ) {

        createBox(

            x,

            .55 +
            i * 1,

            z - 1.7,

            .65,
            .08,
            3.3,

            woodMaterial,

            false

        );

    }

}


makeShelf(
    -30,
    22
);


makeShelf(
    -26,
    22
);


makeShelf(
    29,
    -25
);


/* =========================================================
   FILING CABINET
========================================================= */

const cabinet =
    new THREE.Group();


cabinet.position.set(
    -28,
    0,
    12
);


scene.add(
    cabinet
);


const cabinetBody =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            2.5,
            3,
            1.5
        ),

        metalMaterial

    );


cabinetBody.position.y =
    1.5;


cabinet.add(
    cabinetBody
);


const drawers = [];


for (
    let i = 0;
    i < 3;
    i++
) {

    const drawer =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                2.1,
                .75,
                .15
            ),

            metalMaterial

        );


    drawer.position.set(

        0,

        .65 +
        i * .95,

        -.82

    );


    cabinet.add(
        drawer
    );


    drawers.push(
        drawer
    );

}


/* =========================================================
   KEY
========================================================= */

const key =
    new THREE.Mesh(

        new THREE.TorusGeometry(
            .16,
            .045,
            8,
            20
        ),

        new THREE.MeshStandardMaterial({

            color:
                0xd6b85a,

            metalness:
                .8,

            roughness:
                .25

        })

    );


key.position.set(
    -28,
    1.65,
    11.35
);


scene.add(
    key
);


/* =========================================================
   MAZE
========================================================= */

const maze = [

    "###############",
    "#S............#",
    "#.#####.#####.#",
    "#.#...#.#.....#",
    "#.#.#.#.#.###.#",
    "#...#...#...#.#",
    "###.#####.#.#.#",
    "#...#.....#...#",
    "#.###.#########",
    "#.....#.......#",
    "#.#####.#####.#",
    "#.......#...K.#",
    "#######.#######"

];


const mazeCell =
    2.4;


const mazeOriginX =
    -16;


const mazeOriginZ =
    15;


for (
    let row = 0;
    row < maze.length;
    row++
) {

    for (
        let col = 0;
        col < maze[row].length;
        col++
    ) {

        if (
            maze[row][col] !== "#"
        ) {

            continue;

        }


        const x =
            mazeOriginX +
            col *
            mazeCell;


        const z =
            mazeOriginZ +
            row *
            mazeCell;


        createBox(

            x,
            2.5,
            z,

            mazeCell,
            5,
            mazeCell,

            wallMaterial

        );

    }

}


/* =========================================================
   LIGHTING
========================================================= */

const ambient =
    new THREE.HemisphereLight(

        0x555555,
        0x080808,
        .18

    );


scene.add(
    ambient
);


const officeLight =
    new THREE.PointLight(

        0x777777,
        2,
        25

    );


officeLight.position.set(
    -10,
    4,
    -10
);


officeLight.castShadow =
    true;


scene.add(
    officeLight
);


/* =========================================================
   OTHER LIGHTS
========================================================= */

const lightPositions = [

    [-28,-12],
    [-15,-12],
    [-3,-12],

    [-28,2],
    [-15,2],

    [5,-12],
    [5,2],

    [25,-12],

    [-25,25],
    [5,25],
    [28,22]

];


const flickerLights = [];


for (
    const position
    of lightPositions
) {

    const light =
        new THREE.PointLight(

            0x666666,
            .8,
            12

        );


    light.position.set(

        position[0],
        4.2,
        position[1]

    );


    scene.add(
        light
    );


    flickerLights.push(
        light
    );

}


/* =========================================================
   FLASHLIGHT
========================================================= */

const flashlight =
    new THREE.SpotLight(

        0xffffff,

        6,

        32,

        Math.PI / 7,

        .55,

        1.5

    );


flashlight.castShadow =
    true;


scene.add(
    flashlight
);


scene.add(
    flashlight.target
);


let flashlightOn =
    true;


/* =========================================================
   COLLISION CHECK
========================================================= */

function collides(
    x,
    z
) {

    const r =
        player.radius;


    for (
        const c
        of colliders
    ) {

        const minX =
            c.x -
            c.sx / 2 -
            r;


        const maxX =
            c.x +
            c.sx / 2 +
            r;


        const minZ =
            c.z -
            c.sz / 2 -
            r;


        const maxZ =
            c.z +
            c.sz / 2 +
            r;


        if (

            x > minX &&
            x < maxX &&
            z > minZ &&
            z < maxZ

        ) {

            return true;

        }

    }


    return false;

}


/* =========================================================
   MOVEMENT
========================================================= */

function updateMovement(
    dt
) {

    let moveX =
        0;

    let moveZ =
        0;


    if (
        keys["KeyW"]
    )
        moveZ += 1;


    if (
        keys["KeyS"]
    )
        moveZ -= 1;


    if (
        keys["KeyA"]
    )
        moveX -= 1;


    if (
        keys["KeyD"]
    )
        moveX += 1;


    if (
        moveX === 0 &&
        moveZ === 0
    ) {

        return;

    }


    const length =
        Math.hypot(
            moveX,
            moveZ
        );


    moveX /=
        length;


    moveZ /=
        length;


    const forwardX =
        -Math.sin(yaw);


    const forwardZ =
        -Math.cos(yaw);


    const rightX =
        Math.cos(yaw);


    const rightZ =
        -Math.sin(yaw);


    const worldX =
        forwardX * moveZ +
        rightX * moveX;


    const worldZ =
        forwardZ * moveZ +
        rightZ * moveX;


    const movement =
        player.speed *
        dt;


    const newX =
        player.position.x +
        worldX *
        movement;


    const newZ =
        player.position.z +
        worldZ *
        movement;


    if (
        !collides(
            newX,
            player.position.z
        )
    ) {

        player.position.x =
            newX;

    }


    if (
        !collides(
            player.position.x,
            newZ
        )
    ) {

        player.position.z =
            newZ;

    }

}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera() {

    camera.position.copy(
        player.position
    );


    camera.rotation.order =
        "YXZ";


    camera.rotation.y =
        yaw;


    camera.rotation.x =
        pitch;


    const direction =
        new THREE.Vector3(
            0,
            0,
            -1
        );


    direction.applyQuaternion(
        camera.quaternion
    );


    flashlight.position.copy(
        camera.position
    );


    flashlight.target.position.copy(
        camera.position
    ).add(
        direction.multiplyScalar(10)
    );

}


/* =========================================================
   MOUSE
========================================================= */

renderer.domElement.addEventListener(
    "click",
    function() {

        if (
            running &&
            document.pointerLockElement !==
            renderer.domElement
        ) {

            renderer.domElement.requestPointerLock();

        }

    }
);


document.addEventListener(
    "mousemove",
    function(event) {

        if (
            document.pointerLockElement !==
            renderer.domElement
        ) {

            return;

        }


        yaw -=
            event.movementX *
            .0022;


        pitch -=
            event.movementY *
            .0022;


        pitch =
            Math.max(

                -1.45,

                Math.min(
                    1.45,
                    pitch
                )

            );

    }
);


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(
    text
) {

    messageText.textContent =
        text;

    messageTimer =
        3;

}


/* =========================================================
   INTERACTION
========================================================= */

function interact() {

    if (
        !hasKey
    ) {

        const distance =
            player.position.distanceTo(
                key.position
            );


        if (
            distance < 3
        ) {

            if (
                !drawerOpened
            ) {

                drawerOpened =
                    true;


                drawers[2]
                    .position.z =
                    -1.25;


                showMessage(
                    "The drawer slides open."
                );

            }

            else {

                hasKey =
                    true;


                key.visible =
                    false;


                objectiveText.textContent =
                    "Find the maze.";


                showMessage(
                    "You found a key."
                );

            }

            return;

        }

    }


    /* Enter maze */

    if (
        hasKey &&
        !inMaze
    ) {

        const entrance =
            new THREE.Vector3(
                0,
                1.7,
                15
            );


        if (
            player.position.distanceTo(
                entrance
            ) < 5
        ) {

            enterMaze();

            return;

        }

    }


    /* Maze exit */

    if (
        inMaze
    ) {

        const exit =
            new THREE.Vector3(
                mazeOriginX +
                7 * mazeCell,

                1.7,

                mazeOriginZ +
                12 * mazeCell
            );


        if (
            player.position.distanceTo(
                exit
            ) < 4
        ) {

            mazeExit =
                true;

            showMessage(
                "..."
            );

        }

    }

}


/* =========================================================
   ENTER MAZE
========================================================= */

function enterMaze() {

    inMaze =
        true;


    player.position.set(

        mazeOriginX +
        mazeCell,

        1.7,

        mazeOriginZ +
        mazeCell

    );


    objectiveText.textContent =
        "Find the way out.";


    scene.fog.density =
        .075;


    ambient.intensity =
        .08;


    showMessage(
        "The door closes behind you."
    );

}


/* =========================================================
   RESET LOOP
========================================================= */

function resetLoop() {

    loopTime =
        60;


    hasKey =
        false;


    drawerOpened =
        false;


    inMaze =
        false;


    mazeExit =
        false;


    key.visible =
        true;


    drawers[2]
        .position.z =
        -.82;


    player.position.set(
        0,
        1.7,
        8
    );


    yaw =
        0;


    pitch =
        0;


    objectiveText.textContent =
        "Find the key.";


    timerText.textContent =
        "60.0";


    scene.fog.density =
        .032;


    ambient.intensity =
        .18;


    showMessage(
        "Something feels familiar."
    );

}


/* =========================================================
   HORROR EFFECT
========================================================= */

let flickerTimer =
    0;


/*
   The following system creates rare changes
   in the environment.

   No UI announcement is made.
*/

function updateAtmosphere(
    dt
) {

    flickerTimer -=
        dt;


    if (
        flickerTimer <= 0
    ) {

        flickerTimer =
            4 +
            Math.random() *
            8;


        if (
            flickerLights.length > 0
        ) {

            const light =
                flickerLights[
                    Math.floor(
                        Math.random() *
                        flickerLights.length
                    )
                ];


            const intensity =
                light.intensity;


            light.intensity =
                0;


            setTimeout(

                function() {

                    light.intensity =
                        intensity;

                },

                70 +
                Math.random() *
                300

            );

        }

    }

}


/* =========================================================
   SIMPLE AMBIENT AUDIO
========================================================= */

let audioContext =
    null;


let footstepTimer =
    0;


function startAudio() {

    try {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

    catch {

        audioContext =
            null;

    }

}


function makeFootstep() {

    if (
        !audioContext
    ) {

        return;

    }


    const oscillator =
        audioContext.createOscillator();


    const gain =
        audioContext.createGain();


    oscillator.type =
        "triangle";


    oscillator.frequency.value =
        55 +
        Math.random() *
        20;


    gain.gain.setValueAtTime(

        .0001,

        audioContext.currentTime

    );


    gain.gain.exponentialRampToValueAtTime(

        .025,

        audioContext.currentTime +
        .015

    );


    gain.gain.exponentialRampToValueAtTime(

        .0001,

        audioContext.currentTime +
        .14

    );


    oscillator.connect(
        gain
    );


    gain.connect(
        audioContext.destination
    );


    oscillator.start();


    oscillator.stop(

        audioContext.currentTime +
        .15

    );

}


/* =========================================================
   UPDATE
========================================================= */

function update(
    dt
) {

    if (
        !running
    ) {

        return;

    }


    updateMovement(
        dt
    );


    updateCamera();


    loopTime -=
        dt;


    if (
        loopTime <= 0
    ) {

        resetLoop();

    }


    timerText.textContent =
        loopTime.toFixed(1);


    updateAtmosphere(
        dt
    );


    /* Footsteps */

    const moving =
        keys["KeyW"] ||
        keys["KeyA"] ||
        keys["KeyS"] ||
        keys["KeyD"];


    if (
        moving
    ) {

        footstepTimer -=
            dt;


        if (
            footstepTimer <= 0
        ) {

            makeFootstep();


            footstepTimer =
                inMaze
                    ? .52
                    : .42;

        }

    }


    /* Message */

    if (
        messageTimer > 0
    ) {

        messageTimer -=
            dt;


        if (
            messageTimer <= 0
        ) {

            messageText.textContent =
                "";

        }

    }

}


/* =========================================================
   GAME LOOP
========================================================= */

let lastTime =
    performance.now();


function animate(
    time
) {

    requestAnimationFrame(
        animate
    );


    const dt =
        Math.min(

            (time - lastTime) /
            1000,

            .05

        );


    lastTime =
        time;


    update(
        dt
    );


    renderer.render(
        scene,
        camera
    );

}


/* =========================================================
   START BUTTON
========================================================= */

playButton.addEventListener(
    "click",
    function() {

        if (
            started
        ) {

            return;

        }


        started =
            true;


        running =
            true;


        menu.style.display =
            "none";


        startAudio();


        resetLoop();


        renderer.domElement.requestPointerLock();

    }
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    function() {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

            window.innerWidth,
            window.innerHeight

        );

    }
);


/* =========================================================
   INITIALISE
========================================================= */

resetLoop();

updateCamera();

animate(
    performance.now()
);

</script>
