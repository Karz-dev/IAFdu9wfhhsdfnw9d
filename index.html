<body>

        <div class="panel">

    <div id="endScreen">

            </button>
        </div>
    </div>

    <div id="hud">

        <div id="timer">
            60.0
        </div>

        </div>

        <div id="flashlightStatus">

        </div>

        <div id="crosshair"></div>

        <div id="message"></div>

    </div>

    <!-- Three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js"></script>

    <script>

        /* =========================================================
           BASIC SETUP
        ========================================================= */

        const scene = new THREE.Scene();

        scene.background = new THREE.Color(0x080a0e);

        scene.fog = new THREE.Fog(
            0x080a0e,
            8,
            35
        );


        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.05,
            100
        );


        const renderer = new THREE.WebGLRenderer({
            antialias: true
        });

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

        renderer.setPixelRatio(
            Math.min(window.devicePixelRatio, 2)
        );

        renderer.shadowMap.enabled = true;

        renderer.shadowMap.type =
            THREE.PCFSoftShadowMap;

        document.body.appendChild(renderer.domElement);


        /* =========================================================
           UI
        ========================================================= */

        const timerElement =
            document.getElementById("timer");

        const loopElement =
            document.getElementById("loopCounter");

        const flashlightElement =
            document.getElementById("flashlightStatus");

        const promptElement =
            document.getElementById("prompt");

        const messageElement =
            document.getElementById("message");

        const startScreen =
            document.getElementById("startScreen");

        const endScreen =
            document.getElementById("endScreen");

        const startButton =
            document.getElementById("startButton");

        const restartButton =
            document.getElementById("restartButton");


        /* =========================================================
           GAME STATE
        ========================================================= */

        let running = false;

        let loopNumber = 1;

        let timeLeft = 60;

        let lastTime = 0;

        let messageTimeout = null;

        let pointerLocked = false;


        /* =========================================================
           PLAYER
        ========================================================= */

        const player = {

            position: new THREE.Vector3(
                0,
                1.65,
                7
            ),

            yaw: 0,

            pitch: 0,

            radius: 0.28,

            speed: 3.3

        };


        /* =========================================================
           CONTROLS
        ========================================================= */

        const keys = {

            w: false,
            a: false,
            s: false,
            d: false

        };


        document.addEventListener(
            "keydown",
            event => {

                if (event.code === "KeyW") {
                    keys.w = true;
                    event.preventDefault();
                }

                if (event.code === "KeyA") {
                    keys.a = true;
                    event.preventDefault();
                }

                if (event.code === "KeyS") {
                    keys.s = true;
                    event.preventDefault();
                }

                if (event.code === "KeyD") {
                    keys.d = true;
                    event.preventDefault();
                }

                if (event.code === "KeyF") {
                    toggleFlashlight();
                }

                if (event.code === "KeyE") {
                    interact();
                }

            }
        );


        document.addEventListener(
            "keyup",
            event => {

                if (event.code === "KeyW") {
                    keys.w = false;
                }

                if (event.code === "KeyA") {
                    keys.a = false;
                }

                if (event.code === "KeyS") {
                    keys.s = false;
                }

                if (event.code === "KeyD") {
                    keys.d = false;
                }

            }
        );


        /* =========================================================
           MOUSE LOOK
        ========================================================= */

        renderer.domElement.addEventListener(
            "click",
            () => {

                if (running && !pointerLocked) {
                    renderer.domElement.requestPointerLock();
                }

            }
        );


        document.addEventListener(
            "pointerlockchange",
            () => {

                pointerLocked =
                    document.pointerLockElement ===
                    renderer.domElement;

            }
        );


        document.addEventListener(
            "mousemove",
            event => {

                if (!pointerLocked) {
                    return;
                }

                player.yaw -=
                    event.movementX * 0.0022;

                player.pitch -=
                    event.movementY * 0.0022;

                player.pitch =
                    Math.max(
                        -Math.PI / 2 + 0.05,
                        Math.min(
                            Math.PI / 2 - 0.05,
                            player.pitch
                        )
                    );

            }
        );


        /* =========================================================
           MATERIALS
        ========================================================= */

        const floorMaterial =
            new THREE.MeshStandardMaterial({
                color: 0x22252a,
                roughness: 0.95
            });


        const wallMaterial =
            new THREE.MeshStandardMaterial({
                color: 0x303238,
                roughness: 0.9
            });


        const darkWallMaterial =
            new THREE.MeshStandardMaterial({
                color: 0x181a1f,
                roughness: 1
            });


        const woodMaterial =
            new THREE.MeshStandardMaterial({
                color: 0x3a2b20,
                roughness: 0.8
            });


        const metalMaterial =
            new THREE.MeshStandardMaterial({
                color: 0x3e4248,
                metalness: 0.55,
                roughness: 0.55
            });


        const blackMaterial =
            new THREE.MeshStandardMaterial({
                color: 0x090a0c,
                roughness: 1
            });


        const whiteMaterial =
            new THREE.MeshStandardMaterial({
                color: 0xbfc3c9,
                roughness: 0.65
            });


        /* =========================================================
           HELPERS
        ========================================================= */

        function addBox(
            x,
            y,
            z,
            width,
            height,
            depth,
            material,
            collision = false
        ) {

            const mesh =
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        width,
                        height,
                        depth
                    ),
                    material
                );

            mesh.position.set(
                x,
                y,
                z
            );

            mesh.castShadow = true;
            mesh.receiveShadow = true;

            scene.add(mesh);

            if (collision) {

                colliders.push({
                    x: x,
                    z: z,
                    halfX: width / 2,
                    halfZ: depth / 2
                });

            }

            return mesh;

        }


        function addCylinder(
            x,
            y,
            z,
            radius,
            height,
            material
        ) {

            const mesh =
                new THREE.Mesh(
                    new THREE.CylinderGeometry(
                        radius,
                        radius,
                        height,
                        16
                    ),
                    material
                );

            mesh.position.set(
                x,
                y,
                z
            );

            mesh.castShadow = true;
            mesh.receiveShadow = true;

            scene.add(mesh);

            return mesh;

        }


        /* =========================================================
           COLLISION
        ========================================================= */

        let colliders = [];


        function circleIntersectsBox(
            px,
            pz,
            radius,
            box
        ) {

            const closestX =
                Math.max(
                    box.x - box.halfX,
                    Math.min(
                        px,
                        box.x + box.halfX
                    )
                );


            const closestZ =
                Math.max(
                    box.z - box.halfZ,
                    Math.min(
                        pz,
                        box.z + box.halfZ
                    )
                );


            const dx =
                px - closestX;

            const dz =
                pz - closestZ;


            return (
                dx * dx +
                dz * dz
            ) < radius * radius;

        }


        function canMoveTo(x, z) {

            for (const box of colliders) {

                if (
                    circleIntersectsBox(
                        x,
                        z,
                        player.radius,
                        box
                    )
                ) {
                    return false;
                }

            }

            return true;

        }


        /* =========================================================
           OFFICE
        ========================================================= */

        function buildOffice() {

            /*
                Office occupies the area around z = 7.
                Maze entrance is behind the office.
            */

            addBox(
                0,
                -0.1,
                7,
                14,
                0.2,
                12,
                floorMaterial
            );


            /* Back wall */

            addBox(
                0,
                2,
                13,
                14,
                4,
                0.3,
                wallMaterial,
                true
            );


            /* Left wall */

            addBox(
                -7,
                2,
                7,
                0.3,
                4,
                12,
                wallMaterial,
                true
            );


            /* Right wall */

            addBox(
                7,
                2,
                7,
                0.3,
                4,
                12,
                wallMaterial,
                true
            );


            /* Front wall with entrance */

            addBox(
                -4.8,
                2,
                1,
                4.4,
                4,
                0.3,
                wallMaterial,
                true
            );

            addBox(
                4.8,
                2,
                1,
                4.4,
                4,
                0.3,
                wallMaterial,
                true
            );


            /* Ceiling */

            addBox(
                0,
                4,
                7,
                14,
                0.2,
                12,
                darkWallMaterial
            );


            buildDesk();

            buildChair();

            buildBookshelves();

            buildCabinets();

            buildOfficeLights();

        }


        /* =========================================================
           DESK
        ========================================================= */

        function buildDesk() {

            const deskX = -1.5;
            const deskZ = 6;


            addBox(
                deskX,
                1.05,
                deskZ,
                3.4,
                0.18,
                1.5,
                woodMaterial,
                true
            );


            addBox(
                deskX - 1.35,
                0.5,
                deskZ,
                0.18,
                1,
                1.3,
                woodMaterial,
                true
            );


            addBox(
                deskX + 1.35,
                0.5,
                deskZ,
                0.18,
                1,
                1.3,
                woodMaterial,
                true
            );


            /* Monitor */

            addBox(
                deskX,
                1.65,
                deskZ - 0.2,
                1.35,
                0.85,
                0.12,
                blackMaterial
            );


            addBox(
                deskX,
                1.22,
                deskZ - 0.2,
                0.12,
                0.35,
                0.12,
                metalMaterial
            );


            addBox(
                deskX,
                1.08,
                deskZ - 0.2,
                0.55,
                0.08,
                0.3,
                metalMaterial
            );


            /* Monitor glow */

            const screenLight =
                new THREE.PointLight(
                    0x4b6bff,
                    0.8,
                    3
                );

            screenLight.position.set(
                deskX,
                1.65,
                deskZ - 0.4
            );

            scene.add(screenLight);


            /* Keyboard */

            addBox(
                deskX,
                1.17,
                deskZ - 0.65,
                1.1,
                0.05,
                0.35,
                whiteMaterial
            );


            /* Coffee mug */

            addCylinder(
                deskX + 1.05,
                1.28,
                deskZ - 0.35,
                0.13,
                0.25,
                whiteMaterial
            );

        }


        /* =========================================================
           CHAIR
        ========================================================= */

        function buildChair() {

            const x = -1.5;
            const z = 7.7;


            addBox(
                x,
                0.75,
                z,
                1.1,
                0.15,
                1,
                blackMaterial,
                true
            );


            addBox(
                x,
                1.45,
                z + 0.4,
                1,
                1.4,
                0.15,
                blackMaterial,
                true
            );


            addCylinder(
                x,
                0.35,
                z,
                0.08,
                0.8,
                metalMaterial
            );

        }


        /* =========================================================
           BOOKSHELVES
        ========================================================= */

        function buildBookshelves() {

            createShelf(
                -5.8,
                10.8
            );

            createShelf(
                5.8,
                10.8
            );

        }


        function createShelf(x, z) {

            addBox(
                x,
                2,
                z,
                1.8,
                3.7,
                0.45,
                woodMaterial,
                true
            );


            for (let row = 0; row < 4; row++) {

                addBox(
                    x,
                    0.55 + row * 0.85,
                    z - 0.27,
                    1.55,
                    0.08,
                    0.12,
                    metalMaterial
                );


                for (let i = 0; i < 5; i++) {

                    const bookHeight =
                        0.45 +
                        Math.random() * 0.25;

                    addBox(
                        x - 0.6 + i * 0.3,
                        0.8 + row * 0.85,
                        z - 0.3,
                        0.18,
                        bookHeight,
                        0.15,
                        new THREE.MeshStandardMaterial({
                            color:
                                new THREE.Color(
                                    Math.random() * 0.15 + 0.08,
                                    Math.random() * 0.15 + 0.08,
                                    Math.random() * 0.15 + 0.08
                                )
                        })
                    );

                }

            }

        }


        /* =========================================================
           FILING CABINETS
        ========================================================= */

        let importantDrawer = null;

        let drawerOpen = false;

        let keyCollected = false;


        function buildCabinets() {

            createCabinet(
                4.5,
                8.5,
                false
            );


            createCabinet(
                5.8,
                5.5,
                true
            );

        }


        function createCabinet(
            x,
            z,
            containsKey
        ) {

            const cabinet =
                addBox(
                    x,
                    1.05,
                    z,
                    1.25,
                    2.1,
                    0.8,
                    metalMaterial,
                    true
                );


            for (let i = 0; i < 3; i++) {

                const drawer =
                    addBox(
                        x,
                        1.6 - i * 0.55,
                        z - 0.43,
                        1.0,
                        0.38,
                        0.08,
                        darkWallMaterial
                    );


                addBox(
                    x,
                    1.6 - i * 0.55,
                    z - 0.49,
                    0.15,
                    0.04,
                    0.04,
                    metalMaterial
                );


                if (containsKey && i === 1) {

                    importantDrawer = drawer;

                }

            }

        }


        /* =========================================================
           KEY
        ========================================================= */

        const key = new THREE.Group();


        const keyRing =
            new THREE.Mesh(
                new THREE.TorusGeometry(
                    0.11,
                    0.035,
                    8,
                    16
                ),
                new THREE.MeshStandardMaterial({
                    color: 0xd7b94d,
                    metalness: 0.8,
                    roughness: 0.3
                })
            );


        key.add(keyRing);


        const keyStem =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    0.06,
                    0.06,
                    0.45
                ),
                new THREE.MeshStandardMaterial({
                    color: 0xd7b94d,
                    metalness: 0.8,
                    roughness: 0.3
                })
            );


        keyStem.position.z = 0.25;

        key.add(keyStem);


        key.position.set(
            5.8,
            1.2,
            5.85
        );


        key.rotation.x =
            Math.PI / 2;


        scene.add(key);


        /* =========================================================
           OFFICE LIGHTING
        ========================================================= */

        function buildOfficeLights() {

            const ambient =
                new THREE.HemisphereLight(
                    0x75809a,
                    0x08090b,
                    0.28
                );

            scene.add(ambient);


            const lightPositions = [
                [-4, 3.5, 4],
                [0, 3.5, 7],
                [4, 3.5, 10]
            ];


            for (const position of lightPositions) {

                const light =
                    new THREE.PointLight(
                        0xb8c4d8,
                        0.55,
                        7
                    );

                light.position.set(
                    position[0],
                    position[1],
                    position[2]
                );

                light.castShadow = true;

                scene.add(light);

            }

        }


        /* =========================================================
           MAZE
        ========================================================= */

        const maze = [

            "#######.#######",
            "#S............#",
            "#.#####.#####.#",
            "#.#...#.#.....#",
            "#.#.#.#.#.###.#",
            "#...#...#...#.#",
            "###.#####.#.#.#",
            "#...#.....#...#",
            "#.###.#########",
            "#.....#.......#",
            "#.#####.#####.#",
            "#.......#...K.#",
            "#######.#######"

        ];


        const mazeCell = 1;

        const mazeWidth =
            maze[0].length *
            mazeCell;

        const mazeStartZ = -1;


        const mazeOriginX =
            -mazeWidth / 2 +
            mazeCell / 2;


        const mazeOriginZ =
            mazeStartZ +
            mazeCell / 2;


        function buildMaze() {

            for (
                let row = 0;
                row < maze.length;
                row++
            ) {

                for (
                    let col = 0;
                    col < maze[row].length;
                    col++
                ) {

                    const tile =
                        maze[row][col];


                    const x =
                        mazeOriginX +
                        col * mazeCell;


                    const z =
                        mazeOriginZ +
                        row * mazeCell;


                    if (tile === "#") {

                        addBox(
                            x,
                            1.5,
                            z,
                            1,
                            3,
                            1,
                            darkWallMaterial,
                            true
                        );

                    }

                }

            }


            /* Maze floor */

            const floorWidth =
                maze[0].length;

            const floorDepth =
                maze.length;


            addBox(
                0,
                -0.1,
                mazeStartZ +
                floorDepth / 2,
                floorWidth,
                0.2,
                floorDepth,
                floorMaterial
            );


            /* Entrance marker */

            addBox(
                0,
                0.03,
                0.1,
                1.2,
                0.04,
                0.15,
                new THREE.MeshStandardMaterial({
                    color: 0x343944,
                    emissive: 0x101217
                })
            );

        }


        buildOffice();

        buildMaze();


        /* =========================================================
           MAZE EXIT
        ========================================================= */

        const exitGroup =
            new THREE.Group();


        const exitFrameMaterial =
            new THREE.MeshStandardMaterial({
                color: 0x20242a,
                roughness: 0.8
            });


        const exitGlowMaterial =
            new THREE.MeshStandardMaterial({
                color: 0x304020,
                emissive: 0x18220f,
                emissiveIntensity: 0.8
            });


        addBox(
            -0.6,
            1.4,
            -7.2,
            0.15,
            2.8,
            0.2,
            exitFrameMaterial
        );


        addBox(
            0.6,
            1.4,
            -7.2,
            0.15,
            2.8,
            0.2,
            exitFrameMaterial
        );


        addBox(
            0,
            2.75,
            -7.2,
            1.4,
            0.15,
            0.2,
            exitFrameMaterial
        );


        const exitLight =
            new THREE.PointLight(
                0x88aa66,
                0.25,
                3
            );

        exitLight.position.set(
            0,
            2,
            -7
        );

        scene.add(exitLight);


        /* =========================================================
           FLASHLIGHT
        ========================================================= */

        /*
            You start with this.
        */

        let flashlightOn = false;


        const flashlight =
            new THREE.SpotLight(
                0xffffff,
                0,
                22,
                Math.PI / 7,
                0.55,
                1.4
            );


        flashlight.castShadow = true;

        flashlight.shadow.mapSize.width = 1024;
        flashlight.shadow.mapSize.height = 1024;

        camera.add(flashlight);


        const flashlightTarget =
            new THREE.Object3D();


        scene.add(flashlightTarget);

        flashlight.target =
            flashlightTarget;


        function toggleFlashlight() {

            flashlightOn =
                !flashlightOn;

            flashlightElement.textContent =
                flashlightOn
                    ? "Flashlight: ON"
                    : "Flashlight: OFF";

            flashlight.intensity =
                flashlightOn
                    ? 7
                    : 0;

            if (audioReady) {
                shortTone(
                    flashlightOn ? 520 : 260,
                    0.07,
                    0.035
                );
            }

        }


        function updateFlashlight() {

            flashlightTarget.position.copy(
                camera.position
            );


            const direction =
                new THREE.Vector3(
                    0,
                    0,
                    -1
                );


            direction.applyQuaternion(
                camera.quaternion
            );


            flashlightTarget.position.add(
                direction.multiplyScalar(10)
            );

        }


        /* =========================================================
           AUDIO
        ========================================================= */

        let audioContext = null;

        let masterGain = null;

        let ambientGain = null;

        let audioReady = false;

        let stepTimer = 0;

        let ambientTimer = 5;


        function startAudio() {

            if (audioReady) {

                if (
                    audioContext.state ===
                    "suspended"
                ) {
                    audioContext.resume();
                }

                return;

            }


            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();


            masterGain =
                audioContext.createGain();

            masterGain.gain.value =
                0.5;

            masterGain.connect(
                audioContext.destination
            );


            ambientGain =
                audioContext.createGain();

            ambientGain.gain.value =
                0.025;

            ambientGain.connect(
                masterGain
            );


            const hum =
                audioContext.createOscillator();

            const humGain =
                audioContext.createGain();


            hum.type = "sine";

            hum.frequency.value =
                45;

            humGain.gain.value =
                0.08;


            hum.connect(
                humGain
            );

            humGain.connect(
                ambientGain
            );

            hum.start();


            audioReady = true;

        }


        function shortTone(
            frequency,
            duration,
            volume,
            type = "sine"
        ) {

            if (!audioReady) {
                return;
            }


            const now =
                audioContext.currentTime;


            const oscillator =
                audioContext.createOscillator();


            const gain =
                audioContext.createGain();


            oscillator.type =
                type;


            oscillator.frequency.value =
                frequency;


            gain.gain.setValueAtTime(
                0.0001,
                now
            );


            gain.gain.exponentialRampToValueAtTime(
                volume,
                now + 0.01
            );


            gain.gain.exponentialRampToValueAtTime(
                0.0001,
                now + duration
            );


            oscillator.connect(gain);

            gain.connect(masterGain);


            oscillator.start(now);

            oscillator.stop(
                now +
                duration +
                0.02
            );

        }


        function footstep() {

            shortTone(
                70 + Math.random() * 25,
                0.09,
                0.055,
                "triangle"
            );

        }


        function drawerSound() {

            shortTone(
                90,
                0.25,
                0.08,
                "sawtooth"
            );

        }


        function keySound() {

            shortTone(
                650,
                0.15,
                0.07
            );


            setTimeout(
                () => {
                    shortTone(
                        900,
                        0.2,
                        0.06
                    );
                },
                100
            );

        }


        function doorSound() {

            shortTone(
                55,
                0.7,
                0.09,
                "sawtooth"
            );

        }


        function strangeAmbient() {

            shortTone(
                125,
                2.1,
                0.025
            );

        }


        /* =========================================================
           HORROR SURPRISE
           ========================================================= */

        const watcher =
            new THREE.Group();


        const watcherBody =
            new THREE.Mesh(
                new THREE.CylinderGeometry(
                    0.2,
                    0.3,
                    1.7,
                    8
                ),
                new THREE.MeshStandardMaterial({
                    color: 0x020203,
                    roughness: 1
                })
            );


        watcherBody.position.y =
            0.9;


        watcher.add(
            watcherBody
        );


        const watcherHead =
            new THREE.Mesh(
                new THREE.SphereGeometry(
                    0.21,
                    12,
                    12
                ),
                new THREE.MeshStandardMaterial({
                    color: 0x010101,
                    roughness: 1
                })
            );


        watcherHead.position.y =
            1.9;


        watcher.add(
            watcherHead
        );


        watcher.visible = false;

        scene.add(watcher);


        const watcherSpots = [

            {
                x: -1.5,
                z: 10.1
            },

            {
                x: 2.5,
                z: 12.1
            },

            {
                x: -2.5,
                z: 15.1
            },

            {
                x: 3.5,
                z: 17.1
            },

            {
                x: -3.5,
                z: 20.1
            }

        ];


        let watcherTimer = 8;

        let watcherActive = false;


        function updateWatcher(dt) {

            if (
                !keyCollected ||
                player.position.z >
                mazeStartZ + 1
            ) {

                watcher.visible =
                    false;

                watcherActive =
                    false;

                return;

            }


            watcherTimer -= dt;


            if (
                watcherTimer <= 0 &&
                !watcherActive
            ) {

                watcherTimer =
                    7 +
                    Math.random() * 11;


                if (
                    Math.random() <
                    0.42
                ) {

                    const spot =
                        watcherSpots[
                            Math.floor(
                                Math.random() *
                                watcherSpots.length
                            )
                        ];


                    watcher.position.set(
                        spot.x,
                        0,
                        spot.z
                    );


                    watcher.lookAt(
                        player.position.x,
                        1.2,
                        player.position.z
                    );


                    watcher.visible =
                        true;

                    watcherActive =
                        true;


                    if (audioReady) {
                        strangeAmbient();
                    }


                    setTimeout(
                        () => {

                            watcher.visible =
                                false;

                            watcherActive =
                                false;

                        },
                        700 +
                        Math.random() * 1000
                    );

                }

            }

        }


        /* =========================================================
           INTERACTION
        ========================================================= */

        function showMessage(text) {

            messageElement.textContent =
                text;

            messageElement.style.opacity =
                "1";


            clearTimeout(
                messageTimeout
            );


            messageTimeout =
                setTimeout(
                    () => {

                        messageElement.style.opacity =
                            "0";

                    },
                    2200
                );

        }


        function interact() {

            if (!running) {
                return;
            }


            const distanceToDrawer =
                player.position.distanceTo(
                    new THREE.Vector3(
                        5.8,
                        1.5,
                        5.5
                    )
                );


            if (
                distanceToDrawer < 1.8 &&
                !keyCollected
            ) {

                drawerOpen =
                    !drawerOpen;


                if (drawerOpen) {

                    importantDrawer.position.z =
                        5.55;

                    key.visible =
                        true;

                    showMessage(
                        "You found something."
                    );

                    drawerSound();

                }

                return;

            }


            if (
                key.visible &&
                !keyCollected &&
                player.position.distanceTo(
                    key.position
                ) < 1.4
            ) {

                keyCollected =
                    true;

                key.visible =
                    false;

                showMessage(
                    "A key."
                );

                keySound();

                return;

            }


            if (
                keyCollected &&
                player.position.z <
                -6.3 &&
                Math.abs(
                    player.position.x
                ) < 1.5
            ) {

                showMessage(
                    "The door opens."
                );

                doorSound();

                setTimeout(
                    () => {

                        completeLoop();

                    },
                    700
                );

                return;

            }

        }


        /* =========================================================
           PROMPT
        ========================================================= */

        function updatePrompt() {

            promptElement.style.opacity =
                "0";


            if (!running) {
                return;
            }


            const drawerDistance =
                Math.hypot(
                    player.position.x - 5.8,
                    player.position.z - 5.5
                );


            if (
                drawerDistance < 1.8 &&
                !keyCollected
            ) {

                promptElement.textContent =
                    drawerOpen
                        ? "E  Close drawer"
                        : "E  Open drawer";

                promptElement.style.opacity =
                    "1";

                return;

            }


            if (
                key.visible &&
                !keyCollected &&
                player.position.distanceTo(
                    key.position
                ) < 1.4
            ) {

                promptElement.textContent =
                    "E  Take key";

                promptElement.style.opacity =
                    "1";

                return;

            }


            if (
                keyCollected &&
                player.position.z <
                -6.3 &&
                Math.abs(
                    player.position.x
                ) < 1.5
            ) {

                promptElement.textContent =
                    "E  Enter";

                promptElement.style.opacity =
                    "1";

            }

        }


        /* =========================================================
           MOVEMENT
        ========================================================= */

        function updateMovement(dt) {

            let moveForward = 0;

            let moveSide = 0;


            if (keys.w) {
                moveForward += 1;
            }

            if (keys.s) {
                moveForward -= 1;
            }

            if (keys.d) {
                moveSide += 1;
            }

            if (keys.a) {
                moveSide -= 1;
            }


            const moving =
                moveForward !== 0 ||
                moveSide !== 0;


            if (!moving) {

                stepTimer = 0;

                return false;

            }


            const length =
                Math.hypot(
                    moveForward,
                    moveSide
                );


            moveForward /= length;
            moveSide /= length;


            /*
                IMPORTANT:

                W = forward
                S = backward
                A = left
                D = right

                This is based directly on
                the camera's yaw.
            */

            const forwardX =
                -Math.sin(
                    player.yaw
                );


            const forwardZ =
                -Math.cos(
                    player.yaw
                );


            const rightX =
                Math.cos(
                    player.yaw
                );


            const rightZ =
                -Math.sin(
                    player.yaw
                );


            const velocityX =
                (
                    forwardX *
                    moveForward
                ) +
                (
                    rightX *
                    moveSide
                );


            const velocityZ =
                (
                    forwardZ *
                    moveForward
                ) +
                (
                    rightZ *
                    moveSide
                );


            const distance =
                player.speed *
                dt;


            const nextX =
                player.position.x +
                velocityX *
                distance;


            const nextZ =
                player.position.z +
                velocityZ *
                distance;


            /*
                Check X and Z separately so
                you can slide along walls.
            */

            if (
                canMoveTo(
                    nextX,
                    player.position.z
                )
            ) {

                player.position.x =
                    nextX;

            }


            if (
                canMoveTo(
                    player.position.x,
                    nextZ
                )
            ) {

                player.position.z =
                    nextZ;

            }


            /* Footsteps */

            stepTimer -= dt;


            if (stepTimer <= 0) {

                footstep();

                stepTimer = 0.42;

            }


            return true;

        }


        /* =========================================================
           CAMERA
        ========================================================= */

        function updateCamera() {

            camera.position.copy(
                player.position
            );


            camera.rotation.order =
                "YXZ";


            camera.rotation.y =
                player.yaw;


            camera.rotation.x =
                player.pitch;


            updateFlashlight();

        }


        /* =========================================================
           LOOP RESET
        ========================================================= */

        function resetLoop() {

            player.position.set(
                0,
                1.65,
                7
            );


            player.yaw = 0;

            player.pitch = 0;


            timeLeft = 60;


            keyCollected =
                false;


            drawerOpen =
                false;


            importantDrawer.position.z =
                5.5;


            key.visible =
                false;


            watcher.visible =
                false;

            watcherActive =
                false;

            watcherTimer =
                8;


            timerElement.textContent =
                "60.0";


            loopElement.textContent =
                "Loop " +
                loopNumber;


            updateCamera();

        }


        /* =========================================================
           COMPLETE LOOP
        ========================================================= */

        function completeLoop() {

            if (!running) {
                return;
            }


            loopNumber++;


            showMessage(
                "Everything resets..."
            );


            setTimeout(
                () => {

                    resetLoop();

                },
                1000
            );

        }


        /* =========================================================
           GAME OVER
        ========================================================= */

        function gameOver() {

            running =
                false;


            if (
                document.pointerLockElement
            ) {

                document.exitPointerLock();

            }


            endScreen.style.display =
                "flex";

        }


        /* =========================================================
           START GAME
        ========================================================= */

        function startGame() {

            startAudio();


            loopNumber =
                1;


            resetLoop();


            running =
                true;


            startScreen.style.display =
                "none";


            endScreen.style.display =
                "none";


            renderer.domElement.requestPointerLock();


            lastTime =
                performance.now();


            requestAnimationFrame(
                gameLoop
            );

        }


        startButton.addEventListener(
            "click",
            event => {

                event.stopPropagation();

                startGame();

            }
        );


        restartButton.addEventListener(
            "click",
            event => {

                event.stopPropagation();

                startGame();

            }
        );


        /* =========================================================
           GAME LOOP
        ========================================================= */

        function gameLoop(time) {

            if (!running) {
                return;
            }


            const dt =
                Math.min(
                    (time - lastTime) /
                    1000,
                    0.05
                );


            lastTime =
                time;


            timeLeft -= dt;


            if (timeLeft <= 0) {

                timeLeft = 0;

                timerElement.textContent =
                    "0.0";

                gameOver();

                return;

            }


            timerElement.textContent =
                timeLeft.toFixed(1);


            updateMovement(dt);

            updateCamera();

            updatePrompt();

            updateWatcher(dt);


            /* Ambient sounds */

            ambientTimer -= dt;


            if (ambientTimer <= 0) {

                strangeAmbient();

                ambientTimer =
                    7 +
                    Math.random() * 12;

            }


            renderer.render(
                scene,
                camera
            );


            requestAnimationFrame(
                gameLoop
            );

        }


        /* =========================================================
           RESIZE
        ========================================================= */

        window.addEventListener(
            "resize",
            () => {

                camera.aspect =
                    window.innerWidth /
                    window.innerHeight;


                camera.updateProjectionMatrix();


                renderer.setSize(
                    window.innerWidth,
                    window.innerHeight
                );

            }
        );


        /* =========================================================
           INITIAL STATE
        ========================================================= */

        resetLoop();

        renderer.render(
            scene,
            camera
        );

    </script>

</body>
