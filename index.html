<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOOP</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
}

canvas {
    display: block;
}

#menu {
    position: fixed;
    inset: 0;
    z-index: 10;
    background:
        radial-gradient(circle at center, #151515 0%, #030303 65%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

#menu h1 {
    font-size: 72px;
    letter-spacing: 18px;
    margin: 0;
}

#menu p {
    color: #888;
    margin: 15px 0 35px;
}

button {
    padding: 15px 45px;
    border: 1px solid #777;
    background: #111;
    color: white;
    font-size: 20px;
    cursor: pointer;
}

button:hover {
    background: #222;
}

#hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 5;
    display: none;
}

#timer {
    position: absolute;
    top: 20px;
    left: 25px;
    font-size: 28px;
    font-weight: bold;
}

#objective {
    position: absolute;
    top: 60px;
    left: 25px;
    color: #aaa;
}

#message {
    position: absolute;
    bottom: 80px;
    width: 100%;
    text-align: center;
    font-size: 20px;
    opacity: 0;
}

#crosshair {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 5px;
    height: 5px;
    background: white;
    transform: translate(-50%, -50%);
    border-radius: 50%;
}

#controls {
    position: absolute;
    bottom: 20px;
    left: 25px;
    color: #777;
    font-size: 13px;
}

#end {
    position: fixed;
    inset: 0;
    z-index: 20;
    background: rgba(0,0,0,.92);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
}

#end h1 {
    font-size: 55px;
}
</style>
</head>

<body>

<div id="menu">
    <h1>LOOP</h1>
    <p>60 seconds. Find your way out.</p>
    <button id="play">ENTER</button>
</div>

<div id="hud">
    <div id="timer">60</div>
    <div id="objective">Find the key.</div>
    <div id="crosshair"></div>
    <div id="message"></div>
    <div id="controls">
        WASD — Move &nbsp; | &nbsp;
        Mouse — Look &nbsp; | &nbsp;
        E — Interact &nbsp; | &nbsp;
        F — Flashlight
    </div>
</div>

<div id="end">
    <h1>LOOP RESET</h1>
    <p>You remember what happened.</p>
</div>


<script type="module">

/* =========================================================
   THREE.JS
========================================================= */

import * as THREE from "./three.module.min.js";


/* =========================================================
   BASIC SETUP
========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x050505);

scene.fog = new THREE.Fog(
    0x050505,
    8,
    45
);


const camera = new THREE.PerspectiveCamera(
    75,
    innerWidth / innerHeight,
    0.1,
    100
);


const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(devicePixelRatio, 2)
);

renderer.shadowMap.enabled = true;

document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   PLAYER
========================================================= */

const player = new THREE.Object3D();

player.position.set(
    0,
    1.7,
    7
);

scene.add(player);

player.add(camera);

camera.position.set(
    0,
    0,
    0
);


let yaw = 0;
let pitch = 0;

let mouseDown = false;

renderer.domElement.addEventListener(
    "mousedown",
    () => mouseDown = true
);

window.addEventListener(
    "mouseup",
    () => mouseDown = false
);

window.addEventListener(
    "mousemove",
    e => {

        if (!mouseDown || !running)
            return;

        yaw -= e.movementX * 0.002;

        pitch -= e.movementY * 0.002;

        pitch = THREE.MathUtils.clamp(
            pitch,
            -1.45,
            1.45
        );

        player.rotation.y = yaw;

        camera.rotation.x = pitch;
    }
);


/* =========================================================
   MOVEMENT
========================================================= */

const keys = {};

window.addEventListener(
    "keydown",
    e => {

        keys[e.code] = true;

        if (
            e.code === "KeyF" &&
            running
        ) {

            flashlightOn =
                !flashlightOn;

            flashlight.visible =
                flashlightOn;

        }

        if (
            e.code === "KeyE" &&
            running
        ) {

            interact();

        }

    }
);

window.addEventListener(
    "keyup",
    e => {

        keys[e.code] = false;

    }
);


/* =========================================================
   FLASHLIGHT
========================================================= */

const flashlight =
    new THREE.SpotLight(
        0xffffff,
        8,
        28,
        Math.PI / 7,
        0.45,
        1.5
    );

flashlight.position.set(
    0,
    -0.1,
    -0.1
);

flashlight.target.position.set(
    0,
    -0.1,
    -10
);

camera.add(
    flashlight
);

camera.add(
    flashlight.target
);

let flashlightOn = true;


/* =========================================================
   MATERIALS
========================================================= */

const wallMat =
    new THREE.MeshStandardMaterial({
        color: 0x353535,
        roughness: 0.85
    });

const floorMat =
    new THREE.MeshStandardMaterial({
        color: 0x202020,
        roughness: 1
    });

const ceilingMat =
    new THREE.MeshStandardMaterial({
        color: 0x111111
    });

const woodMat =
    new THREE.MeshStandardMaterial({
        color: 0x29231d
    });

const metalMat =
    new THREE.MeshStandardMaterial({
        color: 0x555555,
        metalness: 0.5,
        roughness: 0.6
    });


/* =========================================================
   HELPERS
========================================================= */

const colliders = [];

function box(
    x,
    y,
    z,
    sx,
    sy,
    sz,
    material = wallMat,
    collide = true
) {

    const mesh =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                sx,
                sy,
                sz
            ),
            material
        );

    mesh.position.set(
        x,
        y,
        z
    );

    mesh.castShadow = true;
    mesh.receiveShadow = true;

    scene.add(mesh);

    if (collide)
        colliders.push(mesh);

    return mesh;
}


/* =========================================================
   OFFICE
========================================================= */

box(
    0,
    -0.1,
    0,
    30,
    0.2,
    30,
    floorMat,
    false
);

box(
    0,
    5,
    0,
    30,
    0.2,
    30,
    ceilingMat,
    false
);


/* Outer walls */

box(
    -15,
    2.5,
    0,
    0.5,
    5,
    30
);

box(
    15,
    2.5,
    0,
    0.5,
    5,
    30
);

box(
    0,
    2.5,
    -15,
    30,
    5,
    0.5
);


/* Back wall with opening */

box(
    -10,
    2.5,
    15,
    10,
    5,
    0.5
);

box(
    10,
    2.5,
    15,
    10,
    5,
    0.5
);


/* =========================================================
   OFFICE DESKS
========================================================= */

function makeDesk(x, z) {

    box(
        x,
        1.05,
        z,
        3.2,
        0.25,
        1.5,
        woodMat
    );

    for (
        const dx of [-1.25, 1.25]
    ) {

        box(
            x + dx,
            0.5,
            z,
            0.18,
            1,
            1.2,
            metalMat
        );

    }

}


makeDesk(-6, 2);
makeDesk(1, 2);
makeDesk(7, 2);

makeDesk(-6, -5);
makeDesk(2, -5);


/* =========================================================
   CHAIRS
========================================================= */

function makeChair(x, z) {

    box(
        x,
        0.65,
        z,
        1,
        0.15,
        1,
        metalMat
    );

    box(
        x,
        1.3,
        z + 0.45,
        0.9,
        1.2,
        0.15,
        metalMat
    );

}

makeChair(-6, 4);
makeChair(1, 4);
makeChair(7, 4);
makeChair(-6, -3.2);
makeChair(2, -3.2);


/* =========================================================
   BOOKSHELF
========================================================= */

function bookshelf(x, z) {

    box(
        x,
        2,
        z,
        3,
        4,
        0.5,
        woodMat
    );

    for (
        let y = 0.8;
        y < 4;
        y += 0.8
    ) {

        box(
            x,
            y,
            z - 0.32,
            2.5,
            0.08,
            0.6,
            metalMat,
            false
        );

    }

}

bookshelf(11, -7);
bookshelf(-11, -7);


/* =========================================================
   FILING CABINET
========================================================= */

const cabinet =
    box(
        -10,
        1.5,
        5,
        2,
        3,
        1.5,
        metalMat
    );

let cabinetOpen = false;

const key = new THREE.Mesh(
    new THREE.TorusGeometry(
        0.13,
        0.035,
        8,
        16
    ),
    new THREE.MeshStandardMaterial({
        color: 0xffcc33,
        emissive: 0x553300
    })
);

key.rotation.x =
    Math.PI / 2;

key.position.set(
    -10,
    2.2,
    4.1
);

scene.add(key);


/* =========================================================
   MAZE
========================================================= */

const maze = [
    "#################",
    "#...............#",
    "#.#####.#######.#",
    "#.#...#.#.......#",
    "#.#.#.#.#.#####.#",
    "#...#...#.....#.#",
    "###.#####.###.#.#",
    "#...#.....#...#.#",
    "#.###.#####.###.#",
    "#.....#.........#",
    "#.#####.#########",
    "#.......#.......#",
    "#######.#.......#",
    "#...............#",
    "#################"
];

const CELL = 2;

const mazeObjects = [];

const mazeStartX = 2;
const mazeStartZ = 17;

for (
    let z = 0;
    z < maze.length;
    z++
) {

    for (
        let x = 0;
        x < maze[z].length;
        x++
    ) {

        if (
            maze[z][x] === "#"
        ) {

            const wall =
                box(
                    mazeStartX +
                    x * CELL,
                    1.5,
                    mazeStartZ -
                    z * CELL,
                    CELL,
                    3,
                    CELL,
                    wallMat
                );

            mazeObjects.push(wall);

        }

    }

}


/* Maze entrance */

const mazeEntrance =
    new THREE.Vector3(
        mazeStartX + 1 * CELL,
        1.7,
        mazeStartZ - 1 * CELL
    );


/* Maze exit */

const mazeExit =
    new THREE.Vector3(
        mazeStartX + 15 * CELL,
        1.7,
        mazeStartZ - 13 * CELL
    );


/* =========================================================
   LIGHTS
========================================================= */

const lights = [];

function ceilingLight(x, z) {

    const light =
        new THREE.PointLight(
            0xfff1d0,
            2.2,
            9
        );

    light.position.set(
        x,
        4.6,
        z
    );

    light.castShadow = true;

    scene.add(light);

    lights.push(light);

}

ceilingLight(-7, 8);
ceilingLight(5, 8);
ceilingLight(-7, -1);
ceilingLight(6, -5);
ceilingLight(0, 11);


/* =========================================================
   HORROR LIGHT FLICKER
========================================================= */

setInterval(
    () => {

        if (!running)
            return;

        for (const light of lights) {

            if (
                Math.random() < 0.12
            ) {

                light.intensity =
                    Math.random() * 1.5;

            } else {

                light.intensity =
                    2.2;

            }

        }

    },
    180
);


/* =========================================================
   COLLISION
========================================================= */

function blocked(
    position
) {

    const radius = 0.45;

    for (
        const object of colliders
    ) {

        const box =
            new THREE.Box3()
                .setFromObject(object);

        if (
            position.x >
                box.min.x - radius &&
            position.x <
                box.max.x + radius &&
            position.z >
                box.min.z - radius &&
            position.z <
                box.max.z + radius
        ) {

            return true;

        }

    }

    return false;

}


/* =========================================================
   INTERACTION
========================================================= */

let hasKey = false;

function interact() {

    const distance =
        player.position.distanceTo(
            cabinet.position
        );

    if (
        distance < 3 &&
        !cabinetOpen
    ) {

        cabinetOpen = true;

        cabinet.scale.x = 0.8;

        key.visible = true;

        showMessage(
            "The drawer is open."
        );

        return;

    }


    if (
        !hasKey &&
        key.visible &&
        player.position.distanceTo(key.position) < 2
    ) {

        hasKey = true;

        key.visible = false;

        document.getElementById(
            "objective"
        ).textContent =
            "Find the maze.";

        showMessage(
            "You found a key."
        );

    }

}


/* =========================================================
   MESSAGE
========================================================= */

let messageTimeout;

function showMessage(text) {

    const message =
        document.getElementById(
            "message"
        );

    message.textContent = text;

    message.style.opacity = 1;

    clearTimeout(messageTimeout);

    messageTimeout =
        setTimeout(
            () => {
                message.style.opacity = 0;
            },
            2500
        );

}


/* =========================================================
   LOOP SYSTEM
========================================================= */

let running = false;

let timeLeft = 60;

let loopNumber = 0;

let lastTime = 0;


/* =========================================================
   RESET
========================================================= */

function resetLoop() {

    timeLeft = 60;

    player.position.set(
        0,
        1.7,
        7
    );

    yaw = 0;
    pitch = 0;

    player.rotation.y = 0;
    camera.rotation.x = 0;

    hasKey = false;

    cabinetOpen = false;

    cabinet.scale.x = 1;

    key.visible = true;

    document.getElementById(
        "timer"
    ).textContent = "60";

    document.getElementById(
        "objective"
    ).textContent =
        "Find the key.";

}


/* =========================================================
   START
========================================================= */

function startGame() {

    document.getElementById(
        "menu"
    ).style.display = "none";

    document.getElementById(
        "end"
    ).style.display = "none";

    document.getElementById(
        "hud"
    ).style.display = "block";

    resetLoop();

    running = true;

    lastTime =
        performance.now();

    requestAnimationFrame(
        gameLoop
    );

}


/* =========================================================
   END LOOP
========================================================= */

function loopReset() {

    running = false;

    document.getElementById(
        "hud"
    ).style.display = "none";

    document.getElementById(
        "end"
    ).style.display = "flex";

    loopNumber++;

    setTimeout(
        () => {

            resetLoop();

            document.getElementById(
                "end"
            ).style.display = "none";

            document.getElementById(
                "hud"
            ).style.display = "block";

            running = true;

            lastTime =
                performance.now();

            requestAnimationFrame(
                gameLoop
            );

        },
        1800
    );

}


/* =========================================================
   UPDATE
========================================================= */

function update(dt) {

    timeLeft -= dt;

    if (
        timeLeft <= 0
    ) {

        timeLeft = 0;

        loopReset();

        return;

    }


    document.getElementById(
        "timer"
    ).textContent =
        Math.ceil(timeLeft);


    /* WASD */

    let forward = 0;
    let right = 0;

    if (keys["KeyW"])
        forward += 1;

    if (keys["KeyS"])
        forward -= 1;

    if (keys["KeyD"])
        right += 1;

    if (keys["KeyA"])
        right -= 1;


    const length =
        Math.hypot(
            forward,
            right
        );

    if (length > 0) {

        forward /= length;
        right /= length;

        const speed = 4 * dt;

        /*
          IMPORTANT:
          Forward follows where the player
          is looking.
        */

        const forwardX =
            -Math.sin(yaw);

        const forwardZ =
            -Math.cos(yaw);

        const rightX =
            Math.cos(yaw);

        const rightZ =
            -Math.sin(yaw);


        const moveX =
            (
                forwardX * forward +
                rightX * right
            ) * speed;

        const moveZ =
            (
                forwardZ * forward +
                rightZ * right
            ) * speed;


        const next =
            player.position.clone();

        next.x += moveX;
        next.z += moveZ;


        if (!blocked(next)) {

            player.position.x =
                next.x;

            player.position.z =
                next.z;

        }

    }


    /* Maze objective */

    if (
        hasKey &&
        player.position.distanceTo(
            mazeEntrance
        ) < 4
    ) {

        document.getElementById(
            "objective"
        ).textContent =
            "Enter the maze.";

    }


    if (
        hasKey &&
        player.position.distanceTo(
            mazeExit
        ) < 2.5
    ) {

        document.getElementById(
            "objective"
        ).textContent =
            "You found the exit.";

        showMessage(
            "You made it."
        );

    }

}


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop(time) {

    if (!running)
        return;

    const dt =
        Math.min(
            (time - lastTime) / 1000,
            0.05
        );

    lastTime = time;

    update(dt);

    renderer.render(
        scene,
        camera
    );

    requestAnimationFrame(
        gameLoop
    );

}


/* =========================================================
   PLAY BUTTON
========================================================= */

document.getElementById(
    "play"
).addEventListener(
    "click",
    startGame
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            innerWidth /
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);


/* =========================================================
   INITIAL RENDER
========================================================= */

resetLoop();

renderer.render(
    scene,
    camera
);

</script>

</body>
</html>
