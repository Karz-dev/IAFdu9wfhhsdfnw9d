<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LOOP</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050505;
    font-family: Arial, sans-serif;
    color: white;
}

canvas {
    display: block;
}

#menu {
    position: fixed;
    inset: 0;
    z-index: 100;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle,
            #202020 0%,
            #050505 70%
        );
}

#menu h1 {
    margin: 0;

    font-size: 70px;
    letter-spacing: 14px;
}

#menu p {
    margin: 10px 0 30px;

    color: #888;
}

#play {
    padding: 15px 50px;

    border: 0;
    border-radius: 8px;

    background: #222;
    color: white;

    font-size: 22px;
    font-weight: bold;

    cursor: pointer;
}

#play:hover {
    background: #444;
}

#loading {
    margin-top: 15px;

    color: #777;
    font-size: 13px;
}

#hud {
    position: fixed;
    inset: 0;

    z-index: 10;

    pointer-events: none;
}

#timer {
    position: absolute;

    top: 20px;
    left: 20px;

    font-size: 24px;
    font-weight: bold;

    text-shadow:
        0 2px 6px black;
}

#objective {
    position: absolute;

    top: 55px;
    left: 20px;

    font-size: 14px;

    color: #aaa;

    text-shadow:
        0 2px 6px black;
}

#crosshair {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 5px;
    height: 5px;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background: white;
}

#message {
    position: absolute;

    bottom: 50px;
    left: 50%;

    transform:
        translateX(-50%);

    color: #ddd;

    text-shadow:
        0 2px 6px black;
}

#hint {
    position: absolute;

    bottom: 15px;
    left: 50%;

    transform:
        translateX(-50%);

    color: #666;

    font-size: 12px;
}

</style>
</head>

<body>


<!-- ==============================
     MENU
================================ -->

<div id="menu">

    <h1>LOOP</h1>

    <p>
        Something is wrong with this place.
    </p>

    <button id="play">
        ENTER
    </button>

    <div id="loading"></div>

</div>


<!-- ==============================
     HUD
================================ -->

<div id="hud">

    <div id="timer">
        60.0
    </div>

    <div id="objective">
        Find the key.
    </div>

    <div id="crosshair"></div>

    <div id="message"></div>

    <div id="hint">
        WASD • Mouse • F flashlight • E interact
    </div>

</div>


<!-- =========================================================
     STARTUP SCRIPT

     IMPORTANT:
     This is NOT a module.

     Therefore the ENTER button works even if Three.js
     hasn't loaded yet.
========================================================= -->

<script>

const playButton =
    document.getElementById("play");

const loadingText =
    document.getElementById("loading");

const menu =
    document.getElementById("menu");

let gameStarted = false;


playButton.addEventListener(
    "click",
    async function () {

        if (gameStarted)
            return;

        loadingText.textContent =
            "Loading...";

        playButton.disabled =
            true;

        try {

            await startGame();

        }

        catch (error) {

            console.error(error);

            loadingText.textContent =
                "ERROR: " +
                error.message;

            playButton.disabled =
                false;

        }

    }
);


async function startGame() {

    /*
       Dynamically load Three.js.

       This means the ENTER button itself
       does not depend on the module loading
       successfully beforehand.
    */

    const THREE =
        await import(
            "./three.module.min.js"
        );


    gameStarted = true;

    menu.style.display =
        "none";


    createGame(
        THREE
    );

}

</script>


<!-- =========================================================
     GAME
========================================================= -->

<script>

function createGame(
    THREE
) {


/* =========================================================
   SCENE
========================================================= */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(
        0x050505
    );

scene.fog =
    new THREE.FogExp2(
        0x050505,
        0.035
    );


/* =========================================================
   CAMERA
========================================================= */

const camera =
    new THREE.PerspectiveCamera(

        75,

        window.innerWidth /
        window.innerHeight,

        0.05,

        200

    );


/* =========================================================
   RENDERER
========================================================= */

const renderer =
    new THREE.WebGLRenderer({

        antialias: true

    });


renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


renderer.setPixelRatio(

    Math.min(
        window.devicePixelRatio,
        2
    )

);


renderer.shadowMap.enabled =
    true;


document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   HUD
========================================================= */

const timerText =
    document.getElementById(
        "timer"
    );

const objectiveText =
    document.getElementById(
        "objective"
    );

const messageText =
    document.getElementById(
        "message"
    );


/* =========================================================
   GAME VARIABLES
========================================================= */

let running =
    true;

let loopTime =
    60;

let hasKey =
    false;

let drawerOpened =
    false;

let flashlightOn =
    true;

let inMaze =
    false;

let yaw =
    0;

let pitch =
    0;

let messageTimer =
    0;


/* =========================================================
   PLAYER
========================================================= */

const player = {

    position:
        new THREE.Vector3(
            0,
            1.7,
            8
        ),

    speed:
        4.2,

    radius:
        0.35

};


camera.position.copy(
    player.position
);


/* =========================================================
   INPUT
========================================================= */

const keys = {};


window.addEventListener(
    "keydown",
    function(event) {

        keys[
            event.code
        ] = true;


        if (
            event.code === "KeyF"
        ) {

            flashlightOn =
                !flashlightOn;

            flashlight.visible =
                flashlightOn;

        }


        if (
            event.code === "KeyE"
        ) {

            interact();

        }

    }
);


window.addEventListener(
    "keyup",
    function(event) {

        keys[
            event.code
        ] = false;

    }
);


/* =========================================================
   MOUSE LOOK
========================================================= */

renderer.domElement.addEventListener(
    "click",
    function() {

        if (
            document.pointerLockElement !==
            renderer.domElement
        ) {

            renderer.domElement.requestPointerLock();

        }

    }
);


document.addEventListener(
    "mousemove",
    function(event) {

        if (
            document.pointerLockElement !==
            renderer.domElement
        ) {

            return;

        }


        yaw -=
            event.movementX *
            0.0022;


        pitch -=
            event.movementY *
            0.0022;


        pitch =
            Math.max(
                -1.45,
                Math.min(
                    1.45,
                    pitch
                )
            );

    }
);


/* =========================================================
   MATERIALS
========================================================= */

const wallMaterial =
    new THREE.MeshStandardMaterial({

        color:
            0x282828,

        roughness:
            0.95

    });


const floorMaterial =
    new THREE.MeshStandardMaterial({

        color:
            0x151515,

        roughness:
            1

    });


const ceilingMaterial =
    new THREE.MeshStandardMaterial({

        color:
            0x0d0d0d,

        roughness:
            1

    });


const woodMaterial =
    new THREE.MeshStandardMaterial({

        color:
            0x332820,

        roughness:
            0.9

    });


const metalMaterial =
    new THREE.MeshStandardMaterial({

        color:
            0x303030,

        metalness:
            0.45,

        roughness:
            0.6

    });


/* =========================================================
   COLLIDERS
========================================================= */

const colliders = [];


function box(
    x,
    y,
    z,
    sx,
    sy,
    sz,
    material,
    collide = true
) {

    const geometry =
        new THREE.BoxGeometry(
            sx,
            sy,
            sz
        );


    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );


    mesh.position.set(
        x,
        y,
        z
    );


    mesh.castShadow =
        true;

    mesh.receiveShadow =
        true;


    scene.add(
        mesh
    );


    if (collide) {

        colliders.push({

            x: x,
            z: z,

            sx: sx,
            sz: sz

        });

    }


    return mesh;

}


/* =========================================================
   FLOOR
========================================================= */

box(

    0,
    -0.1,
    0,

    80,
    0.2,
    80,

    floorMaterial,

    false

);


/* =========================================================
   CEILING
========================================================= */

box(

    0,
    5,
    0,

    80,
    0.2,
    80,

    ceilingMaterial,

    false

);


/* =========================================================
   OUTER WALLS
========================================================= */

box(
    0,
    2.5,
    -35,
    70,
    5,
    0.5,
    wallMaterial
);


box(
    0,
    2.5,
    35,
    70,
    5,
    0.5,
    wallMaterial
);


box(
    -35,
    2.5,
    0,
    0.5,
    5,
    70,
    wallMaterial
);


box(
    35,
    2.5,
    0,
    0.5,
    5,
    70,
    wallMaterial
);


/* =========================================================
   OFFICE WALLS
========================================================= */

box(
    -12,
    2.5,
    -18,
    25,
    5,
    0.5,
    wallMaterial
);


box(
    12,
    2.5,
    -18,
    20,
    5,
    0.5,
    wallMaterial
);


box(
    -22,
    2.5,
    0,
    0.5,
    5,
    25,
    wallMaterial
);


box(
    15,
    2.5,
    0,
    0.5,
    5,
    25,
    wallMaterial
);


/* =========================================================
   DESKS
========================================================= */

function makeDesk(
    x,
    z
) {

    box(
        x,
        0.8,
        z,
        3.5,
        0.25,
        1.6,
        woodMaterial
    );


    box(
        x - 1.45,
        0.4,
        z,
        0.2,
        0.8,
        1.3,
        woodMaterial
    );


    box(
        x + 1.45,
        0.4,
        z,
        0.2,
        0.8,
        1.3,
        woodMaterial
    );


    box(
        x,
        1.45,
        z,
        1.2,
        1.1,
        0.12,
        metalMaterial,
        false
    );


    box(
        x,
        1.12,
        z - 0.05,
        0.8,
        0.08,
        0.5,
        metalMaterial,
        false
    );

}


makeDesk(-28, -8);
makeDesk(-18, -8);
makeDesk(-8, -8);

makeDesk(-28, 5);
makeDesk(-18, 5);

makeDesk(5, -8);
makeDesk(5, 4);

makeDesk(25, -8);


/* =========================================================
   CHAIRS
========================================================= */

function makeChair(
    x,
    z
) {

    box(
        x,
        0.65,
        z,
        0.8,
        0.15,
        0.8,
        metalMaterial
    );


    box(
        x,
        1.2,
        z + 0.35,
        0.75,
        1,
        0.12,
        metalMaterial
    );

}


makeChair(-28, -5.8);
makeChair(-18, -5.8);
makeChair(-8, -5.8);

makeChair(-28, 7.2);
makeChair(-18, 7.2);


/* =========================================================
   BOOKSHELVES
========================================================= */

function makeShelf(
    x,
    z
) {

    box(
        x,
        2,
        z,
        0.6,
        4,
        4,
        woodMaterial
    );


    for (
        let i = 0;
        i < 4;
        i++
    ) {

        box(
            x,
            0.55 +
            i * 1,

            z - 1.7,

            0.65,
            0.08,
            3.3,

            woodMaterial,

            false
        );

    }

}


makeShelf(
    -30,
    22
);

makeShelf(
    -26,
    22
);

makeShelf(
    29,
    -25
);


/* =========================================================
   FILING CABINET
========================================================= */

const cabinet =
    new THREE.Group();


cabinet.position.set(
    -28,
    0,
    12
);


scene.add(
    cabinet
);


const cabinetBody =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            2.5,
            3,
            1.5
        ),

        metalMaterial

    );


cabinetBody.position.y =
    1.5;


cabinet.add(
    cabinetBody
);


const drawers = [];


for (
    let i = 0;
    i < 3;
    i++
) {

    const drawer =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                2.1,
                0.75,
                0.15
            ),

            metalMaterial

        );


    drawer.position.set(

        0,

        0.65 +
        i * 0.95,

        -0.82

    );


    cabinet.add(
        drawer
    );


    drawers.push(
        drawer
    );

}


/* =========================================================
   KEY
========================================================= */

const key =
    new THREE.Mesh(

        new THREE.TorusGeometry(
            0.16,
            0.045,
            8,
            20
        ),

        new THREE.MeshStandardMaterial({

            color:
                0xd6b85a,

            metalness:
                0.8,

            roughness:
                0.25

        })

    );


key.position.set(
    -28,
    1.65,
    11.35
);


scene.add(
    key
);


/* =========================================================
   MAZE
========================================================= */

const maze = [

    "###############",
    "#S............#",
    "#.#####.#####.#",
    "#.#...#.#.....#",
    "#.#.#.#.#.###.#",
    "#...#...#...#.#",
    "###.#####.#.#.#",
    "#...#.....#...#",
    "#.###.#########",
    "#.....#.......#",
    "#.#####.#####.#",
    "#.......#...K.#",
    "#######.#######"

];


const mazeCell =
    2.4;


const mazeOriginX =
    -16;


const mazeOriginZ =
    15;


for (
    let row = 0;
    row < maze.length;
    row++
) {

    for (
        let col = 0;
        col < maze[row].length;
        col++
    ) {

        if (
            maze[row][col] !== "#"
        ) {

            continue;

        }


        const x =
            mazeOriginX +
            col *
            mazeCell;


        const z =
            mazeOriginZ +
            row *
            mazeCell;


        box(

            x,
            2.5,
            z,

            mazeCell,
            5,
            mazeCell,

            wallMaterial

        );

    }

}


/* =========================================================
   LIGHTING
========================================================= */

const ambient =
    new THREE.HemisphereLight(

        0x555555,
        0x080808,
        0.18

    );


scene.add(
    ambient
);


const officeLight =
    new THREE.PointLight(

        0x777777,
        2,
        25

    );


officeLight.position.set(
    -10,
    4,
    -10
);


officeLight.castShadow =
    true;


scene.add(
    officeLight
);


/* =========================================================
   RANDOM LIGHTS
========================================================= */

const lightPositions = [

    [-28, -12],
    [-15, -12],
    [-3, -12],

    [-28, 2],
    [-15, 2],

    [5, -12],
    [5, 2],

    [25, -12],

    [-25, 25],
    [5, 25],
    [28, 22]

];


for (
    const position
    of lightPositions
) {

    const light =
        new THREE.PointLight(

            0x666666,
            0.8,
            12

        );


    light.position.set(

        position[0],
        4.2,
        position[1]

    );


    scene.add(
        light
    );

}


/* =========================================================
   FLASHLIGHT
========================================================= */

const flashlight =
    new THREE.SpotLight(

        0xffffff,
        6,
        30,

        Math.PI / 7,

        0.55,

        1.5

    );


flashlight.castShadow =
    true;


scene.add(
    flashlight
);


scene.add(
    flashlight.target
);


/* =========================================================
   COLLISION
========================================================= */

function collides(
    x,
    z
) {

    const r =
        player.radius;


    for (
        const c
        of colliders
    ) {

        const minX =
            c.x -
            c.sx / 2 -
            r;


        const maxX =
            c.x +
            c.sx / 2 +
            r;


        const minZ =
            c.z -
            c.sz / 2 -
            r;


        const maxZ =
            c.z +
            c.sz / 2 +
            r;


        if (

            x > minX &&
            x < maxX &&
            z > minZ &&
            z < maxZ

        ) {

            return true;

        }

    }


    return false;

}


/* =========================================================
   MOVEMENT
========================================================= */

function updateMovement(
    dt
) {

    let moveX =
        0;

    let moveZ =
        0;


    if (
        keys["KeyW"]
    )
        moveZ += 1;


    if (
        keys["KeyS"]
    )
        moveZ -= 1;


    if (
        keys["KeyA"]
    )
        moveX -= 1;


    if (
        keys["KeyD"]
    )
        moveX += 1;


    if (
        moveX === 0 &&
        moveZ === 0
    ) {

        return;

    }


    const length =
        Math.hypot(
            moveX,
            moveZ
        );


    moveX /=
        length;

    moveZ /=
        length;


    const forwardX =
        -Math.sin(yaw);


    const forwardZ =
        -Math.cos(yaw);


    const rightX =
        Math.cos(yaw);


    const rightZ =
        -Math.sin(yaw);


    const worldX =
        forwardX * moveZ +
        rightX * moveX;


    const worldZ =
        forwardZ * moveZ +
        rightZ * moveX;


    const movement =
        player.speed *
        dt;


    const newX =
        player.position.x +
        worldX *
        movement;


    const newZ =
        player.position.z +
        worldZ *
        movement;


    if (
        !collides(
            newX,
            player.position.z
        )
    ) {

        player.position.x =
            newX;

    }


    if (
        !collides(
            player.position.x,
            newZ
        )
    ) {

        player.position.z =
            newZ;

    }

}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera() {

    camera.position.copy(
        player.position
    );


    camera.rotation.order =
        "YXZ";


    camera.rotation.y =
        yaw;


    camera.rotation.x =
        pitch;


    const forward =
        new THREE.Vector3(
            0,
            0,
            -1
        );


    forward.applyQuaternion(
        camera.quaternion
    );


    flashlight.position.copy(
        camera.position
    );


    flashlight.target.position.copy(
        camera.position
    ).add(
        forward.multiplyScalar(10)
    );

}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(
    text
) {

    messageText.textContent =
        text;

    messageTimer =
        3;

}


/* =========================================================
   INTERACTION
========================================================= */

function interact() {

    const distance =
        player.position.distanceTo(
            key.position
        );


    if (
        !hasKey &&
        distance < 3
    ) {

        if (
            !drawerOpened
        ) {

            drawerOpened =
                true;


            drawers[2]
                .position.z =
                -1.25;


            showMessage(
                "The drawer slides open."
            );

        }

        else {

            hasKey =
                true;


            key.visible =
                false;


            objectiveText.textContent =
                "Find the maze.";


            showMessage(
                "You found a key."
            );

        }

    }

}


/* =========================================================
   LOOP RESET
========================================================= */

function resetLoop() {

    loopTime =
        60;


    hasKey =
        false;


    drawerOpened =
        false;


    inMaze =
        false;


    key.visible =
        true;


    drawers[2]
        .position.z =
        -0.82;


    player.position.set(
        0,
        1.7,
        8
    );


    yaw =
        0;

    pitch =
        0;


    objectiveText.textContent =
        "Find the key.";


    timerText.textContent =
        "60.0";


    scene.fog.density =
        0.035;


    ambient.intensity =
        0.18;


    showMessage(
        "Something feels familiar."
    );

}


/* =========================================================
   ATMOSPHERE
========================================================= */

let flickerTimer =
    0;


function updateAtmosphere(
    dt
) {

    flickerTimer -=
        dt;


    if (
        flickerTimer <= 0
    ) {

        flickerTimer =
            5 +
            Math.random() *
            7;


        const lights =
            scene.children.filter(

                object =>
                    object.isPointLight &&
                    object !== officeLight

            );


        if (
            lights.length
        ) {

            const light =
                lights[
                    Math.floor(
                        Math.random() *
                        lights.length
                    )
                ];


            const original =
                light.intensity;


            light.intensity =
                0;


            setTimeout(

                function() {

                    light.intensity =
                        original;

                },

                100 +
                Math.random() *
                250

            );

        }

    }

}


/* =========================================================
   UPDATE
========================================================= */

function update(
    dt
) {

    if (
        !running
    ) {

        return;

    }


    updateMovement(
        dt
    );


    updateCamera();


    loopTime -=
        dt;


    if (
        loopTime <= 0
    ) {

        resetLoop();

    }


    timerText.textContent =
        loopTime.toFixed(1);


    updateAtmosphere(
        dt
    );


    if (
        messageTimer > 0
    ) {

        messageTimer -=
            dt;


        if (
            messageTimer <= 0
        ) {

            messageText.textContent =
                "";

        }

    }

}


/* =========================================================
   GAME LOOP
========================================================= */

let lastTime =
    performance.now();


function animate(
    time
) {

    requestAnimationFrame(
        animate
    );


    const dt =
        Math.min(

            (time - lastTime) /
            1000,

            0.05

        );


    lastTime =
        time;


    update(
        dt
    );


    renderer.render(
        scene,
        camera
    );

}


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    function() {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


/* =========================================================
   START
========================================================= */

resetLoop();

updateCamera();

animate(
    performance.now()
);


/* =========================================================
   POINTER LOCK
========================================================= */

setTimeout(
    function() {

        renderer.domElement.requestPointerLock();

    },
    100
);

}

</script>

</body>
</html>
