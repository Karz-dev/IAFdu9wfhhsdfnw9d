<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LOOP</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;

            background: #050608;

            font-family: Arial, sans-serif;

            user-select: none;
        }

        canvas {
            display: block;

            width: 100vw;
            height: 100vh;

            cursor: crosshair;
        }

        /* =====================================================
           HUD
        ===================================================== */

        #hud {
            position: fixed;

            inset: 0;

            pointer-events: none;

            color: white;

            z-index: 5;
        }

        #timer {
            position: absolute;

            top: 20px;
            left: 24px;

            font-size: 28px;
            font-weight: bold;

            text-shadow:
                0 2px 8px black;
        }

        #loopCounter {
            position: absolute;

            top: 58px;
            left: 26px;

            color: #9ca3af;

            font-size: 14px;

            text-shadow:
                0 2px 5px black;
        }

        #flashlightStatus {
            position: absolute;

            top: 82px;
            left: 26px;

            color: #bfc5ce;

            font-size: 14px;

            text-shadow:
                0 2px 5px black;
        }

        #crosshair {
            position: absolute;

            left: 50%;
            top: 50%;

            width: 7px;
            height: 7px;

            transform:
                translate(-50%, -50%);

            border:
                1px solid rgba(255,255,255,0.75);

            border-radius: 50%;
        }

        #prompt {
            position: absolute;

            left: 50%;
            bottom: 100px;

            transform:
                translateX(-50%);

            padding:
                8px 14px;

            border-radius: 8px;

            background:
                rgba(0,0,0,0.6);

            font-size: 14px;

            opacity: 0;

            transition:
                opacity 0.15s;
        }

        #message {
            position: absolute;

            left: 50%;
            top: 72%;

            transform:
                translateX(-50%);

            color: #d1d5db;

            font-size: 18px;

            text-shadow:
                0 2px 10px black;

            opacity: 0;

            transition:
                opacity 0.3s;
        }

        #controls {
            position: absolute;

            bottom: 18px;
            left: 50%;

            transform:
                translateX(-50%);

            padding:
                7px 13px;

            border-radius: 8px;

            background:
                rgba(0,0,0,0.35);

            color: #89909b;

            font-size: 13px;
        }

        /* =====================================================
           SCREENS
        ===================================================== */

        #startScreen,
        #endScreen {
            position: fixed;

            inset: 0;

            z-index: 20;

            display: flex;

            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at center,
                    #171b23 0%,
                    #08090c 45%,
                    #020203 100%
                );
        }

        #endScreen {
            display: none;
        }

        .panel {
            width:
                min(520px, 90vw);

            padding: 44px;

            text-align: center;

            background:
                rgba(8,10,14,0.94);

            border:
                1px solid rgba(255,255,255,0.08);

            border-radius: 18px;

            box-shadow:
                0 25px 100px rgba(0,0,0,0.75);
        }

        h1 {
            margin:
                0 0 12px;

            color: #f3f4f6;

            font-size: 64px;

            letter-spacing: 10px;
        }

        .subtitle {
            margin-bottom: 32px;

            color: #8d95a1;

            line-height: 1.7;

            font-size: 15px;
        }

        .gameButton {
            padding:
                14px 34px;

            border: 0;

            border-radius: 10px;

            background:
                #e5e7eb;

            color:
                #08090b;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            pointer-events: auto;
        }

        .gameButton:hover {
            background:
                white;

            transform:
                translateY(-1px);
        }

        .gameButton:active {
            transform:
                translateY(1px);
        }

        /* =====================================================
           DARKNESS EFFECT
        ===================================================== */

        #darkness {
            position: fixed;

            inset: 0;

            z-index: 4;

            pointer-events: none;

            background:
                radial-gradient(
                    circle at center,
                    transparent 0%,
                    rgba(0,0,0,0.12) 45%,
                    rgba(0,0,0,0.55) 100%
                );
        }
    </style>
</head>

<body>

    <div id="startScreen">

        <div class="panel">

            <h1>LOOP</h1>

            <div class="subtitle">
                You have 60 seconds.<br>
                Find the key.<br>
                Find the way out.
            </div>

            <!--
                IMPORTANT:
                This uses an inline global function.
                It cannot silently fail because of an
                event-listener setup problem.
            -->

            <button
                class="gameButton"
                onclick="startGame()"
            >
                ENTER
            </button>

        </div>

    </div>


    <div id="endScreen">

        <div class="panel">

            <h1>LOOP</h1>

            <div class="subtitle">
                The loop has ended.
            </div>

            <button
                class="gameButton"
                onclick="restartGame()"
            >
                RESTART
            </button>

        </div>

    </div>


    <div id="hud">

        <div id="timer">
            60.0
        </div>

        <div id="loopCounter">
            Loop 1
        </div>

        <div id="flashlightStatus">
            Flashlight: OFF
        </div>

        <div id="crosshair"></div>

        <div id="prompt"></div>

        <div id="message"></div>

        <div id="controls">
            WASD Move · Mouse Look · F Flashlight · E Interact
        </div>

    </div>


    <div id="darkness"></div>


    <!-- =====================================================
         THREE.JS
    ===================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js"></script>


    <script>

        /* =====================================================
           CHECK THREE.JS
        ===================================================== */

        if (typeof THREE === "undefined") {

            alert(
                "Three.js failed to load. Check your internet connection and reload the page."
            );

        }


        /* =====================================================
           SCENE
        ===================================================== */

        const scene =
            new THREE.Scene();


        scene.background =
            new THREE.Color(
                0x07090c
            );


        scene.fog =
            new THREE.Fog(
                0x07090c,
                7,
                32
            );


        /* =====================================================
           CAMERA
        ===================================================== */

        const camera =
            new THREE.PerspectiveCamera(
                75,
                window.innerWidth /
                window.innerHeight,
                0.05,
                100
            );


        camera.rotation.order =
            "YXZ";


        /* =====================================================
           RENDERER
        ===================================================== */

        const renderer =
            new THREE.WebGLRenderer({
                antialias: true
            });


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );


        renderer.setPixelRatio(
            Math.min(
                window.devicePixelRatio,
                2
            )
        );


        renderer.shadowMap.enabled =
            true;


        renderer.shadowMap.type =
            THREE.PCFSoftShadowMap;


        renderer.outputColorSpace =
            THREE.SRGBColorSpace;


        document.body.appendChild(
            renderer.domElement
        );


        /* =====================================================
           UI
        ===================================================== */

        const startScreen =
            document.getElementById(
                "startScreen"
            );


        const endScreen =
            document.getElementById(
                "endScreen"
            );


        const timerElement =
            document.getElementById(
                "timer"
            );


        const loopElement =
            document.getElementById(
                "loopCounter"
            );


        const flashlightElement =
            document.getElementById(
                "flashlightStatus"
            );


        const promptElement =
            document.getElementById(
                "prompt"
            );


        const messageElement =
            document.getElementById(
                "message"
            );


        /* =====================================================
           GAME STATE
        ===================================================== */

        let running = false;

        let loopNumber = 1;

        let timeLeft = 60;

        let lastTime = 0;

        let pointerLocked = false;

        let messageTimeout = null;


        /* =====================================================
           PLAYER
        ===================================================== */

        const player = {

            position:
                new THREE.Vector3(
                    0,
                    1.65,
                    7
                ),

            yaw: 0,

            pitch: 0,

            radius: 0.28,

            speed: 3.2

        };


        /* =====================================================
           KEYS
        ===================================================== */

        const keys = {

            w: false,
            a: false,
            s: false,
            d: false

        };


        document.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.code ===
                    "KeyW"
                ) {

                    keys.w = true;

                    event.preventDefault();

                }


                if (
                    event.code ===
                    "KeyA"
                ) {

                    keys.a = true;

                    event.preventDefault();

                }


                if (
                    event.code ===
                    "KeyS"
                ) {

                    keys.s = true;

                    event.preventDefault();

                }


                if (
                    event.code ===
                    "KeyD"
                ) {

                    keys.d = true;

                    event.preventDefault();

                }


                if (
                    event.code ===
                    "KeyF"
                ) {

                    toggleFlashlight();

                }


                if (
                    event.code ===
                    "KeyE"
                ) {

                    interact();

                }

            }
        );


        document.addEventListener(
            "keyup",
            function(event) {

                if (
                    event.code ===
                    "KeyW"
                ) {

                    keys.w = false;

                }


                if (
                    event.code ===
                    "KeyA"
                ) {

                    keys.a = false;

                }


                if (
                    event.code ===
                    "KeyS"
                ) {

                    keys.s = false;

                }


                if (
                    event.code ===
                    "KeyD"
                ) {

                    keys.d = false;

                }

            }
        );


        /* =====================================================
           MOUSE LOOK
        ===================================================== */

        renderer.domElement.addEventListener(
            "click",
            function() {

                if (
                    running &&
                    !pointerLocked
                ) {

                    renderer.domElement.requestPointerLock();

                }

            }
        );


        document.addEventListener(
            "pointerlockchange",
            function() {

                pointerLocked =
                    document.pointerLockElement ===
                    renderer.domElement;

            }
        );


        document.addEventListener(
            "mousemove",
            function(event) {

                if (!pointerLocked) {
                    return;
                }


                player.yaw -=
                    event.movementX *
                    0.0022;


                player.pitch -=
                    event.movementY *
                    0.0022;


                player.pitch =
                    Math.max(
                        -Math.PI / 2 + 0.05,
                        Math.min(
                            Math.PI / 2 - 0.05,
                            player.pitch
                        )
                    );

            }
        );


        /* =====================================================
           MATERIALS
        ===================================================== */

        const floorMaterial =
            new THREE.MeshStandardMaterial({
                color: 0x25282d,
                roughness: 0.95
            });


        const wallMaterial =
            new THREE.MeshStandardMaterial({
                color: 0x363940,
                roughness: 0.9
            });


        const darkWallMaterial =
            new THREE.MeshStandardMaterial({
                color: 0x17191e,
                roughness: 1
            });


        const woodMaterial =
            new THREE.MeshStandardMaterial({
                color: 0x39291f,
                roughness: 0.8
            });


        const metalMaterial =
            new THREE.MeshStandardMaterial({
                color: 0x42464c,
                metalness: 0.5,
                roughness: 0.6
            });


        const blackMaterial =
            new THREE.MeshStandardMaterial({
                color: 0x08090b,
                roughness: 1
            });


        const whiteMaterial =
            new THREE.MeshStandardMaterial({
                color: 0xb8bdc5,
                roughness: 0.65
            });


        /* =====================================================
           COLLISION
        ===================================================== */

        const colliders = [];


        function addBox(
            x,
            y,
            z,
            width,
            height,
            depth,
            material,
            collision = false
        ) {

            const mesh =
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        width,
                        height,
                        depth
                    ),
                    material
                );


            mesh.position.set(
                x,
                y,
                z
            );


            mesh.castShadow =
                true;

            mesh.receiveShadow =
                true;


            scene.add(mesh);


            if (collision) {

                colliders.push({

                    x: x,

                    z: z,

                    halfX:
                        width / 2,

                    halfZ:
                        depth / 2

                });

            }


            return mesh;

        }


        function circleIntersectsBox(
            px,
            pz,
            radius,
            box
        ) {

            const closestX =
                Math.max(
                    box.x - box.halfX,
                    Math.min(
                        px,
                        box.x + box.halfX
                    )
                );


            const closestZ =
                Math.max(
                    box.z - box.halfZ,
                    Math.min(
                        pz,
                        box.z + box.halfZ
                    )
                );


            const dx =
                px - closestX;


            const dz =
                pz - closestZ;


            return (
                dx * dx +
                dz * dz
            ) <
            radius * radius;

        }


        function canMoveTo(
            x,
            z
        ) {

            for (
                const box of colliders
            ) {

                if (
                    circleIntersectsBox(
                        x,
                        z,
                        player.radius,
                        box
                    )
                ) {

                    return false;

                }

            }


            return true;

        }


        /* =====================================================
           OFFICE
        ===================================================== */

        function buildOffice() {

            /* Floor */

            addBox(
                0,
                -0.1,
                7,
                14,
                0.2,
                12,
                floorMaterial
            );


            /* Back wall */

            addBox(
                0,
                2,
                13,
                14,
                4,
                0.3,
                wallMaterial,
                true
            );


            /* Left wall */

            addBox(
                -7,
                2,
                7,
                0.3,
                4,
                12,
                wallMaterial,
                true
            );


            /* Right wall */

            addBox(
                7,
                2,
                7,
                0.3,
                4,
                12,
                wallMaterial,
                true
            );


            /* Front wall */

            addBox(
                -5,
                2,
                1,
                4,
                4,
                0.3,
                wallMaterial,
                true
            );


            addBox(
                5,
                2,
                1,
                4,
                4,
                0.3,
                wallMaterial,
                true
            );


            /* Ceiling */

            addBox(
                0,
                4,
                7,
                14,
                0.2,
                12,
                darkWallMaterial
            );


            buildDesk();

            buildChair();

            buildShelves();

            buildCabinets();

            buildOfficeLighting();

        }


        /* =====================================================
           DESK
        ===================================================== */

        function buildDesk() {

            const x = -1.5;
            const z = 6;


            addBox(
                x,
                1.05,
                z,
                3.4,
                0.18,
                1.5,
                woodMaterial,
                true
            );


            /* Legs */

            addBox(
                x - 1.35,
                0.5,
                z,
                0.18,
                1,
                1.3,
                woodMaterial,
                true
            );


            addBox(
                x + 1.35,
                0.5,
                z,
                0.18,
                1,
                1.3,
                woodMaterial,
                true
            );


            /* Monitor */

            addBox(
                x,
                1.65,
                z - 0.2,
                1.35,
                0.85,
                0.12,
                blackMaterial
            );


            addBox(
                x,
                1.22,
                z - 0.2,
                0.12,
                0.35,
                0.12,
                metalMaterial
            );


            addBox(
                x,
                1.08,
                z - 0.2,
                0.55,
                0.08,
                0.3,
                metalMaterial
            );


            /* Keyboard */

            addBox(
                x,
                1.17,
                z - 0.65,
                1.1,
                0.05,
                0.35,
                whiteMaterial
            );


            /* Mug */

            const mug =
                new THREE.Mesh(
                    new THREE.CylinderGeometry(
                        0.13,
                        0.13,
                        0.25,
                        16
                    ),
                    whiteMaterial
                );


            mug.position.set(
                x + 1.05,
                1.27,
                z - 0.35
            );


            mug.castShadow =
                true;


            scene.add(mug);


            /* Monitor glow */

            const monitorLight =
                new THREE.PointLight(
                    0x526dff,
                    0.65,
                    3
                );


            monitorLight.position.set(
                x,
                1.65,
                z - 0.5
            );


            scene.add(
                monitorLight
            );

        }


        /* =====================================================
           CHAIR
        ===================================================== */

        function buildChair() {

            const x = -1.5;
            const z = 7.7;


            addBox(
                x,
                0.75,
                z,
                1.1,
                0.15,
                1,
                blackMaterial,
                true
            );


            addBox(
                x,
                1.45,
                z + 0.4,
                1,
                1.4,
                0.15,
                blackMaterial,
                true
            );


            addBox(
                x,
                0.35,
                z,
                0.12,
                0.7,
                0.12,
                metalMaterial
            );

        }


        /* =====================================================
           SHELVES
        ===================================================== */

        function buildShelves() {

            createShelf(
                -5.8,
                10.8
            );


            createShelf(
                5.8,
                10.8
            );

        }


        function createShelf(
            x,
            z
        ) {

            addBox(
                x,
                2,
                z,
                1.8,
                3.7,
                0.45,
                woodMaterial,
                true
            );


            for (
                let row = 0;
                row < 4;
                row++
            ) {

                addBox(
                    x,
                    0.55 +
                    row * 0.85,
                    z - 0.27,
                    1.55,
                    0.08,
                    0.12,
                    metalMaterial
                );


                for (
                    let i = 0;
                    i < 5;
                    i++
                ) {

                    const bookHeight =
                        0.42 +
                        Math.random() *
                        0.25;


                    const bookMaterial =
                        new THREE.MeshStandardMaterial({
                            color:
                                0x202328 +
                                Math.floor(
                                    Math.random() *
                                    0x101010
                                )
                        });


                    addBox(
                        x - 0.6 +
                        i * 0.3,
                        0.8 +
                        row * 0.85,
                        z - 0.3,
                        0.18,
                        bookHeight,
                        0.15,
                        bookMaterial
                    );

                }

            }

        }


        /* =====================================================
           CABINETS
        ===================================================== */

        let keyDrawer = null;

        let keyDrawerOpen = false;

        let keyCollected = false;


        function buildCabinets() {

            createCabinet(
                4.5,
                8.5,
                false
            );


            createCabinet(
                5.8,
                5.5,
                true
            );

        }


        function createCabinet(
            x,
            z,
            containsKey
        ) {

            addBox(
                x,
                1.05,
                z,
                1.25,
                2.1,
                0.8,
                metalMaterial,
                true
            );


            for (
                let i = 0;
                i < 3;
                i++
            ) {

                const drawer =
                    addBox(
                        x,
                        1.6 -
                        i * 0.55,
                        z - 0.43,
                        1.0,
                        0.38,
                        0.08,
                        darkWallMaterial
                    );


                addBox(
                    x,
                    1.6 -
                    i * 0.55,
                    z - 0.49,
                    0.15,
                    0.04,
                    0.04,
                    metalMaterial
                );


                if (
                    containsKey &&
                    i === 1
                ) {

                    keyDrawer =
                        drawer;

                }

            }

        }


        /* =====================================================
           KEY
        ===================================================== */

        const key =
            new THREE.Group();


        const keyMaterial =
            new THREE.MeshStandardMaterial({
                color: 0xd7b94d,
                metalness: 0.85,
                roughness: 0.25
            });


        const keyRing =
            new THREE.Mesh(
                new THREE.TorusGeometry(
                    0.11,
                    0.035,
                    8,
                    16
                ),
                keyMaterial
            );


        key.add(
            keyRing
        );


        const keyStem =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    0.06,
                    0.06,
                    0.45
                ),
                keyMaterial
            );


        keyStem.position.z =
            0.25;


        key.add(
            keyStem
        );


        key.position.set(
            5.8,
            1.18,
            5.85
        );


        key.rotation.x =
            Math.PI / 2;


        key.visible = false;


        scene.add(
            key
        );


        /* =====================================================
           OFFICE LIGHTING
        ===================================================== */

        function buildOfficeLighting() {

            const ambient =
                new THREE.HemisphereLight(
                    0x6e7890,
                    0x07080a,
                    0.3
                );


            scene.add(
                ambient
            );


            const positions = [

                [-4, 3.4, 4],

                [0, 3.4, 7],

                [4, 3.4, 10]

            ];


            for (
                const position of positions
            ) {

                const light =
                    new THREE.PointLight(
                        0xaeb8ca,
                        0.48,
                        7
                    );


                light.position.set(
                    position[0],
                    position[1],
                    position[2]
                );


                light.castShadow =
                    true;


                scene.add(
                    light
                );

            }

        }


        /* =====================================================
           MAZE
        ===================================================== */

        const maze = [

            "#######.#######",
            "#S............#",
            "#.#####.#####.#",
            "#.#...#.#.....#",
            "#.#.#.#.#.###.#",
            "#...#...#...#.#",
            "###.#####.#.#.#",
            "#...#.....#...#",
            "#.###.#########",
            "#.....#.......#",
            "#.#####.#####.#",
            "#.......#...K.#",
            "#######.#######"

        ];


        const mazeCell = 1;


        const mazeWidth =
            maze[0].length *
            mazeCell;


        const mazeStartZ =
            -1;


        const mazeOriginX =
            -mazeWidth / 2 +
            mazeCell / 2;


        const mazeOriginZ =
            mazeStartZ +
            mazeCell / 2;


        function buildMaze() {

            for (
                let row = 0;
                row < maze.length;
                row++
            ) {

                for (
                    let col = 0;
                    col < maze[row].length;
                    col++
                ) {

                    const tile =
                        maze[row][col];


                    if (
                        tile !== "#"
                    ) {

                        continue;

                    }


                    const x =
                        mazeOriginX +
                        col *
                        mazeCell;


                    const z =
                        mazeOriginZ +
                        row *
                        mazeCell;


                    addBox(
                        x,
                        1.5,
                        z,
                        1,
                        3,
                        1,
                        darkWallMaterial,
                        true
                    );

                }

            }


            addBox(
                0,
                -0.1,
                mazeStartZ +
                maze.length / 2,
                maze[0].length,
                0.2,
                maze.length,
                floorMaterial
            );

        }


        /* =====================================================
           BUILD WORLD
        ===================================================== */

        buildOffice();

        buildMaze();


        /* =====================================================
           EXIT
        ===================================================== */

        addBox(
            -0.65,

            0.15,
            2.8,
            0.2,
            metalMaterial
        );


        addBox(
            0.65,
            1.4,
            -7.2,
            0.15,
            2.8,
            0.2,
            metalMaterial
        );


        addBox(
            0,
            2.75,
            -7.2,
            1.45,
            0.15,
            0.2,
            metalMaterial
        );


        const exitLight =
            new THREE.PointLight(
                0x78945d,
                0.2,

            );


        exitLight.position.set(
            0,
            2,
            -7
        );


        scene.add(

        );


        /* =====================================================
           FLASHLIGHT
        ===================================================== */

        let flashlightOn = false;


        const flashlight =
            new THREE.SpotLight(
                0xffffff,
                0,
                22,
                Math.PI / 7,
                0.55,
                1.4
            );


        flashlight.castShadow =
            true;


        flashlight.shadow.mapSize.width =
            1024;


        flashlight.shadow.mapSize.height =
            1024;


        camera.add(
            flashlight
        );


        const flashlightTarget =
            new THREE.Object3D();


        scene.add(
            flashlightTarget
        );


        flashlight.target =
            flashlightTarget;


        function updateFlashlight() {

            flashlight.intensity =
                flashlightOn
                    ? 7
                    : 0;


            flashlightTarget.position.copy(
                camera.position
            );


            const direction =
                new THREE.Vector3(
                    0,
                    0,
                    -1
                );


            direction.applyQuaternion(
                camera.quaternion
            );


            flashlightTarget.position.add(
                direction.multiplyScalar(
                    10
                )
            );

        }


        function toggleFlashlight() {

            flashlightOn =
                !flashlightOn;


            flashlightElement.textContent =
                flashlightOn
                    ? "Flashlight: ON"
                    : "Flashlight: OFF";


            updateFlashlight();


            playClickSound();

        }


        /* =====================================================
           AUDIO
        ===================================================== */

        let audioContext = null;

        let masterGain = null;

        let audioStarted = false;

        let stepTimer = 0;

        let ambientTimer = 5;


        function startAudio() {

            if (
                audioStarted
            ) {

                if (
                    audioContext.state ===
                    "suspended"
                ) {

                    audioContext.resume();

                }

                return;

            }


            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();


            masterGain =
                audioContext.createGain();


            masterGain.gain.value =
                0.45;


            masterGain.connect(
                audioContext.destination
            );


            const oscillator =
                audioContext.createOscillator();


            const gain =
                audioContext.createGain();


            oscillator.type =
                "sine";


            oscillator.frequency.value =
                42;


            gain.gain.value =
                0.045;


            oscillator.connect(
                gain
            );


            gain.connect(
                masterGain
            );


            oscillator.start();


            audioStarted =
                true;

        }


        function tone(
            frequency,
            duration,
            volume,
            type = "sine"
        ) {

            if (
                !audioStarted
            ) {

                return;

            }


            const now =
                audioContext.currentTime;


            const oscillator =
                audioContext.createOscillator();


            const gain =
                audioContext.createGain();


            oscillator.type =
                type;


            oscillator.frequency.value =
                frequency;


            gain.gain.setValueAtTime(
                0.0001,
                now
            );


            gain.gain.exponentialRampToValueAtTime(
                volume,
                now + 0.01
            );


            gain.gain.exponentialRampToValueAtTime(
                0.0001,
                now + duration
            );


            oscillator.connect(
                gain
            );


            gain.connect(
                masterGain
            );


            oscillator.start(
                now
            );


            oscillator.stop(
                now +
                duration +
                0.03
            );

        }


        function footstep() {

            tone(
                65 +
                Math.random() * 25,
                0.11,
                0.05,
                "triangle"
            );

        }


        function playClickSound() {

            tone(
                420,
                0.06,
                0.025
            );

        }


        function drawerSound() {

            tone(
                90,
                0.25,
                0.06,
                "sawtooth"
            );

        }


        function keySound() {

            tone(
                650,
                0.14,
                0.06
            );


            setTimeout(
                function() {

                    tone(
                        900,
                        0.18,
                        0.05
                    );

                },
                100
            );

        }


        function ambientSound() {

            tone(
                120,
                               1.8,
                0.018
            );

        }


        /* =====================================================
           MESSAGE
        ===================================================== */

        function showMessage(
            text,
            duration = 2200
        ) {

            messageElement.textContent =
                text;


            messageElement.style.opacity =
                "1";


            clearTimeout(
                messageTimeout
            );


            messageTimeout =
                setTimeout(
                    function() {

                        messageElement.style.opacity =
                            "0";

                    },
                    duration
                );

        }


        /* =====================================================
           INTERACTION
        ===================================================== */

        function interact() {

            if (
                !running
            ) {

                return;

            }


            /* Drawer */

            const drawerDistance =
                Math.hypot(
                    player.position.x -
                    5.8,

                    player.position.z -
                    5.5
                );


            if (
                drawerDistance < 1.7 &&
                !keyCollected
            ) {

                keyDrawerOpen =
                    !keyDrawerOpen;


                if (
                    keyDrawerOpen
                ) {

                    keyDrawer.position.z =
                        5.55;


                    key.visible =
                        true;


                    showMessage(
                        "The drawer is open."
                    );


                    drawerSound();

                }
                else {

                    keyDrawer.position.z =
                        5.07;


                    key.visible =
                        false;


                    drawerSound();

                }


                return;

            }


            /* Pick up key */

            if (
                key.visible &&
                !keyCollected &&
                player.position.distanceTo(
                    key.position
                ) < 1.2
            ) {

                keyCollected =
                    true;


                key.visible =
                    false;


                showMessage(
                    "You found a key."
                );


                keySound();


                return;

            }


            /* Exit */

            if (
                keyCollected &&
                player.position.z <
                -6.2 &&
                Math.abs(
                    player.position.x
                ) < 1.6
            ) {

                showMessage(
                    "The door opens..."
                );


                tone(
                    55,
                    0.7,
                    0.08,
                    "sawtooth"
                );


                setTimeout(
                    function() {

                        completeLoop();

                    },
                    900
                );

            }

        }


        /* =====================================================
           PROMPTS
        ===================================================== */

        function updatePrompt() {

            promptElement.style.opacity =
                "0";


            if (
                !running
            ) {

                return;

            }


            const drawerDistance =
                Math.hypot(
                    player.position.x -
                    5.8,

                    player.position.z -
                    5.5
                );


            if (
                drawerDistance < 1.7 &&
                !keyCollected
            ) {

                promptElement.textContent =
                    keyDrawerOpen
                        ? "E  Close drawer"
                        : "E  Open drawer";


                promptElement.style.opacity =
                    "1";


                return;

            }


            if (
                key.visible &&
                !keyCollected &&
                player.position.distanceTo(
                    key.position
                ) < 1.2
            ) {

                promptElement.textContent =
                    "E  Take key";


                promptElement.style.opacity =
                    "1";


                return;

            }


            if (
                keyCollected &&
                player.position.z <
                -6.2 &&
                Math.abs(
                    player.position.x
                ) < 1.6
            ) {

                promptElement.textContent =
                    "E  Enter";


                promptElement.style.opacity =
                    "1";

            }

        }


        /* =====================================================
           MOVEMENT
        ===================================================== */

        function updateMovement(
            dt
        ) {

            let forward = 0;

            let side = 0;


            if (keys.w) {

                forward += 1;

            }


            if (keys.s) {

                forward -= 1;

            }


            if (keys.d) {

                side += 1;

            }


            if (keys.a) {

                side -= 1;

            }


            const moving =
                forward !== 0 ||
                side !== 0;


            if (
                !moving
            ) {

                stepTimer = 0;

                return false;

            }


            const length =
                Math.hypot(
                    forward,
                    side
                );


            forward /=
                length;


            side /=
                length;


            /*
                Correct FPS movement.

                yaw = 0

                W -> -Z
                S -> +Z
                A -> -X
                D -> +X
            */


            const forwardX =
                -Math.sin(
                    player.yaw
                );


            const forwardZ =
                -Math.cos(
                    player.yaw
                );


            const rightX =
                Math.cos(
                    player.yaw
                );


            const rightZ =
                -Math.sin(
                    player.yaw
                );


            const velocityX =
                forwardX * forward +
                rightX * side;


            const velocityZ =
                forwardZ * forward +
                rightZ * side;


            const distance =
                player.speed *
                dt;


            const nextX =
                player.position.x +
                velocityX *
                distance;


            const nextZ =
                player.position.z +
                velocityZ *
                distance;


            if (
                canMoveTo(
                    nextX,
                    player.position.z
                )
            ) {

                player.position.x =
                    nextX;

            }


            if (
                canMoveTo(
                    player.position.x,
                    nextZ
                )
            ) {

                player.position.z =
                    nextZ;

            }


            /* Footsteps */

            stepTimer -= dt;


            if (
                stepTimer <= 0
            ) {

                footstep();

                stepTimer =
                    0.42;

            }


            return true;

        }


        /* =====================================================
           CAMERA
        ===================================================== */

        function updateCamera() {

            camera.position.copy(
                player.position
            );


            camera.rotation.order =
                "YXZ";


            camera.rotation.y =
                player.yaw;


            camera.rotation.x =
                player.pitch;


            updateFlashlight();

        }


        /* =====================================================
           HIDDEN HORROR SYSTEM
        ===================================================== */

        const hiddenThing =
            new THREE.Group();


        const hiddenBody =
            new THREE.Mesh(
                new THREE.CylinderGeometry(
                    0.2,
                    0.29,
                    1.7,
                    8
                ),
                new THREE.MeshStandardMaterial({
                    color: 0x010101,

                })
            );


        hiddenBody.position.y =
            0.9;


        hiddenThing.add(
            hiddenBody
        );


        const hiddenHead =
            new THREE.Mesh(
                new THREE.SphereGeometry(
                    0.22,
                    12,
                    12
                ),
                new THREE.MeshStandardMaterial({
                    color: 0x010101,
                    roughness: 1
                })
            );


        hiddenHead.position.y =
            1.9;


        hiddenThing.add(
            hiddenHead
        );


        hiddenThing.visible =
            false;


        scene.add(
            hiddenThing
        );


        const hiddenSpots = [

            {
                x: -1.5,
                z: 10
            },

            {
                x: 2.5,
                z: 12
            },

            {
                x: -2.5,
                z: 15
            },

            {
                x: 3.5,
                z: 17
            },

            {
                x: -3.5,
                z: 20
            }

        ];


        let hiddenTimer =
            8;


        let hiddenActive =
            false;


        function updateHiddenThing(
            dt
        ) {

            if (
                !keyCollected ||
                player.position.z >
                0
            ) {

                hiddenThing.visible =
                    false;

                hiddenActive =
                    false;

                return;

            }


            hiddenTimer -= dt;


            if (
                hiddenTimer <= 0 &&
                !hiddenActive
            ) {

                hiddenTimer =
                    7 +
                    Math.random() *
                    11;


                if (
                    Math.random() <
                    0.45
                ) {

                    const spot =
                        hiddenSpots[
                            Math.floor(
                                Math.random() *
                                hiddenSpots.length
                            )
                        ];


                    hiddenThing.position.set(
                        spot.x,
                        0,
                        spot.z
                    );


                    hiddenThing.lookAt(
                        player.position.x,
                        1.2,
                        player.position.z
                    );


                    hiddenThing.visible =
                        true;


                    hiddenActive =
                        true;


                    setTimeout(
                        function() {

                            hiddenThing.visible =
                                false;

                            hiddenActive =
                                false;

                        },
                        650 +
                        Math.random() *
                        1100
                    );

                }

            }

        }


        /* =====================================================
           RESET
        ===================================================== */

        function resetLoop() {

            player.position.set(
                0,
                1.65,
                7
            );


            player.yaw =
                0;


            player.pitch =
                0;


            timeLeft =
                60;


            keyCollected =
                false;


            keyDrawerOpen =
                false;


            key.visible =
                false;


            if (
                keyDrawer
            ) {

                keyDrawer.position.z =
                    5.07;

            }


            hiddenThing.visible =
                false;


            hiddenActive =
                false;


            hiddenTimer =
                8;


            timerElement.textContent =
                "60.0";


            loopElement.textContent =
                "Loop " +
                loopNumber;


            updateCamera();

        }


        /* =====================================================
           COMPLETE LOOP
        ===================================================== */

        function completeLoop() {

            if (
                !running
            ) {

                return;

            }


            loopNumber++;


            showMessage(
                "Everything resets..."
            );


            setTimeout(
                function() {

                    resetLoop();

                },
                1000
            );

        }


        /* =====================================================
           GAME OVER
        ===================================================== */

        function gameOver() {

            running =
                false;


            if (
                document.pointerLockElement
            ) {

                document.exitPointerLock();

            }


            endScreen.style.display =
                "flex";

        }


        /* =====================================================
           START GAME
        ===================================================== */

        window.startGame =
            function() {

                /*
                    Audio starts from a real user click,
                    so browsers allow it.
                */

                startAudio();


                loopNumber =
                    1;


                resetLoop();


                running =
                    true;


                startScreen.style.display =
                    "none";


                endScreen.style.display =
                    "none";


                renderer.domElement.requestPointerLock();


                lastTime =
                    performance.now();


                requestAnimationFrame(
                    gameLoop
                );

            };


        window.restartGame =
            function() {

                startGame();

            };


        /* =====================================================
           GAME LOOP
        ===================================================== */

        function gameLoop(
            time
        ) {

            if (
                !running
            ) {

                return;

            }


            const dt =
                Math.min(
                    (
                        time -
                        lastTime
                    ) / 1000,
                    0.05
                );


            lastTime =
                time;


            timeLeft -= dt;


            if (
                timeLeft <= 0
            ) {

                timeLeft =
                    0;


                timerElement.textContent =
                    "0.0";


                gameOver();


                return;

            }


            timerElement.textContent =
                timeLeft.toFixed(
                    1
                );


            updateMovement(
                dt
            );


            updateCamera();


            updatePrompt();


            updateHiddenThing(
                dt
            );


            ambientTimer -=
                dt;


            if (
                ambientTimer <= 0
            ) {

                ambientSound();


                ambientTimer =
                    8 +
                    Math.random() *
                    12;

            }


            renderer.render(
                scene,
                camera
            );


            requestAnimationFrame(
                gameLoop
            );

        }


        /* =====================================================
           RESIZE
        ===================================================== */

        window.addEventListener(
            "resize",
            function() {

                camera.aspect =
                    window.innerWidth /
                    window.innerHeight;


                camera.updateProjectionMatrix();


                renderer.setSize(
                    window.innerWidth,
                    window.innerHeight
                );

            }
        );


        /* =====================================================
           INITIAL DRAW
        ===================================================== */

        resetLoop();


        renderer.render(
            scene,
            camera
        );

    </script>
