/* =========================================================

);

);


/* =========================================================

/*

const world = [

    "100000002000000000000001",

    "100000000000000000000001",

    "100000000000000010000001",

    "100000000000000000000001",

];

const furniture = [

];


/* =========================================================
   KEY

let keyCollected = false;

let drawerOpen = false;

/* =========================================================
   FLASHLIGHT
========================================================= */

let flashlightOn = false;


function toggleFlashlight() {

    flashlightOn =
        !flashlightOn;


    flashlightUI.textContent =
        flashlightOn
            ? "Flashlight: ON"
            : "Flashlight: OFF";

/* =========================================================
   COLLISION
========================================================= */

function isWall(
    x,
    y
) {

    const column =
        Math.floor(x);

    const row =
        Math.floor(y);


    if (
        row < 0 ||
        row >= world.length ||
        column < 0 ||
        column >= world[0].length
    ) {

        return true;

    }


    return (
        world[row][column] ===
        "1"
    );

}


function collidesFurniture(
    x,
    y
) {

    for (
        const item of furniture
    ) {

        if (
            x >
            item.x - item.w / 2 &&
            x <
            item.x + item.w / 2 &&
            y >
            item.y - item.h / 2 &&
            y <
            item.y + item.h / 2
        ) {

            return true;

        }

    }


    return false;

}


function canMove(
    x,
    y
) {

    const radius =
        0.18;


    const checks = [

        [x - radius, y],

        [x + radius, y],

        [x, y - radius],

        [x, y + radius]

    ];


    for (
        const point of checks
    ) {

        if (
            isWall(
                point[0],
                point[1]
            )
        ) {

            return false;

        }


        if (
            collidesFurniture(
                point[0],
                point[1]
            )
        ) {

            return false;

        }

    }


    return true;

}


/* =========================================================
   MOVEMENT
========================================================= */

let moving = false;

let footstepTimer = 0;


function updateMovement(
    dt
) {

    let forward = 0;

    let side = 0;


    if (keys.w) {
        forward += 1;
    }

    if (keys.s) {
        forward -= 1;
    }

    if (keys.d) {
        side += 1;
    }

    if (keys.a) {
        side -= 1;
    }


    moving =
        forward !== 0 ||
        side !== 0;


    if (!moving) {

        footstepTimer = 0;

        return;

    }


    const length =
        Math.hypot(
            forward,
            side
        );


    forward /=
        length;


    side /=
        length;


    /*
        Correct FPS movement.

        W = forward
        S = backward
        A = left
        D = right
    */


    const forwardX =
        Math.cos(
            player.angle
        );


    const forwardY =
        Math.sin(
            player.angle
        );


    const rightX =
        -Math.sin(
            player.angle
        );


    const rightY =
        Math.cos(
            player.angle
        );


    const velocityX =
        forwardX * forward +
        rightX * side;


    const velocityY =
        forwardY * forward +
        rightY * side;


    const distance =
        player.speed *
        dt;


    const nextX =
        player.x +
        velocityX *
        distance;


    const nextY =
        player.y +
        velocityY *
        distance;


    if (
        canMove(
            nextX,
            player.y
        )
    ) {

        player.x =
            nextX;

    }


    if (
        canMove(
            player.x,
            nextY
        )
    ) {

        player.y =
            nextY;

    }


    footstepTimer -=
        dt;


    if (
        footstepTimer <= 0
    ) {

        soundFootstep();

        footstepTimer =
            0.42;

    }

}


/* =========================================================
   RAYCAST
========================================================= */

function castRay(
    angle
) {

    const directionX =
        Math.cos(angle);

    const directionY =
        Math.sin(angle);


    let distance = 0;

    const step =
        0.025;


    while (
        distance < 30
    ) {

        distance +=
            step;


        const x =
            player.x +
            directionX *
            distance;


        const y =
            player.y +
            directionY *
            distance;


        if (
            isWall(
                x,
                y
            )
        ) {

            return distance;

        }

    }


    return 30;

}


/* =========================================================
   DRAW WORLD
========================================================= */

function drawWorld() {

    const half =
        height / 2;


    /*
        Ceiling
    */

    ctx.fillStyle =
        "#090b0f";


    ctx.fillRect(
        0,
        0,
        width,
        half
    );


    /*
        Floor
    */

    ctx.fillStyle =
        "#1c1f24";


    ctx.fillRect(
        0,
        half,
        width,
        half
    );


    const rayCount =
        Math.max(
            240,
            Math.floor(
                width / 3
            )
        );


    const columnWidth =
        width / rayCount;


    for (
        let ray = 0;
        ray < rayCount;
        ray++
    ) {

        const screenX =
            ray *
            columnWidth;


        const cameraX =
            ray /
            rayCount;


        const rayAngle =
            player.angle -
            player.fov / 2 +
            cameraX *
            player.fov;


        let distance =
            castRay(
                rayAngle
            );


        /*
            Fish-eye correction
        */

        distance *=
            Math.cos(
                rayAngle -
                player.angle
            );


        const wallHeight =
            Math.min(
                height * 2,
                height /
                distance
            );


        const top =
            half -
            wallHeight / 2;


        let brightness =
            1 /
            (
                1 +
                distance *
                0.11
            );


        if (
            flashlightOn
        ) {

            const difference =
                Math.abs(
                    rayAngle -
                    player.angle
                );


            const cone =
                Math.max(
                    0,
                    1 -
                    difference /
                    0.65
                );


            brightness +=
                cone *
                0.65;

        }


        brightness =
            Math.min(
                1,
                brightness
            );


        const shade =
            Math.floor(
                35 *
                brightness
            );


        ctx.fillStyle =
            `rgb(
                ${shade},
                ${shade + 2},
                ${shade + 5}
            )`;


        ctx.fillRect(
            screenX,
            top,
            columnWidth + 1,
            wallHeight
        );

    }

}


/* =========================================================
   DRAW OFFICE OBJECTS
========================================================= */

function drawObjects() {

    /*
        These are rendered as simple
        screen-space objects based on
        their distance and angle.
    */

    for (
        const item of furniture
    ) {

        drawObject(
            item.x,
            item.y,
            0.8,
            0.8
        );

    }


    if (
        key.visible
    ) {

        drawObject(
            key.x,
            key.y,
            0.18,
            0.18
        );

    }

}


key.visible =
    false;


function drawObject(
    x,
    y,
    objectWidth,
    objectHeight
) {

    const dx =
        x - player.x;


    const dy =
        y - player.y;


    const distance =
        Math.hypot(
            dx,
            dy
        );


    if (
        distance > 12
    ) {

        return;

    }


    let relativeAngle =
        Math.atan2(
            dy,
            dx
        ) -
        player.angle;


    while (
        relativeAngle >
        Math.PI
    ) {

        relativeAngle -=
            Math.PI * 2;

    }


    while (
        relativeAngle <
        -Math.PI
    ) {

        relativeAngle +=
            Math.PI * 2;

    }


    if (
        Math.abs(
            relativeAngle
        ) >
        player.fov
    ) {

        return;

    }


    const screenX =
        width / 2 +
        (
            relativeAngle /
            player.fov
        ) *
        width;


    const size =
        (
            height /
            distance
        ) *
        objectWidth;


    const centerY =
        height / 2;


    if (
        objectWidth <
        0.3
    ) {

        ctx.fillStyle =
            "#d7b94d";


        ctx.fillRect(
            screenX - size / 2,
            centerY,
            size,
            size
        );

    }
    else {

        ctx.fillStyle =
            "#303237";


        ctx.fillRect(
            screenX - size / 2,
            centerY - size / 2,
            size,
            size
        );

    }

}


/* =========================================================
   DRAW FLASHLIGHT DARKNESS
========================================================= */

function drawDarkness() {

    if (
        flashlightOn
    ) {

        const gradient =
            ctx.createRadialGradient(
                width / 2,
                height / 2,
                20,
                width / 2,
                height / 2,
                width * 0.52
            );


        gradient.addColorStop(
            0,
            "rgba(0,0,0,0)"
        );


        gradient.addColorStop(
            0.45,
            "rgba(0,0,0,0.08)"
        );


        gradient.addColorStop(
            1,
            "rgba(0,0,0,0.75)"
        );


        ctx.fillStyle =
            gradient;


        ctx.fillRect(
            0,
            0,
            width,
            height
        );

    }
    else {

        const gradient =
            ctx.createRadialGradient(
                width / 2,
                height / 2,
                10,
                width / 2,
                height / 2,
                width * 0.25
            );


        gradient.addColorStop(
            0,
            "rgba(0,0,0,0.2)"
        );


        gradient.addColorStop(
            1,
            "rgba(0,0,0,0.9)"
        );


        ctx.fillStyle =
            gradient;


        ctx.fillRect(
            0,
            0,
            width,
            height
        );

    }

}


/* =========================================================
   INTERACTION
========================================================= */

function interact() {

    if (
        !running
    ) {

        return;

    }


    const drawerDistance =
        Math.hypot(
            player.x - 18.5,
            player.y - 14.5
        );


    if (
        drawerDistance <
        1.4 &&
        !keyCollected
    ) {

        drawerOpen =
            !drawerOpen;


        key.visible =
            drawerOpen;


        showMessage(
            drawerOpen
                ? "The drawer opens."
                : "The drawer closes."
        );


        soundDrawer();


        return;

    }


    if (
        key.visible &&
        !keyCollected
    ) {

        const keyDistance =
            Math.hypot(
                player.x - key.x,
                player.y - key.y
            );


        if (
            keyDistance <
            1
        ) {

            keyCollected =
                true;


            key.visible =
                false;


            showMessage(
                "You found a key."
            );


            soundKey();

        }

    }

}


/* =========================================================
   MESSAGE
========================================================= */

let messageTimeout;


function showMessage(
    text
) {

    messageUI.textContent =
        text;


    messageUI.style.opacity =
        "1";


    clearTimeout(
        messageTimeout
    );


    messageTimeout =
        setTimeout(
            function() {

                messageUI.style.opacity =
                    "0";

            },
            2200
        );

}


/* =========================================================
   PROMPT
========================================================= */

function updatePrompt() {

    promptUI.style.opacity =
        "0";


    if (
        !running
    ) {

        return;

    }


    const drawerDistance =
        Math.hypot(
            player.x - 18.5,
            player.y - 14.5
        );


    if (
        drawerDistance <
        1.4 &&
        !keyCollected
    ) {

        promptUI.textContent =
            drawerOpen
                ? "E  Close drawer"
                : "E  Open drawer";


        promptUI.style.opacity =
            "1";


        return;

    }


    if (
        key.visible &&
        !keyCollected
    ) {

        const distance =
            Math.hypot(
                player.x - key.x,
                player.y - key.y
            );


        if (
            distance <
            1
        ) {

            promptUI.textContent =
                "E  Take key";


            promptUI.style.opacity =
                "1";

        }

    }

}


/* =========================================================
   AUDIO
========================================================= */

let audioContext = null;

let masterGain = null;


function startAudio() {

    if (
        audioContext
    ) {

        if (
            audioContext.state ===
            "suspended"
        ) {

            audioContext.resume();

        }

        return;

    }


    audioContext =
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();


    masterGain =
        audioContext.createGain();


    masterGain.gain.value =
        0.35;


    masterGain.connect(
        audioContext.destination
    );


    const hum =
        audioContext.createOscillator();


    const humGain =
        audioContext.createGain();


    hum.type =
        "sine";


    hum.frequency.value =
        42;


    humGain.gain.value =
        0.04;


    hum.connect(
        humGain
    );


    humGain.connect(
        masterGain
    );


    hum.start();

}


function tone(
    frequency,
    duration,
    volume,
    type = "sine"
) {

    if (
        !audioContext
    ) {

        return;

    }


    const now =
        audioContext.currentTime;


    const oscillator =
        audioContext.createOscillator();


    const gain =
        audioContext.createGain();


    oscillator.type =
        type;


    oscillator.frequency.value =
        frequency;


    gain.gain.setValueAtTime(
        0.0001,
        now
    );


    gain.gain.exponentialRampToValueAtTime(
        volume,
        now + 0.01
    );


    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + duration
    );


    oscillator.connect(
        gain
    );


    gain.connect(
        masterGain
    );


    oscillator.start(
        now
    );


    oscillator.stop(
        now +
        duration +
        0.03
    );

}


function soundClick() {

    tone(
        430,
        0.06,
        0.025
    );

}


function soundFootstep() {

        70 +
        Math.random() * 20,

    );

}

    );

function soundKey() {

    );


    setTimeout(

            );

    );

}


/* =========================================================
   HORROR SYSTEM
========================================================= */

let horrorTimer =
    10;


let horrorActive =
    false;


let horrorX =
    0;


let horrorY =
    0;


function updateHorror(
    dt
) {

    if (
        !keyCollected
    ) {

        return;

    }


    horrorTimer -=
        dt;


    if (
        horrorTimer <= 0 &&
        !horrorActive
    ) {

        horrorTimer =
            8 +
            Math.random() *
            14;


        if (
            Math.random() <
            0.38
        ) {

            horrorActive =
                true;


            /*
                Deliberately hidden from
                the HUD and normal UI.
            */

            horrorX =
                player.x +
                Math.cos(
                    player.angle +
                    (
                        Math.random() >
                        0.5
                            ? 1
                            : -1
                    ) *
                    0.8
                ) *
                5;


            horrorY =
                player.y +
                Math.sin(
                    player.angle +
                    (
                        Math.random() >
                        0.5
                            ? 1
                            : -1
                    ) *
                    0.8
                ) *
                5;


            tone(
                115,
                1.5,
                0.018
            );


            setTimeout(
                function() {

                    horrorActive =
                        false;

                },
                600 +
                Math.random() *
                900
            );

        }

    }

}


/* =========================================================
   DRAW HORROR
========================================================= */

function drawHorror() {

    if (
        !horrorActive
    ) {

        return;

    }


    const dx =
        horrorX -
        player.x;


    const dy =
        horrorY -
        player.y;


    const distance =
        Math.hypot(
            dx,
            dy
        );


    let angle =
        Math.atan2(
            dy,
            dx
        ) -
        player.angle;


    while (
        angle > Math.PI
    ) {

        angle -=
            Math.PI * 2;

    }


    while (
        angle < -Math.PI
    ) {

        angle +=
            Math.PI * 2;

    }


    if (
        Math.abs(angle) >
        player.fov / 2
    ) {

        return;

    }


    const screenX =
        width / 2 +
        (
            angle /
            player.fov
        ) *
        width;


    const size =
        Math.min(
            height,
            height /
            distance
        );


    ctx.fillStyle =
        "rgba(0,0,0,0.95)";


    ctx.beginPath();


    ctx.ellipse(
        screenX,
        height / 2,
        size * 0.18,
        size * 0.48,
        0,
        0,
        Math.PI * 2
    );


    ctx.fill();

}


/* =========================================================
   LOOP RESET
========================================================= */

function resetLoop() {

    player.x =
        2.5;


    player.y =
        3.5;


    player.angle =
        0;


    timeLeft =
        60;


    keyCollected =
        false;


    drawerOpen =
        false;


    key.visible =
        false;


    horrorActive =
        false;


    horrorTimer =
        8;


    timerUI.textContent =
        "60.0";


    loopUI.textContent =
        "Loop " +
        loopNumber;


    updatePrompt();

}


/* =========================================================
   GAME OVER
========================================================= */

function endGame() {

    running =
        false;


    if (
        document.pointerLockElement
    ) {

        document.exitPointerLock();

    }


    gameOver.style.display =
        "flex";

}


/* =========================================================
   START
========================================================= */

function startGame() {

    startAudio();


    loopNumber =
        1;


    resetLoop();


    running =
        true;


    startScreen.style.display =
        "none";


    gameOver.style.display =
        "none";


    canvas.requestPointerLock();


    lastTime =
        performance.now();


    requestAnimationFrame(
        gameLoop
    );

}


/* =========================================================
   RESTART
========================================================= */

function restartGame() {

    startGame();

}


/* =========================================================
   BUTTONS
========================================================= */

playButton.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();

        startGame();

    }
);


restartButton.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();

        restartGame();

    }
);


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop(
    time
) {

    if (
        !running
    ) {

        return;

    }


    const dt =
        Math.min(
            (
                time -
                lastTime
            ) / 1000,
            0.05
        );


    lastTime =
        time;


    timeLeft -=
        dt;


    if (
        timeLeft <= 0
    ) {

        timeLeft =
            0;


        timerUI.textContent =
            "0.0";


        endGame();


        return;

    }


    timerUI.textContent =
        timeLeft.toFixed(
            1
        );


    updateMovement(
        dt
    );


    updatePrompt();

    updateHorror(
        dt
    );


    drawWorld();

    drawObjects();

    drawHorror();

    drawDarkness();


    requestAnimationFrame(
        gameLoop
    );

}


/* =========================================================
   INITIALISE
========================================================= */

resetLoop();


drawWorld();

drawDarkness();

</script>
