renderer.setSize(

    innerHeight
);

renderer.setPixelRatio(

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =

/* =========================================================
   PLAYER
========================================================= */

const player = {

    position:

/* =========================================================
   INPUT
========================================================= */

const keys = {};

let running = false;
let pointerLocked = false;

document.addEventListener(
    "keydown",
    event => {

        keys[event.code] = true;

        if (
            event.code === "KeyF" &&
            running
        ){

            flashlightOn =
                !flashlightOn;

            updateFlashlight();

        }

        if (
            event.code === "KeyE" &&
            running
        ){

            interact();

        }

    }
);


document.addEventListener(
    "keyup",
    event => {

        keys[event.code] = false;

    }
);


renderer.domElement.addEventListener(
    "click",
    () => {

        if(running){

            renderer.domElement
                .requestPointerLock();

        }

    }
);


document.addEventListener(
    "pointerlockchange",
    () => {

        pointerLocked =
            document.pointerLockElement ===
            renderer.domElement;

    }
);


document.addEventListener(
    "mousemove",
    event => {

        if(
            !pointerLocked ||
            !running
        ){
            return;
        }

        player.yaw -=
            event.movementX *
            .0023;

        player.pitch -=
            event.movementY *
            .0023;

        player.pitch =
            Math.max(

                Math.min(

                    player.pitch

            );

);


/* =========================================================

========================================================= */

/* =========================================================
   COLLISION SYSTEM
========================================================= */

const colliders = [];


function addCollider(
    x,
    z,
    width,
    depth
){

    colliders.push({

        minX:x-width/2,
        maxX:x+width/2,

        minZ:z-depth/2,
        maxZ:z+depth/2

    });

}


function blocked(
    x,
    z
){

    const r =
        player.radius;

    for(
        const c of colliders
    ){

        if(
            x+r > c.minX &&
            x-r < c.maxX &&
            z+r > c.minZ &&
            z-r < c.maxZ
        ){

            return true;

        }

    }

    return false;

}


/* =========================================================
   BOX HELPER
========================================================= */

function makeBox(
    x,
    y,
    z,
    width,
    height,
    depth,
    material,
    collision=true
){

    const mesh =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width,
                height,
                depth
            ),
            material
        );

    mesh.position.set(
        x,
        y,
        z
    );

    mesh.castShadow = true;
    mesh.receiveShadow = true;

    scene.add(mesh);

    if(collision){

        addCollider(
            x,
            z,
            width,
            depth
        );

    }

    return mesh;

}

/* =========================================================
   INTERACTION
========================================================= */

const cabinetPoint =
    new THREE.Vector3(
        -28,
        1.5,
        13
    );


function interact(){

    /* KEY */

    if(
        !keyTaken &&
        player.position.distanceTo(
            cabinetPoint
        ) < 3
    ){

        if(!drawerOpen){

            drawerOpen = true;

            drawers[2].position.z -= .55;

            showMessage(
                "The drawer is open."
            );

        }
        else{

            keyTaken = true;

            keyGroup.visible =
                false;

            mazeUnlocked = true;

            document.getElementById(
                "objective"
            ).textContent =
                "Find the maze.";

            showMessage(
                "You found a key."
            );

        }

        return;

    }


    /* EXIT */

    if(
        mazeUnlocked &&
        player.position.distanceTo(
            exit.position
        ) < 4
    ){

        winGame();

    }

}


/* =========================================================
   MESSAGE
========================================================= */

let messageTimeout;


function showMessage(
    text,
    duration=2200
){

    const message =
        document.getElementById(
            "message"
        );

    message.textContent =
        text;

    clearTimeout(
        messageTimeout
    );

    messageTimeout =
        setTimeout(
            () => {

                message.textContent =
                    "";

            },
            duration
        );

}


/* =========================================================
   AUDIO
========================================================= */

let audioContext = null;
let masterGain = null;
let lastStep = 0;


function setupAudio(){

    if(audioContext){
        return;
    }

    audioContext =
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();

    masterGain =
        audioContext.createGain();

    masterGain.gain.value =
        .035;

    masterGain.connect(
        audioContext.destination
    );

}


function tone(
    frequency,
    duration,
    volume=.05
){

    if(!audioContext){
        return;
    }

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.type =
        "sine";

    oscillator.frequency.value =
        frequency;

    gain.gain.setValueAtTime(
        volume,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioContext.currentTime+
        duration
    );

    oscillator.connect(
        gain
    );

    gain.connect(
        masterGain
    );

    oscillator.start();

    oscillator.stop(
        audioContext.currentTime+
        duration
    );

}


function footstep(){

    if(!audioContext){
        return;
    }

    const now =
        performance.now();

    if(
        now-lastStep <
        340
    ){
        return;
    }

    lastStep =
        now;

    tone(
        65+
        Math.random()*25,
        .08,
        .08
    );

}


/* =========================================================
   MOVEMENT
========================================================= */

function updateMovement(
    dt
){

    let forward=0;
    let side=0;


    if(keys["KeyW"])
        forward++;

    if(keys["KeyS"])
        forward--;

    if(keys["KeyA"])
        side--;

    if(keys["KeyD"])
        side++;


    const length =
        Math.hypot(
            forward,
            side
        );


    if(length>0){

        forward /= length;
        side /= length;


        /*
            W = forward
            S = backward
            A = left
            D = right
        */

        const forwardX =
            -Math.sin(
                player.yaw
            );

        const forwardZ =
            -Math.cos(
                player.yaw
            );

        const rightX =
            Math.cos(
                player.yaw
            );

        const rightZ =
            -Math.sin(
                player.yaw
            );


        const moveX =
            (
                forwardX*forward+
                rightX*side
            )*
            player.speed*
            dt;


        const moveZ =
            (
                forwardZ*forward+
                rightZ*side
            )*
            player.speed*
            dt;


        const nextX =
            player.position.x+
            moveX;


        const nextZ =
            player.position.z+
            moveZ;


        if(
            !blocked(
                nextX,
                player.position.z
            )
        ){

            player.position.x =
                nextX;

        }


        if(
            !blocked(
                player.position.x,
                nextZ
            )
        ){

            player.position.z =
                nextZ;

        }


        footstep();

    }


    camera.position.copy(
        player.position
    );

    camera.rotation.y =
        player.yaw;

    camera.rotation.x =
        player.pitch;


    const direction =
        new THREE.Vector3(
            0,
            0,
            -1
        );

    direction.applyQuaternion(
        camera.quaternion
    );

    flashlightTarget.position.copy(
        camera.position
    );

    flashlightTarget.position.add(
        direction.multiplyScalar(
            25
        )
    );

}


/* =========================================================
   TIMER
========================================================= */

let loopStart = 0;

const LOOP_TIME =
    60000;


function updateTimer(){

    if(!running){
        return;
    }

    const elapsed =
        performance.now() -
        loopStart;

    const remaining =
        Math.max(
            0,
            LOOP_TIME -
            elapsed
        );

    const seconds =
        Math.ceil(
            remaining/1000
        );


    document.getElementById(
        "timer"
    ).textContent =
        seconds;


    if(
        remaining <= 0
    ){

        resetLoop();

    }

}


/* =========================================================
   LOOP RESET
========================================================= */

    player.position.set(
        0,
        1.65,
        12
    );

    player.yaw =
        Math.PI;

    player.pitch =

    keyTaken =

    drawerOpen =

    mazeUnlocked =
        false;


    keyGroup.visible =
        true;


    drawers[2].position.z =
        12.43;


    document.getElementById(
        "objective"
    ).textContent =
        "Find the key.";


    showMessage(
        "LOOP RESET",
        1800
    );


    tone(
        45,
        .8,
        .14
    );


    loopStart =
        performance.now();

}


/* =========================================================
   WIN
========================================================= */

function winGame(){

    running =
        false;

    gameWon =
        true;


    if(
        document.pointerLockElement
    ){

        document.exitPointerLock();

    }


    document.getElementById(
        "gameOver"
    ).style.display =
        "flex";


    document.getElementById(
        "gameOverText"
    ).textContent =
        "You found the exit.";

}


/* =========================================================
   START
========================================================= */

function startGame(){

    setupAudio();

    if(
        audioContext &&
        audioContext.state ===
        "suspended"
    ){

        audioContext.resume();

    }


    document.getElementById(
        "startScreen"
    ).style.display =
        "none";


    document.getElementById(
        "gameOver"
    ).style.display =
        "none";


    gameWon =
        false;

    running =
        true;


    resetLoop();


    renderer.domElement
        .requestPointerLock();

}


/* =========================================================
   BUTTONS
========================================================= */

document.getElementById(
    "startButton"
).addEventListener(
    "click",
    startGame
);


document.getElementById(
    "restartButton"
).addEventListener(
    "click",
    startGame
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            innerWidth /
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);


/* =========================================================
   ANIMATION
========================================================= */

let previousTime =
    performance.now();


function animate(
    time
){

    requestAnimationFrame(
        animate
    );


    const dt =
        Math.min(
            (time-previousTime)/
            1000,
            .05
        );

    previousTime =
        time;


    if(running){

        updateMovement(dt);

        updateTimer();


        if(
            keyGroup.visible
        ){

            keyGroup.rotation.y +=
                dt*1.5;

        }

    }


    renderer.render(
        scene,
        camera
    );

}


updateFlashlight();

animate(
    performance.now()
);

</script>

</body>
</html>
