    maze[0].length *
    mazeCell;

    maze.length *
    mazeCell;

   lines up exactly with x = 0.
*/

    -mazeWidth / 2 +
    mazeCell / 2;

   MAZE WALLS
========================================================= */

    let row = 0;
    row < maze.length;
    row++
) {

        let col = 0;
        col < maze[row].length;
        col++
    ) {

        if (
            maze[row][col] !== "#"
        ) {

            continue;

        }


        const x =
            mazeOriginX +
            col *
            mazeCell;


        const z =
            room2OffsetZ +
            row *
            mazeCell;


        createBox(

            x,

            1.5,

            z,

            mazeCell,

            3,

            mazeCell,

            0x252a33

        );

    }

/* =========================================================

/* =========================================================

let flashlightOn =

/* =========================================================
   FLASHLIGHT TOGGLE
========================================================= */

function toggleFlashlight() {

/* =========================================================
   WORLD BOUNDS
========================================================= */

const worldMinX =
    mazeOriginX -
    mazeCell;


const worldMaxX =
    mazeOriginX +
    mazeWidth;


const worldMinZ =
    -8.5;


const worldMaxZ =
    room2OffsetZ +
    mazeHeight +
    3;


/* =========================================================
   MAZE COLLISION
========================================================= */


/*
   Proper circle-vs-AABB collision.

   This is much better than checking which
   grid square the player's centre is in.

   It prevents clipping through corners
   and lets the player move smoothly.
*/

function circleIntersectsBox(
    px,
    pz,
    radius,
    cx,
    cz,
    halfWidth,
    halfDepth
) {

    const closestX =
        Math.max(
            cx - halfWidth,
            Math.min(
                px,
                cx + halfWidth
            )
        );


    const closestZ =
        Math.max(
            cz - halfDepth,
            Math.min(
                pz,
                cz + halfDepth
            )
        );


    const dx =
        px -
        closestX;


    const dz =
        pz -
        closestZ;


    return (
        dx * dx +
        dz * dz
        <
        radius * radius
    );

}


/* =========================================================
   OFFICE COLLISION
========================================================= */

function officeCollision(
    x,
    z
) {

    const r =
        player.radius;


    /*
       Outer side walls.
    */

    if (
        x - r < -9
        ||
        x + r > 9
    ) {

        return true;

    }


    /*
       Front wall.
    */

    if (
        z - r < -9
    ) {

        return true;

    }


    /*
       Back wall.

       Centre is open for the maze entrance.
    */

    if (
        z + r > 9
        &&
        Math.abs(x) > 1.35
    ) {

        return true;

    }


    /*
       Desk collision.
    */

    if (
        circleIntersectsBox(

            x,
            z,
            r,

            -1.8,
            -2.7,

            2.6,
            1.0

        )
    ) {

        return true;

    }


    /*
       Filing cabinet collision.
    */

    const cabinetPositions = [

        [5.2, -2.7],
        [7.0, -2.7],
        [5.2, 0.7]

    ];


    for (
        const [cx, cz]
        of cabinetPositions
    ) {

        if (
            circleIntersectsBox(

                x,
                z,
                r,

                cx,
                cz,

                0.75,
                0.5

            )
        ) {

            return true;

        }

    }


    /*
       Bookshelf collision.
    */

    if (
        circleIntersectsBox(

            x,
            z,
            r,

            6.8,
            -5.8,

            1.25,
            0.3

        )
    ) {

        return true;

    }


    /*
       Boxes.
    */

    if (
        circleIntersectsBox(

            x,
            z,
            r,

            3.1,
            5.7,

            0.58,
            0.55

        )
    ) {

        return true;

    }


    if (
        circleIntersectsBox(

            x,
            z,
            r,

            4.2,
            6.3,

            0.38,
            0.38

        )
    ) {

        return true;

    }


    return false;

}


/* =========================================================
   MAZE COLLISION
========================================================= */

function mazeCollision(
    x,
    z
) {

    const r =
        player.radius;


    /*
       Check every wall cell.

       The maze is only 15 x 13,
       so this is easily fast enough.
    */

    for (
        let row = 0;
        row < maze.length;
        row++
    ) {

        for (
            let col = 0;
            col < maze[row].length;
            col++
        ) {

            if (
                maze[row][col] !== "#"
            ) {

                continue;

            }


            const wallX =
                mazeOriginX +
                col *
                mazeCell;


            const wallZ =
                room2OffsetZ +
                row *
                mazeCell;


            if (
                circleIntersectsBox(

                    x,
                    z,
                    r,

                    wallX,
                    wallZ,

                    mazeCell / 2,
                    mazeCell / 2

                )
            ) {

                return true;

            }

        }

    }


    return false;

}


/* =========================================================
   MASTER COLLISION
========================================================= */

function collidesAt(
    x,
    z
) {

    /*
       Office.
    */

    if (
        z < 9.2
    ) {

        if (
            officeCollision(
                x,
                z
            )
        ) {

            return true;

        }

    }


    /*
       Maze.
    */

    if (
        z >= 9
    ) {

        if (
            mazeCollision(
                x,
                z
            )
        ) {

            return true;

        }

    }


    /*
       World limits.
    */

    if (
        x <
        worldMinX
        ||
        x >
        worldMaxX
        ||
        z <
        worldMinZ
        ||
        z >
        worldMaxZ
    ) {

        return true;

    }


    return false;

}


/* =========================================================
   MOVEMENT
========================================================= */

function updateMovement(
    delta
) {

    let forward = 0;

    let strafe = 0;


    if (keys.w) {

        forward += 1;

    }


    if (keys.s) {

        forward -= 1;

    }


    if (keys.d) {

        strafe += 1;

    }


    if (keys.a) {

        strafe -= 1;

    }


    if (

        forward === 0
        &&
        strafe === 0

    ) {

        return;

    }


    const length =
        Math.hypot(
            forward,
            strafe
        );


    forward /= length;

    strafe /= length;


    const forwardX =
        -Math.sin(
            player.yaw
        );


    const forwardZ =
        -Math.cos(
            player.yaw
        );


    const rightX =
        Math.cos(
            player.yaw
        );


    const rightZ =
        -Math.sin(
            player.yaw
        );


    const moveX =

        (

            forwardX *
            forward

            +

            rightX *
            strafe

        )

        *

        player.speed

        *

        delta;


    const moveZ =

        (

            forwardZ *
            forward

            +

            rightZ *
            strafe

        )

        *

        player.speed

        *

        delta;


    /*
       X collision.
    */

    const nextX =
        player.position.x +
        moveX;


    if (
        !collidesAt(

            nextX,

            player.position.z

        )
    ) {

        player.position.x =
            nextX;

    }


    /*
       Z collision.
    */

    const nextZ =
        player.position.z +
        moveZ;


    if (
        !collidesAt(

            player.position.x,

            nextZ

        )
    ) {

        player.position.z =
            nextZ;

    }


    /*
       Hard bounds.
    */

    player.position.x =
        THREE.MathUtils.clamp(

            player.position.x,

            worldMinX +
            player.radius,

            worldMaxX -
            player.radius

        );


    player.position.z =
        THREE.MathUtils.clamp(

            player.position.z,

            worldMinZ +
            player.radius,

            worldMaxZ -
            player.radius

        );

}


/* =========================================================
   DRAWER
========================================================= */

function getClosestDrawer() {

    let closest = null;

    let closestDistance =
        Infinity;


    for (
        const drawer
        of drawers
    ) {

        const distance =
            player.position.distanceTo(

                drawer.drawer.position

            );


        if (

            distance < 2.1
            &&
            distance <
            closestDistance

        ) {

            closest =
                drawer;

            closestDistance =
                distance;

        }

    }


    return closest;

}


/* =========================================================
   INTERACT
========================================================= */

function interact() {

    if (
        !running
    ) {

        return;

    }


    const drawer =
        getClosestDrawer();


    if (
        drawer
    ) {

        drawer.open =
            !drawer.open;


        drawer.drawer.position.z =

            drawer.open

                ? drawer.openZ

                : drawer.closedZ;


        drawer.handle.position.z =

            drawer.open

                ? drawer.openZ - 0.1

                : drawer.closedZ - 0.1;


        /*
           Key.
        */

        if (

            drawer.id ===
            memory.keyDrawer

            &&
            drawer.open

            &&
            !memory.keyFound

        ) {

            memory.keyFound =
                true;


            updateObjective();


            showMessage(
                "You found the key."
            );

        }


        /*
           Flashlight.
        */

        if (

            drawer.id ===
            memory.flashlightDrawer

            &&
            drawer.open

            &&
            !memory.flashlightFound

        ) {

            memory.flashlightFound =
                true;


            updateFlashlightHUD();


            showMessage(

                "You found a flashlight. Press F to use it."

            );

        }


        if (

            drawer.id !==
            memory.keyDrawer

            &&
            drawer.id !==
            memory.flashlightDrawer

        ) {

            showMessage(

                drawer.open

                    ? "Drawer opened."

                    : "Drawer closed."

            );

        }


        return;

    }


    /*
       Office door.
    */

    if (

        player.position.z >
        7.3

        &&
        Math.abs(
            player.position.x
        ) < 2

    ) {

        if (
            memory.keyFound
        ) {

            openMainDoor();

        }
        else {

            showMessage(
                "The door is locked."
            );

        }


        return;

    }


    /*
       Maze key.
    */

    if (

        !memory.mazeKeyFound

        &&

        mazeKey.visible

        &&

        player.position.distanceTo(
            mazeKey.position
        ) < 2

    ) {

        memory.mazeKeyFound =
            true;


        mazeKey.visible =
            false;


        updateObjective();


        showMessage(
            "You found the second key."
        );


        return;

    }


    /*
       Final door.
    */

    const finalDoorDistance =
        Math.abs(

            player.position.z -
            finalDoor.position.z

        );


    if (
        finalDoorDistance < 3
        &&
        Math.abs(
            player.position.x
        ) < 2
    ) {

        if (
            memory.mazeKeyFound
        ) {

            winGame();

        }
        else {

            showMessage(
                "The final door is locked."
            );

        }

    }

}


/* =========================================================
   MAIN DOOR
========================================================= */

let doorOpening =
    false;


function openMainDoor() {

    if (
        doorOpening
    ) {

        return;

    }


    doorOpening =
        true;


    showMessage(
        "The door opens..."
    );

}


function updateDoor(
    delta
) {

    if (
        !doorOpening
    ) {

        return;

    }


    mainDoor.position.y +=
        delta * 3;


    doorHandle.position.y +=
        delta * 3;


    if (
        mainDoor.position.y >
        5
    ) {

        mainDoor.visible =
            false;


        doorHandle.visible =
            false;

    }

}


/* =========================================================
   OBJECTIVE
========================================================= */

const objective =
    document.getElementById(
        "objective"
    );


function updateObjective() {

    if (
        !memory.keyFound
    ) {

        objective.textContent =
            "Search the office for the key.";

    }
    else if (
        !memory.mazeEntered
    ) {

        objective.textContent =
            "Find the office door.";

    }
    else if (
        !memory.mazeKeyFound
    ) {

        objective.textContent =
            "Find your way through the maze.";

    }
    else {

        objective.textContent =
            "Find the final door.";

    }

}


/* =========================================================
   FLASHLIGHT HUD
========================================================= */

function updateFlashlightHUD() {

    const hud =
        document.getElementById(
            "flashlightStatus"

    if (

    ) {

        hud.textContent =

/* =========================================================
   MESSAGE
========================================================= */

const message =
    document.getElementById(
        "message"
    );


let messageTimer =
    0;


function showMessage(

    message.textContent =

}


/* =========================================================
   PROMPT
========================================================= */

const prompt =
    document.getElementById(
        "prompt"
    );


function updatePrompt() {

    const drawer =
        getClosestDrawer();


    if (
        drawer
    ) {

        prompt.textContent =

            drawer.open

                ? "E  Close drawer"

                : "E  Open drawer";


        prompt.style.display =
            "block";


        return;

    }


    /*
       Office door.
    */

    if (

        player.position.z >
        7.3

        &&
        Math.abs(
            player.position.x
        ) < 2

    ) {

        prompt.textContent =

            memory.keyFound

                ? "E  Open door"

                : "E  Door locked";


        prompt.style.display =
            "block";


        return;

    }


    /*
       Maze key.
    */

    if (

        !memory.mazeKeyFound

        &&
        mazeKey.visible

        &&
        player.position.distanceTo(
            mazeKey.position
        ) < 2

    ) {

        prompt.textContent =
            "E  Pick up key";


        prompt.style.display =
            "block";

    }


    /*
       Final door.
    */

    if (

        Math.abs(

            player.position.z -
            finalDoor.position.z

        ) < 3

        &&
        Math.abs(
            player.position.x
        ) < 2

    ) {

        prompt.textContent =

            memory.mazeKeyFound

                ? "E  Open final door"

                : "Locked";


        prompt.style.display =
            "block";


        return;

    }


    prompt.style.display =
        "none";

}


/* =========================================================
   ROOM DETECTION
========================================================= */

function updateRoomState() {

    if (
        player.position.z >

    ) {

        if (
            !memory.mazeEntered
        ) {

            memory.mazeEntered =
                true;


            updateObjective();

        }

    }

}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera() {

    camera.position.copy(
        player.position
    );


    camera.rotation.order =
        "YXZ";


    camera.rotation.y =
        player.yaw;


    camera.rotation.x =
        player.pitch;

}


/* =========================================================
   LOOP RESET
========================================================= */

function resetLoop() {

    loopNumber++;

    timeLeft =
        60;


    player.position.set(
        0,
        1.65,
        6
    );


    player.yaw =
        0;


    player.pitch =
        0;


    /*
       Reset office door.
    */

    doorOpening =
        false;


    mainDoor.position.y =
        2;


    mainDoor.visible =
        true;


    doorHandle.position.y =
        2;


    doorHandle.visible =
        true;


    /*
       Reset drawers.
    */

    for (
        const drawer
        of drawers
    ) {

        drawer.open =
            false;


        drawer.drawer.position.z =
            drawer.closedZ;


        drawer.handle.position.z =
            drawer.closedZ -
            0.1;

    }


    /*
       Reset flashlight physically.
    */

    flashlightOn =
        false;


    flashlight.intensity =
        0;


    flashlightBody.visible =
        false;


    flashlightLens.visible =
        false;


    updateFlashlightHUD();


    /*
       Maze key comes back until
       the player has permanently found it.
    */

    mazeKey.visible =
        !memory.mazeKeyFound;


    updateObjective();


    showMessage(
        "The loop begins again."
    );

}


/* =========================================================
   TIMER
========================================================= */

const timer =
    document.getElementById(
        "timer"
    );


const loopCounter =
    document.getElementById(
        "loopCounter"
    );


function updateTimer(
    delta
) {

    timeLeft -=
        delta;


    if (
        timeLeft <= 0
    ) {

        timeLeft =
            0;


        resetLoop();

    }


    timer.textContent =
        timeLeft.toFixed(1);


    loopCounter.textContent =
        "Loop " +
        loopNumber;

}


/* =========================================================
   WIN
========================================================= */

const winScreen =
    document.getElementById(
        "winScreen"
    );


function winGame() {

    if (
        won
    ) {

        return;

    }


    won =
        true;


    running =
        false;


    if (
        document.pointerLockElement
    ) {

        document.exitPointerLock();

    }


    winScreen.style.display =
        "flex";

}


/* =========================================================
   START
========================================================= */

function startGame() {

    document.getElementById(
        "startScreen"
    ).style.display =
        "none";


    won =
        false;


    running =
        true;


    loopNumber =
        1;


    timeLeft =
        60;


    updateObjective();

    updateFlashlightHUD();


    lastTime =
        performance.now();


    requestAnimationFrame(
        loop
    );

}


/* =========================================================
   BUTTONS
========================================================= */

document.getElementById(
    "startButton"
).addEventListener(
    "click",
    startGame
);


document.getElementById(
    "restartButton"
).addEventListener(
    "click",
    () => {

        location.reload();

    }
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =

            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

            window.innerWidth,

            window.innerHeight

        );

    }
);


/* =========================================================
   GAME LOOP
========================================================= */

function loop(
    time
) {

    if (
        !running
    ) {

        renderer.render(
            scene,
            camera
        );

        return;

    }


    const delta =

        Math.min(

            (
                time -
                lastTime
            ) / 1000,

            0.033

        );


    lastTime =
        time;


    updateTimer(
        delta
    );


    updateMovement(
        delta
    );


    updateDoor(
        delta
    );


    updateRoomState();


    updatePrompt();


    updateCamera();


    if (
        messageTimer > 0
    ) {

        messageTimer -=
            delta;


        if (
            messageTimer <= 0
        ) {

            message.style.display =
                "none";

        }

    }


    renderer.render(
        scene,
        camera
    );


    requestAnimationFrame(
        loop
    );

}


/* =========================================================
   INITIAL
========================================================= */

updateObjective();

updateFlashlightHUD();

updateCamera();


renderer.render(
    scene,
    camera
);

</script>
