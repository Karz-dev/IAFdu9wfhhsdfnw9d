<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOOP</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050505;
    font-family: Arial, sans-serif;
    color: white;
}

canvas {
    display: block;
}

#menu {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background:
        radial-gradient(circle, rgba(30,30,30,.4), rgba(0,0,0,.97));
}

#menu h1 {
    font-size: 64px;
    letter-spacing: 12px;
    margin: 0 0 10px;
}

#menu p {
    color: #aaa;
    margin-bottom: 30px;
}

#play {
    border: 0;
    border-radius: 8px;
    padding: 15px 45px;
    font-size: 22px;
    font-weight: bold;
    color: white;
    background: #222;
    cursor: pointer;
}

#play:hover {
    background: #444;
}

#hud {
    position: fixed;
    inset: 0;
    z-index: 5;
    pointer-events: none;
}

#timer {
    position: absolute;
    top: 20px;
    left: 20px;
    font-size: 24px;
    font-weight: bold;
    text-shadow: 0 2px 5px black;
}

#objective {
    position: absolute;
    top: 55px;
    left: 20px;
    color: #bbb;
    font-size: 14px;
    text-shadow: 0 2px 5px black;
}

#crosshair {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 5px;
    height: 5px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: rgba(255,255,255,.8);
}

#message {
    position: absolute;
    bottom: 50px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 16px;
    color: #ddd;
    text-shadow: 0 2px 6px black;
}

#fade {
    position: fixed;
    inset: 0;
    z-index: 10;
    background: black;
    pointer-events: none;
    opacity: 0;
    transition: opacity .5s;
}

#hint {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    color: #777;
    font-size: 12px;
}
</style>

</head>

<body>

<div id="menu">
    <h1>LOOP</h1>
    <p>Something is wrong with this place.</p>
    <button id="play">ENTER</button>
</div>

<div id="hud">
    <div id="timer">60.0</div>
    <div id="objective">Find the key.</div>
    <div id="crosshair"></div>
    <div id="message"></div>
    <div id="hint">WASD • Mouse • F flashlight • E interact</div>
</div>

<div id="fade"></div>

<script type="module">

/* =========================================================
   THREE.JS
========================================================= */

import * as THREE from "./three.module.min.js";


/* =========================================================
   BASIC SETUP
========================================================= */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(0x050505);

scene.fog =
    new THREE.FogExp2(
        0x050505,
        0.035
    );


const camera =
    new THREE.PerspectiveCamera(
        75,
        window.innerWidth /
        window.innerHeight,
        0.05,
        200
    );


const renderer =
    new THREE.WebGLRenderer({
        antialias: true
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

renderer.shadowMap.enabled = true;

document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   UI
========================================================= */

const menu =
    document.getElementById("menu");

const playButton =
    document.getElementById("play");

const timerText =
    document.getElementById("timer");

const objectiveText =
    document.getElementById("objective");

const messageText =
    document.getElementById("message");

const fade =
    document.getElementById("fade");


/* =========================================================
   GAME STATE
========================================================= */

let gameStarted = false;
let gameRunning = false;

let loopTime = 60;

let hasKey = false;
let drawerOpened = false;
let flashlightOn = true;

let inMaze = false;
let escapedMaze = false;

let yaw = 0;
let pitch = 0;

let messageTimer = 0;


/* =========================================================
   PLAYER
========================================================= */

const player = {

    position:
        new THREE.Vector3(
            0,
            1.7,
            8
        ),

    height: 1.7,

    speed: 4.2,

    radius: .35
};


camera.position.copy(
    player.position
);


/* =========================================================
   INPUT
========================================================= */

const keys = {};

window.addEventListener(
    "keydown",
    event => {

        keys[event.code] = true;

        if (
            event.code === "KeyF" &&
            gameRunning
        ) {

            flashlightOn =
                !flashlightOn;

            flashlight.visible =
                flashlightOn;
        }

        if (
            event.code === "KeyE" &&
            gameRunning
        ) {

            interact();
        }

    }
);


window.addEventListener(
    "keyup",
    event => {

        keys[event.code] = false;

    }
);


/* =========================================================
   MOUSE LOOK
========================================================= */

renderer.domElement.addEventListener(
    "click",
    () => {

        if (
            gameRunning &&
            document.pointerLockElement !==
            renderer.domElement
        ) {

            renderer.domElement.requestPointerLock();

        }

    }
);


document.addEventListener(
    "mousemove",
    event => {

        if (
            document.pointerLockElement !==
            renderer.domElement
        ) return;

        yaw -=
            event.movementX *
            0.0022;

        pitch -=
            event.movementY *
            0.0022;

        pitch =
            Math.max(
                -1.45,
                Math.min(
                    1.45,
                    pitch
                )
            );

    }
);


/* =========================================================
   MATERIALS
========================================================= */

const wallMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x282828,
        roughness: .95
    });

const floorMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x161616,
        roughness: 1
    });

const ceilingMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x101010,
        roughness: 1
    });

const woodMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x332820,
        roughness: .9
    });

const metalMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x303030,
        metalness: .45,
        roughness: .6
    });


/* =========================================================
   HELPERS
========================================================= */

const colliders = [];

function box(
    x,
    y,
    z,
    sx,
    sy,
    sz,
    material,
    collide = true
) {

    const geometry =
        new THREE.BoxGeometry(
            sx,
            sy,
            sz
        );

    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );

    mesh.position.set(
        x,
        y,
        z
    );

    mesh.castShadow = true;
    mesh.receiveShadow = true;

    scene.add(mesh);

    if (collide) {

        colliders.push({
            x,
            z,
            sx,
            sz
        });

    }

    return mesh;
}


/* =========================================================
   FLOOR
========================================================= */

box(
    0,
    -0.1,
    0,
    80,
    .2,
    80,
    floorMaterial,
    false
);

box(
    0,
    5,
    0,
    80,
    .2,
    80,
    ceilingMaterial,
    false
);


/* =========================================================
   OFFICE OUTER WALLS
========================================================= */

box(
    0,
    2.5,
    -35,
    70,
    5,
    .5,
    wallMaterial
);

box(
    0,
    2.5,
    35,
    70,
    5,
    .5,
    wallMaterial
);

box(
    -35,
    2.5,
    0,
    .5,
    5,
    70,
    wallMaterial
);

box(
    35,
    2.5,
    0,
    .5,
    5,
    70,
    wallMaterial
);


/* =========================================================
   OFFICE ROOMS
========================================================= */

box(
    -12,
    2.5,
    -18,
    25,
    5,
    .5,
    wallMaterial
);

box(
    12,
    2.5,
    -18,
    20,
    5,
    .5,
    wallMaterial
);

box(
    -22,
    2.5,
    0,
    .5,
    5,
    25,
    wallMaterial
);

box(
    15,
    2.5,
    0,
    .5,
    5,
    25,
    wallMaterial
);


/* =========================================================
   DESKS
========================================================= */

function makeDesk(
    x,
    z
) {

    box(
        x,
        .8,
        z,
        3.5,
        .25,
        1.6,
        woodMaterial
    );

    box(
        x - 1.45,
        .4,
        z,
        .2,
        .8,
        1.3,
        woodMaterial
    );

    box(
        x + 1.45,
        .4,
        z,
        .2,
        .8,
        1.3,
        woodMaterial
    );

    box(
        x,
        1.45,
        z,
        1.2,
        1.1,
        .12,
        metalMaterial,
        false
    );

    box(
        x,
        1.12,
        z - .05,
        .8,
        .08,
        .5,
        metalMaterial,
        false
    );
}


makeDesk(-28, -8);
makeDesk(-18, -8);
makeDesk(-8, -8);

makeDesk(-28, 5);
makeDesk(-18, 5);

makeDesk(5, -8);
makeDesk(5, 4);

makeDesk(25, -8);


/* =========================================================
   CHAIRS
========================================================= */

function makeChair(
    x,
    z
) {

    box(
        x,
        .65,
        z,
        .8,
        .15,
        .8,
        metalMaterial
    );

    box(
        x,
        1.2,
        z + .35,
        .75,
        1,
        .12,
        metalMaterial
    );
}


makeChair(-28, -5.8);
makeChair(-18, -5.8);
makeChair(-8, -5.8);

makeChair(-28, 7.2);
makeChair(-18, 7.2);


/* =========================================================
   BOOKSHELVES
========================================================= */

function makeShelf(
    x,
    z
) {

    box(
        x,
        2,
        z,
        .6,
        4,
        4,
        woodMaterial
    );

    for (
        let i = 0;
        i < 4;
        i++
    ) {

        box(
            x,
            .55 + i * 1,
            z - 1.7,
            .65,
            .08,
            3.3,
            woodMaterial,
            false
        );

    }
}


makeShelf(-30, 22);
makeShelf(-26, 22);
makeShelf(29, -25);


/* =========================================================
   FILING CABINET
========================================================= */

const cabinet =
    new THREE.Group();

cabinet.position.set(
    -28,
    0,
    12
);

scene.add(cabinet);


const cabinetBody =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            2.5,
            3,
            1.5
        ),
        metalMaterial
    );

cabinetBody.position.y =
    1.5;

cabinet.add(
    cabinetBody
);


const drawers = [];

for (
    let i = 0;
    i < 3;
    i++
) {

    const drawer =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                2.1,
                .75,
                .15
            ),
            metalMaterial
        );

    drawer.position.set(
        0,
        .65 + i * .95,
        -.82
    );

    cabinet.add(drawer);

    drawers.push(drawer);

}


/* =========================================================
   KEY
========================================================= */

const key =
    new THREE.Mesh(
        new THREE.TorusGeometry(
            .16,
            .045,
            8,
            20
        ),
        new THREE.MeshStandardMaterial({
            color: 0xd6b85a,
            metalness: .8,
            roughness: .25
        })
    );

key.position.set(
    -28,
    1.65,
    11.35
);

scene.add(key);


/* =========================================================
   MAZE
========================================================= */

const maze = [

    "###############",
    "#S............#",
    "#.#####.#####.#",
    "#.#...#.#.....#",
    "#.#.#.#.#.###.#",
    "#...#...#...#.#",
    "###.#####.#.#.#",
    "#...#.....#...#",
    "#.###.#########",
    "#.....#.......#",
    "#.#####.#####.#",
    "#.......#...K.#",
    "#######.#######"

];


const cell = 2.4;

const mazeOriginX =
    -16;

const mazeOriginZ =
    15;


for (
    let row = 0;
    row < maze.length;
    row++
) {

    for (
        let col = 0;
        col < maze[row].length;
        col++
    ) {

        if (
            maze[row][col] !== "#"
        ) continue;

        const x =
            mazeOriginX +
            col * cell;

        const z =
            mazeOriginZ +
            row * cell;

        box(
            x,
            2.5,
            z,
            cell,
            5,
            cell,
            wallMaterial
        );

    }

}


/* =========================================================
   MAZE EXIT
========================================================= */

const exitDoor =
    box(
        25,
        2.5,
        25,
        3,
        5,
        .5,
        metalMaterial,
        false
    );


/* =========================================================
   LIGHTING
========================================================= */

const ambient =
    new THREE.HemisphereLight(
        0x555555,
        0x080808,
        .18
    );

scene.add(ambient);


const officeLight =
    new THREE.PointLight(
        0x777777,
        2,
        25
    );

officeLight.position.set(
    -10,
    4,
    -10
);

officeLight.castShadow = true;

scene.add(
    officeLight
);


/* =========================================================
   RANDOM OFFICE LIGHTS
========================================================= */

const lightPositions = [

    [-28, -12],
    [-15, -12],
    [-3, -12],

    [-28, 2],
    [-15, 2],

    [5, -12],
    [5, 2],

    [25, -12],

    [-25, 25],
    [5, 25],
    [28, 22]

];


for (
    const [x, z]
    of lightPositions
) {

    const light =
        new THREE.PointLight(
            0x666666,
            .8,
            12
        );

    light.position.set(
        x,
        4.2,
        z
    );

    scene.add(light);

}


/* =========================================================
   FLASHLIGHT
========================================================= */

const flashlight =
    new THREE.SpotLight(
        0xffffff,
        6,
        30,
        Math.PI / 7,
        .55,
        1.5
    );

flashlight.castShadow = true;

scene.add(
    flashlight
);

scene.add(
    flashlight.target
);


/* =========================================================
   COLLISION
========================================================= */

function collides(
    x,
    z
) {

    const r =
        player.radius;

    for (
        const c of colliders
    ) {

        const minX =
            c.x - c.sx / 2 - r;

        const maxX =
            c.x + c.sx / 2 + r;

        const minZ =
            c.z - c.sz / 2 - r;

        const maxZ =
            c.z + c.sz / 2 + r;

        if (
            x > minX &&
            x < maxX &&
            z > minZ &&
            z < maxZ
        ) {

            return true;

        }

    }

    return false;
}


/* =========================================================
   MOVEMENT
========================================================= */

function updateMovement(
    dt
) {

    let moveX = 0;
    let moveZ = 0;

    if (keys["KeyW"])
        moveZ += 1;

    if (keys["KeyS"])
        moveZ -= 1;

    if (keys["KeyA"])
        moveX -= 1;

    if (keys["KeyD"])
        moveX += 1;


    if (
        moveX === 0 &&
        moveZ === 0
    ) return;


    const length =
        Math.hypot(
            moveX,
            moveZ
        );

    moveX /= length;
    moveZ /= length;


    /*
       Correct FPS movement.
    */

    const forwardX =
        -Math.sin(yaw);

    const forwardZ =
        -Math.cos(yaw);

    const rightX =
        Math.cos(yaw);

    const rightZ =
        -Math.sin(yaw);


    const worldX =
        forwardX * moveZ +
        rightX * moveX;

    const worldZ =
        forwardZ * moveZ +
        rightZ * moveX;


    const speed =
        player.speed * dt;


    const newX =
        player.position.x +
        worldX * speed;

    const newZ =
        player.position.z +
        worldZ * speed;


    if (
        !collides(
            newX,
            player.position.z
        )
    ) {

        player.position.x =
            newX;

    }


    if (
        !collides(
            player.position.x,
            newZ
        )
    ) {

        player.position.z =
            newZ;

    }

}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera() {

    camera.position.copy(
        player.position
    );

    camera.rotation.order =
        "YXZ";

    camera.rotation.y =
        yaw;

    camera.rotation.x =
        pitch;


    const forward =
        new THREE.Vector3(
            0,
            0,
            -1
        );

    forward.applyQuaternion(
        camera.quaternion
    );

    flashlight.position.copy(
        camera.position
    );

    flashlight.target.position.copy(
        camera.position
    ).add(
        forward.multiplyScalar(10)
    );

}


/* =========================================================
   INTERACTION
========================================================= */

function interact() {

    const distance =
        player.position.distanceTo(
            key.position
        );


    if (
        !hasKey &&
        distance < 3
    ) {

        if (!drawerOpened) {

            drawerOpened = true;

            drawers[2].position.z =
                -1.25;

            showMessage(
                "The drawer slides open."
            );

        } else {

            hasKey = true;

            key.visible = false;

            objectiveText.textContent =
                "Find the maze.";

            showMessage(
                "You found a key."
            );

        }

        return;
    }


    if (
        hasKey &&
        !inMaze
    ) {

        const d =
            player.position.distanceTo(
                new THREE.Vector3(
                    25,
                    1.7,
                    25
                )
            );

        if (d < 4) {

            enterMaze();

        }

    }


    if (
        inMaze &&
        hasKey
    ) {

        const d =
            player.position.distanceTo(
                new THREE.Vector3(
                    25,
                    1.7,
                    25
                )
            );

        if (d < 4) {

            escapedMaze = true;

            showMessage(
                "You found the exit."
            );

        }

    }

}


/* =========================================================
   MAZE TRANSITION
========================================================= */

function enterMaze() {

    inMaze = true;

    player.position.set(
        mazeOriginX +
        cell,
        1.7,
        mazeOriginZ +
        cell
    );

    objectiveText.textContent =
        "Find the way out.";

    scene.fog.density =
        0.075;

    ambient.intensity =
        .08;

    showMessage(
        "The door closes behind you."
    );

}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(
    text
) {

    messageText.textContent =
        text;

    messageTimer = 3;

}


/* =========================================================
   TIMER
========================================================= */

function updateTimer(
    dt
) {

    loopTime -= dt;

    if (
        loopTime <= 0
    ) {

        resetLoop();

        return;

    }

    timerText.textContent =
        loopTime.toFixed(1);

}


/* =========================================================
   LOOP RESET
========================================================= */

function resetLoop() {

    loopTime = 60;

    hasKey = false;
    drawerOpened = false;
    inMaze = false;
    escapedMaze = false;

    key.visible = true;

    drawers[2].position.z =
        -.82;

    player.position.set(
        0,
        1.7,
        8
    );

    yaw = 0;
    pitch = 0;

    objectiveText.textContent =
        "Find the key.";

    scene.fog.density =
        .035;

    ambient.intensity =
        .18;

    showMessage(
        "Something feels familiar."
    );

}


/* =========================================================
   HORROR ATMOSPHERE
========================================================= */

let flickerTimer = 0;

function updateAtmosphere(
    dt
) {

    flickerTimer -= dt;

    if (
        flickerTimer <= 0
    ) {

        flickerTimer =
            THREE.MathUtils.randFloat(
                4,
                10
            );

        const lights =
            scene.children.filter(
                object =>
                    object.isPointLight &&
                    object !== officeLight
            );

        if (
            lights.length
        ) {

            const light =
                lights[
                    Math.floor(
                        Math.random() *
                        lights.length
                    )
                ];

            const original =
                light.intensity;

            light.intensity =
                0;

            setTimeout(
                () => {

                    light.intensity =
                        original;

                },
                80 +
                Math.random() *
                250
            );

        }

    }

}


/* =========================================================
   AUDIO
========================================================= */

let audioContext = null;

let footstepTimer = 0;


function startAudio() {

    if (
        audioContext
    ) return;

    audioContext =
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();

}


function footstep() {

    if (!audioContext)
        return;

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.type =
        "triangle";

    oscillator.frequency.value =
        65 +
        Math.random() * 15;

    gain.gain.setValueAtTime(
        .0001,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .035,
        audioContext.currentTime + .01
    );

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        audioContext.currentTime + .12
    );

    oscillator.connect(gain);
    gain.connect(
        audioContext.destination
    );

    oscillator.start();

    oscillator.stop(
        audioContext.currentTime +
        .13
    );

}


/* =========================================================
   GAME UPDATE
========================================================= */

function update(
    dt
) {

    if (!gameRunning)
        return;


    updateMovement(dt);

    updateCamera();

    updateTimer(dt);

    updateAtmosphere(dt);


    if (
        messageTimer > 0
    ) {

        messageTimer -= dt;

        if (
            messageTimer <= 0
        ) {

            messageText.textContent =
                "";

        }

    }


    const moving =
        keys["KeyW"] ||
        keys["KeyA"] ||
        keys["KeyS"] ||
        keys["KeyD"];


    if (
        moving
    ) {

        footstepTimer -= dt;

        if (
            footstepTimer <= 0
        ) {

            footstep();

            footstepTimer =
                .42;

        }

    }

}


/* =========================================================
   GAME LOOP
========================================================= */

let lastTime =
    performance.now();


function animate(
    time
) {

    requestAnimationFrame(
        animate
    );

    const dt =
        Math.min(
            (time - lastTime) /
            1000,
            .05
        );

    lastTime =
        time;

    update(dt);

    renderer.render(
        scene,
        camera
    );

}


/* =========================================================
   START GAME
========================================================= */

function startGame() {

    if (gameStarted)
        return;

    gameStarted = true;
    gameRunning = true;

    menu.style.display =
        "none";

    startAudio();

    renderer.domElement.requestPointerLock();

    resetLoop();

}


playButton.addEventListener(
    "click",
    startGame
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


/* =========================================================
   INITIAL STATE
========================================================= */

updateCamera();

animate(
    performance.now()
);

</script>

</body>
</html>
