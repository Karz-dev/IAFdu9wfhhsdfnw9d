<style>

    * {

    html,

    #ui {
        position: fixed;

        pointer-events: none;
    }

    #timer {
        position: absolute;
        top: 18px;

        font-size: 22px;

    }

    #loop {
        position: absolute;
        top: 48px;

    #crosshair {
        position: absolute;

<canvas id="game"></canvas>

    </div>

</div>


<script type="module">

    import * as THREE from
        "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


    /* =========================================================
       RENDERER
    ========================================================= */

    const canvas =
        document.getElementById("game");


    const renderer =
        new THREE.WebGLRenderer({
            canvas: canvas,
            antialias: true
        });


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );


    renderer.shadowMap.enabled =
        true;


    renderer.shadowMap.type =
        THREE.PCFSoftShadowMap;


    /* =========================================================
       SCENE
    ========================================================= */

    const scene =
        new THREE.Scene();


    scene.background =
        new THREE.Color(
            0x020305
        );


    const camera =
        new THREE.PerspectiveCamera(
            75,
            window.innerWidth /
            window.innerHeight,
            0.05,
            100
        );


    camera.rotation.order =
        "YXZ";


    scene.add(
        camera
    );


    /* =========================================================
       STATE
    ========================================================= */

    let running =
        false;

    let won =
        false;

    let timeRemaining =
        60;

    let loopNumber =
        1;

    let lastTime =
        0;

    let pointerLocked =
        false;


    let keyCollected =
        false;

    let flashlightCollected =
        false;

    let flashlightOn =
        false;


    /* =========================================================
       PLAYER
    ========================================================= */

    const player = {

        position:
            new THREE.Vector3(
                0,
                1.65,
                5.2
            ),

        height: 1.65,

        radius: 0.28,

        speed: 3.0,

        yaw: 0,

        pitch: 0

    };


    /* =========================================================
       INPUT
    ========================================================= */

    const keys = {

        w: false,
        a: false,
        s: false,
        d: false

    };


    window.addEventListener(
        "keydown",
        event => {

            if (event.code === "KeyW") {
                keys.w = true;
                event.preventDefault();
            }

            if (event.code === "KeyA") {
                keys.a = true;
                event.preventDefault();
            }

            if (event.code === "KeyS") {
                keys.s = true;
                event.preventDefault();
            }

            if (event.code === "KeyD") {
                keys.d = true;
                event.preventDefault();
            }


            if (
                event.code === "KeyE" &&
                !event.repeat
            ) {

                interact();

            }


            if (
                event.code === "KeyF" &&
                !event.repeat
            ) {

                toggleFlashlight();

            }

        }
    );


    window.addEventListener(
        "keyup",
        event => {

            if (event.code === "KeyW") {
                keys.w = false;
            }

            if (event.code === "KeyA") {
                keys.a = false;
            }

            if (event.code === "KeyS") {
                keys.s = false;
            }

            if (event.code === "KeyD") {
                keys.d = false;
            }

        }
    );


    window.addEventListener(
        "blur",
        () => {

            keys.w = false;
            keys.a = false;
            keys.s = false;
            keys.d = false;

        }
    );


    /* =========================================================
       POINTER LOCK
    ========================================================= */

    canvas.addEventListener(
        "click",
        () => {

            if (running) {

                canvas.requestPointerLock();

            }

        }
    );


    document.addEventListener(
        "pointerlockchange",
        () => {

            pointerLocked =
                document.pointerLockElement === canvas;

        }
    );


    document.addEventListener(
        "mousemove",
        event => {

            if (
                !running ||
                !pointerLocked
            ) {

                return;

            }


            player.yaw -=
                event.movementX * 0.0022;


            player.pitch -=
                event.movementY * 0.0022;


            player.pitch =
                Math.max(
                    -1.45,
                    Math.min(
                        1.45,
                        player.pitch
                    )
                );

        }
    );


    /* =========================================================
       AUDIO
    ========================================================= */

    let audioContext =
        null;

    let masterGain =
        null;

    let ambientGain =
        null;

    let audioReady =
        false;

    let nextStep =
        0;

    let nextAmbient =
        5;


    function startAudio() {

        if (audioReady) {

            if (
                audioContext.state ===
                "suspended"
            ) {

                audioContext.resume();

            }

            return;

        }


        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();


        masterGain =
            audioContext.createGain();


        masterGain.gain.value =
            0.55;


        masterGain.connect(
            audioContext.destination
        );


        ambientGain =
            audioContext.createGain();


        ambientGain.gain.value =
            0.035;


        ambientGain.connect(
            masterGain
        );


        const hum =
            audioContext.createOscillator();


        const humGain =
            audioContext.createGain();


        hum.type =
            "sine";


        hum.frequency.value =
            47;


        humGain.gain.value =
            0.08;


        hum.connect(
            humGain
        );


        humGain.connect(
            ambientGain
        );


        hum.start();


        audioReady =
            true;

    }


    function shortTone(
        frequency,
        duration,
        volume,
        type = "sine"
    ) {

        if (!audioReady) {
            return;
        }


        const now =
            audioContext.currentTime;


        const oscillator =
            audioContext.createOscillator();


        const gain =
            audioContext.createGain();


        oscillator.type =
            type;


        oscillator.frequency.value =
            frequency;


        gain.gain.setValueAtTime(
            0.0001,
            now
        );


        gain.gain.exponentialRampToValueAtTime(
            volume,
            now + 0.01
        );


        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            now + duration
        );


        oscillator.connect(
            gain
        );


        gain.connect(
            masterGain
        );


        oscillator.start(
            now
        );


        oscillator.stop(
            now + duration + 0.02
        );

    }


    function footstep() {

        shortTone(
            72 + Math.random() * 30,
            0.11,
            0.07,
            "triangle"
        );

    }


    function drawerSound() {

        shortTone(
            95,
            0.3,
            0.1,
            "sawtooth"
        );

    }


    function keySound() {

        shortTone(
            650,
            0.18,
            0.08
        );

        setTimeout(
            () => {

                shortTone(
                    900,
                    0.22,
                    0.07
                );

            },
            100
        );

    }


    function doorSound() {

        shortTone(
            55,
            0.7,
            0.12,
            "sawtooth"
        );

    }


    function strangeAmbient() {

        shortTone(
            130,
            2.2,
            0.035
        );

    }


    /* =========================================================
       FLASHLIGHT
    ========================================================= */

    const flashlight =
        new THREE.SpotLight(
            0xffffff,
            0,
            18,
            Math.PI / 7,
            0.55,
            1.5
        );


    flashlight.castShadow =
        true;


    flashlight.shadow.mapSize.width =
        512;

    flashlight.shadow.mapSize.height =
        512;


    camera.add(
        flashlight
    );


    const flashlightTarget =
        new THREE.Object3D();


    scene.add(
        flashlightTarget
    );


    flashlight.target =
        flashlightTarget;


    function updateFlashlight() {

        if (
            !flashlightOn
        ) {

            flashlight.intensity =
                0;

            return;

        }


        flashlight.intensity =
            8;


        const direction =
            new THREE.Vector3(
                0,
                0,
                -1
            );


        direction.applyQuaternion(
            camera.quaternion
        );


        flashlightTarget.position.copy(
            camera.position
        );


        flashlightTarget.position.add(
            direction.multiplyScalar(10)
        );

    }


    function toggleFlashlight() {

        if (
            !flashlightCollected
        ) {

            return;

        }


        flashlightOn =
            !flashlightOn;


        document.getElementById(
            "flashlight"
        ).textContent =
            flashlightOn
                ? "Flashlight: ON"
                : "Flashlight: OFF";


        shortTone(
            flashlightOn
                ? 500
                : 250,
            0.06,
            0.04
        );

    }


    /* =========================================================
       MATERIALS
    ========================================================= */

    const wallMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x1b1e23,
            roughness: 0.95
        });


    const floorMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x0d0f12,
            roughness: 1
        });


    const ceilingMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x07080a,
            roughness: 1
        });


    const woodMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x25201c,
            roughness: 0.9
        });


    const metalMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x30343a,
            roughness: 0.8,
            metalness: 0.25
        });


    /* =========================================================
       COLLISION
    ========================================================= */

    const collisionBoxes = [];


    function addBox(
        x,
        y,
        z,
        width,
        height,
        depth,
        material,
        collision = true
    ) {

        const mesh =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    width,
                    height,
                    depth
                ),
                material
            );


        mesh.position.set(
            x,
            y,
            z
        );


        mesh.castShadow =
            true;


        mesh.receiveShadow =
            true;


        scene.add(
            mesh
        );


        if (collision) {

            collisionBoxes.push({

                x: x,
                z: z,

                halfWidth:
                    width / 2,

                halfDepth:
                    depth / 2

            });

        }


        return mesh;

    }


    function addFloor(
        x,
        z,
        width,
        depth
    ) {

        addBox(
            x,
            0,
            z,
            width,
            0.2,
            depth,
            floorMaterial,
            false
        );

    }


    function collidesAt(
        x,
        z
    ) {

        for (
            const box of collisionBoxes
        ) {

            const closestX =
                Math.max(
                    box.x -
                    box.halfWidth,

                    Math.min(
                        x,
                        box.x +
                        box.halfWidth
                    )
                );


            const closestZ =
                Math.max(
                    box.z -
                    box.halfDepth,

                    Math.min(
                        z,
                        box.z +
                        box.halfDepth
                    )
                );


            const dx =
                x -
                closestX;


            const dz =
                z -
                closestZ;


            if (
                dx * dx +
                dz * dz <
                player.radius *
                player.radius
            ) {

                return true;

            }

        }


        return false;

    }


    /* =========================================================
       OFFICE
    ========================================================= */

    const officeWidth =
        12;

    const officeDepth =
        15;


    function buildOffice() {

        addFloor(
            0,
            0,
            officeWidth,
            officeDepth
        );


        addBox(
            0,
            3.4,
            0,
            officeWidth,
            0.2,
            officeDepth,
            ceilingMaterial,
            false
        );


        addBox(
            0,
            1.7,
            -7.4,
            officeWidth,
            3.4,
            0.25,
            wallMaterial
        );


        addBox(
            -5.9,
            1.7,
            0,
            0.25,
            3.4,
            officeDepth,
            wallMaterial
        );


        addBox(
            5.9,
            1.7,
            0,
            0.25,
            3.4,
            officeDepth,
            wallMaterial
        );


        /* Front wall with opening */

        addBox(
            -4,
            1.7,
            7.4,
            3.8,
            3.4,
            0.25,
            wallMaterial
        );


        addBox(
            4,
            1.7,
            7.4,
            3.8,
            3.4,
            0.25,
            wallMaterial
        );


        addBox(
            0,
            3,
            7.4,
            4.2,
            0.8,
            0.25,
            wallMaterial
        );


        /* Desk */

        addBox(
            -2.8,
            1,
            -1.8,
            3.8,
            0.2,
            1.4,
            woodMaterial
        );


        addBox(
            -4.35,
            0.5,
            -1.8,
            0.2,
            1,
            1.2,
            woodMaterial
        );


        addBox(
            -1.25,
            0.5,
            -1.8,
            0.2,
            1,
            1.2,
            woodMaterial
        );


        /* Monitor */

        addBox(
            -2.8,
            1.65,
            -1.9,
            1.5,
            0.85,
            0.1,
            metalMaterial,
            false
        );


        addBox(
            -2.8,
            1.2,
            -1.9,
            0.1,
            0.35,
            0.1,
            metalMaterial,
            false
        );


        /* Chair */

        addBox(
            -2.8,
            0.7,
            0.1,
            1.1,
            0.18,
            1.1,
            woodMaterial,
            false
        );


        addBox(
            -2.8,
            1.3,
            0.55,
            0.9,
            1.1,
            0.15,
            woodMaterial,
            false
        );


        /* Shelves */

        createShelf(
            3.9,
            -4.7
        );


        createShelf(
            3.9,
            -1.0
        );


        /* Cabinets */

        createCabinet(
            -4.1,
            3.8
        );


        createCabinet(
            3.9,
            2.5
        );


        /* MAZE SIGN */

        const sign =
            makeText(
                "MAZE",
                0.8,
                "#777777"
            );


        sign.position.set(
            0,
            2.45,
            7.05
        );


        scene.add(
            sign
        );

    }


    /* =========================================================
       SHELVES
    ========================================================= */

    const shelves = [];


    function createShelf(
        x,
        z
    ) {

        addBox(
            x,
            1.4,
            z,
            1.5,
            2.8,
            0.45,
            woodMaterial
        );


        for (
            let row = 0;
            row < 4;
            row++
        ) {

            addBox(
                x,
                0.55 +
                row * 0.6,
                z - 0.25,
                1.35,
                0.08,
                0.5,
                woodMaterial,
                false
            );

        }


        shelves.push({

            x: x,
            z: z,
            searched: false

        });


        for (
            let row = 0;
            row < 4;
            row++
        ) {

            for (
                let i = 0;
                i < 5;
                i++
            ) {

                addBox(
                    x -
                    0.5 +
                    i * 0.25,

                    0.72 +
                    row * 0.6,

                    z - 0.29,

                    0.14,

                    0.38 +
                    Math.random() *
                    0.12,

                    0.12,

                    new THREE.MeshStandardMaterial({
                        color:
                            0x292b2e
                    }),

                    false
                );

            }

        }

    }


    /* =========================================================
       DRAWERS
    ========================================================= */

    const drawers = [];


    function createCabinet(
        x,
        z
    ) {

        addBox(
            x,
            1.2,
            z,
            1.3,
            2.4,
            0.7,
            metalMaterial
        );


        for (
            let i = 0;
            i < 4;
            i++
        ) {

            const drawer =
                createDrawer(
                    x,
                    z,
                    0.45 +
                    i * 0.53
                );


            drawers.push(
                drawer
            );

        }

    }


    function createDrawer(
        x,
        z,
        y
    ) {

        const group =
            new THREE.Group();


        group.position.set(
            x,
            y,
            z
        );


        const body =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    1.1,
                    0.38,
                    0.62
                ),
                metalMaterial
            );


        body.castShadow =
            true;


        group.add(
            body
        );


        const handle =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    0.32,
                    0.05,
                    0.07
                ),
                metalMaterial
            );


        handle.position.z =
            -0.35;


        group.add(
            handle
        );


        scene.add(
            group
        );


        return {

            group: group,

            baseZ: z,

            open: false,

            containsKey: false,

            containsFlashlight: false

        };

    }


    /* =========================================================
       IMPORTANT DRAWERS
    ========================================================= */

    let keyDrawer =
        null;

    let flashlightDrawer =
        null;


    /* =========================================================
       KEY
    ========================================================= */

    const key =
        new THREE.Group();


    const keyRing =
        new THREE.Mesh(
            new THREE.TorusGeometry(
                0.11,
                0.025,
                8,
                16
            ),
            new THREE.MeshStandardMaterial({
                color: 0xd4ae4d,
                metalness: 0.8,
                roughness: 0.25
            })
        );


    key.add(
        keyRing
    );


    const keyStem =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                0.25,
                0.035,
                0.035
            ),
            new THREE.MeshStandardMaterial({
                color: 0xd4ae4d,
                metalness: 0.8,
                roughness: 0.25
            })
        );


    keyStem.position.x =
        0.14;


    keyStem.rotation.z =
        Math.PI / 2;


    key.add(
        keyStem
    );


    key.visible =
        false;


    scene.add(
        key
    );


    /* =========================================================
       FLASHLIGHT ITEM
    ========================================================= */

    const flashlightItem =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                0.065,
                0.065,
                0.38,
                12
            ),
            new THREE.MeshStandardMaterial({
                color: 0x111315,
                metalness: 0.6,
                roughness: 0.35
            })
        );


    flashlightItem.rotation.z =
        Math.PI / 2;


    flashlightItem.visible =
        false;


    scene.add(
        flashlightItem
    );


    /* =========================================================
       MAZE
    ========================================================= */

    const maze = [

        "#######.#######",
        "#S............#",
        "#.#####.#####.#",
        "#.#...#.#.....#",
        "#.#.#.#.#.###.#",
        "#...#...#...#.#",
        "###.#####.#.#.#",
        "#...#.....#...#",
        "#.###.#########",
        "#.....#.......#",
        "#.#####.#####.#",
        "#.......#...K.#",
        "#######.#######"

    ];


    const mazeCell =
        1;


    const mazeRows =
        maze.length;


    const mazeColumns =
        maze[0].length;


    const mazeOriginX =
        -mazeColumns / 2 +
        0.5;


    const mazeStartZ =
        8.1;


    const mazeOriginZ =
        mazeStartZ +
        0.5;


    const mazeCells = [];


    function buildMaze() {

        for (
            let row = 0;
            row < mazeRows;
            row++
        ) {

            for (
                let col = 0;
                col < mazeColumns;
                col++
            ) {

                const cell =
                    maze[row][col];


                const x =
                    mazeOriginX +
                    col;


                const z =
                    mazeOriginZ +
                    row;


                if (
                    cell === "#"
                ) {

                    addBox(
                        x,
                        1.5,
                        z,
                        1,
                        3,
                        1,
                        wallMaterial
                    );


                    mazeCells.push({
                        x,
                        z
                    });

                }

            }

        }


        addFloor(
            0,
            mazeOriginZ +
            mazeRows / 2 -
            0.5,
            mazeColumns,
            mazeRows
        );

    }


    /* =========================================================
       MAZE KEY
    ========================================================= */

    const mazeKey =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                0.13,
                12,
                12
            ),
            new THREE.MeshStandardMaterial({
                color: 0x8ea9d8,
                emissive: 0x253d70,
                emissiveIntensity: 2
            })
        );


    mazeKey.visible =
        false;


    scene.add(
        mazeKey
    );


    const mazeKeyRow =
        11;


    const mazeKeyColumn =
        12;


    mazeKey.position.set(

        mazeOriginX +
        mazeKeyColumn,

        0.3,

        mazeOriginZ +
        mazeKeyRow

    );


    /* =========================================================
       EXIT
    ========================================================= */

    const exitZ =
        mazeOriginZ +
        mazeRows -
        1;


    const exitGroup =
        new THREE.Group();


    const exitLeft =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                0.12,
                2.5,
                0.12
            ),
            metalMaterial
        );


    exitLeft.position.set(
        -1.05,
        1.25,
        0
    );


    const exitRight =
        exitLeft.clone();


    exitRight.position.x =
        1.05;


    const exitTop =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                2.2,
                0.12,
                0.12
            ),
            metalMaterial
        );


    exitTop.position.y =
        2.5;


    exitGroup.add(
        exitLeft
    );

    exitGroup.add(
        exitRight
    );

    exitGroup.add(
        exitTop
    );


    exitGroup.position.set(
        0,
        0,
        exitZ + 0.25
    );


    scene.add(
        exitGroup
    );


    const exitText =
        makeText(
            "EXIT",
            0.7,
            "#772222"
        );


    exitText.position.set(
        0,
        2.8,
        exitZ + 0.1
    );


    scene.add(
        exitText
    );


    /* =========================================================
       HIDDEN MAZE EVENT
    ========================================================= */

    const watcher =
        new THREE.Group();


    const watcherBody =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                0.22,
                0.3,
                1.75,
                8
            ),
            new THREE.MeshStandardMaterial({
                color: 0x030303,
                roughness: 1
            })
        );


    watcherBody.position.y =
        1.0;


    watcher.add(
        watcherBody
    );


    const watcherHead =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                0.22,
                12,
                12
            ),
            new THREE.MeshStandardMaterial({
                color: 0x020202,
                roughness: 1
            })
        );


    watcherHead.position.y =
        2.0;


    watcher.add(
        watcherHead
    );


    /*
        The object starts completely hidden.
        Its behaviour is handled separately.
    */

    watcher.visible =
        false;


    scene.add(
        watcher
    );


    const watcherSpots = [

        {
            x: -1.5,
            z: 11.1
        },

        {
            x: 2.5,
            z: 13.1
        },

        {
            x: -2.5,
            z: 16.1
        },

        {
            x: 3.5,
            z: 18.1
        },

        {
            x: -3.5,
            z: 20.1
        }

    ];


    let watcherActive =
        false;

    let watcherTimer =
        0;

    let watcherIndex =
        -1;


    function updateWatcher(
        dt
    ) {

        if (
            !keyCollected ||
            player.position.z <
            mazeStartZ
        ) {

            watcher.visible =
                false;

            watcherActive =
                false;

            return;

        }


        watcherTimer -=
            dt;


        if (
            watcherTimer <= 0 &&
            !watcherActive
        ) {

            watcherTimer =
                6 +
                Math.random() * 10;


            if (
                Math.random() <
                0.45
            ) {

                watcherIndex =
                    Math.floor(
                        Math.random() *
                        watcherSpots.length
                    );


                const spot =
                    watcherSpots[
                        watcherIndex
                    ];


                watcher.position.set(
                    spot.x,
                    0,
                    spot.z
                );


                watcher.lookAt(
                    player.position.x,
                    1.2,
                    player.position.z
                );


                watcher.visible =
                    true;


                watcherActive =
                    true;


                setTimeout(
                    () => {

                        watcher.visible =
                            false;

                        watcherActive =
                            false;

                    },
                    900 +
                    Math.random() * 1000
                );

            }

        }

    }


    /* =========================================================
       TEXT
    ========================================================= */

    function makeText(
        text,
        size,
        color
    ) {

        const canvas =
            document.createElement(
                "canvas"
            );


        canvas.width =
            512;

        canvas.height =
            128;


        const ctx =
            canvas.getContext(
                "2d"
            );


        ctx.clearRect(
            0,
            0,
            512,
            128
        );


        ctx.font =
            "bold 64px Arial";


        ctx.textAlign =
            "center";


        ctx.textBaseline =
            "middle";


        ctx.fillStyle =
            color;


        ctx.fillText(
            text,
            256,
            64
        );


        const texture =
            new THREE.CanvasTexture(
                canvas
            );


        const material =
            new THREE.SpriteMaterial({
                map: texture,
                transparent: true
            });


        const sprite =
            new THREE.Sprite(
                material
            );


        sprite.scale.set(
            size * 3,
            size * 0.75,
            1
        );


        return sprite;

    }


    /* =========================================================
       DRAWER SETUP
    ========================================================= */

    function setupImportantDrawers() {

        /*
            Cabinet 1 contains four drawers.
            Cabinet 2 contains four drawers.

            These are fixed rather than random,
            so the items can never fail to spawn.
        */

        keyDrawer =
            drawers[1];


        flashlightDrawer =
            drawers[6];


        keyDrawer.containsKey =
            true;


        flashlightDrawer.containsFlashlight =
            true;

    }


    /* =========================================================
       DRAWER UPDATE
    ========================================================= */

    function updateDrawers(
        dt
    ) {

        for (
            const drawer of drawers
        ) {

            const target =
                drawer.open
                    ? drawer.baseZ - 0.48
                    : drawer.baseZ;


            drawer.group.position.z =
                THREE.MathUtils.lerp(
                    drawer.group.position.z,
                    target,
                    Math.min(
                        1,
                        dt * 12
                    )
                );

        }


        if (
            keyDrawer &&
            keyDrawer.open &&
            !keyCollected
        ) {

            key.visible =
                true;


            key.position.set(
                keyDrawer.group.position.x,
                keyDrawer.group.position.y + 0.23,
                keyDrawer.group.position.z - 0.08
            );


            key.rotation.y +=
                dt * 1.5;

        }
        else {

            key.visible =
                false;

        }


        if (
            flashlightDrawer &&
            flashlightDrawer.open &&
            !flashlightCollected
        ) {

            flashlightItem.visible =
                true;


            flashlightItem.position.set(
                flashlightDrawer.group.position.x,
                flashlightDrawer.group.position.y + 0.23,
                flashlightDrawer.group.position.z - 0.08
            );

        }
        else {

            flashlightItem.visible =
                false;

        }

    }


    /* =========================================================
       DISTANCE
    ========================================================= */

    function distance2D(
        x1,
        z1,
        x2,
        z2
    ) {

        return Math.hypot(
            x1 - x2,
            z1 - z2
        );

    }


    /* =========================================================
       NEARBY DRAWER
    ========================================================= */

    function nearbyDrawer() {

        let result =
            null;

        let best =
            1.4;


        for (
            const drawer of drawers
        ) {

            const distance =
                distance2D(
                    player.position.x,
                    player.position.z,
                    drawer.group.position.x,
                    drawer.group.position.z
                );


            if (
                distance < best
            ) {

                best =
                    distance;

                result =
                    drawer;

            }

        }


        return result;

    }


    /* =========================================================
       INTERACTION
    ========================================================= */

    function interact() {

        if (!running) {
            return;
        }


        /* Office key */

        if (
            key.visible &&
            player.position.distanceTo(
                key.position
            ) < 1.15
        ) {

            keyCollected =
                true;


            key.visible =
                false;


            keyDrawer.containsKey =
                false;


            keySound();


            document.getElementById(
                "objective"
            ).textContent =
                "FIND THE EXIT";


            showMessage(
                "You found a key."
            );


            return;

        }


        /* Flashlight */

        if (
            flashlightItem.visible &&
            player.position.distanceTo(
                flashlightItem.position
            ) < 1.15
        ) {

            flashlightCollected =
                true;


            flashlightItem.visible =
                false;


            flashlightDrawer.containsFlashlight =
                false;


            document.getElementById(
                "flashlight"
            ).textContent =
                "Flashlight: OFF";


            keySound();


            showMessage(
                "You found a flashlight."
            );


            return;

        }


        /* Drawers */

        const drawer =
            nearbyDrawer();


        if (drawer) {

            drawer.open =
                !drawer.open;


            drawerSound();


            return;

        }


        /* Maze key */

        if (
            mazeKey.visible &&
            player.position.distanceTo(
                mazeKey.position
            ) < 1
        ) {

            mazeKey.visible =
                false;


            keyCollected =
                true;


            keySound();


            document.getElementById(
                "objective"
            ).textContent =
                "FIND THE EXIT";


            showMessage(
                "You found the key."
            );


            return;

        }


        /* Exit */

        if (
            distance2D(
                player.position.x,
                player.position.z,
                0,
                exitZ
            ) < 1.7
        ) {

            if (!keyCollected) {

                showMessage(
                    "Locked."
                );


                shortTone(
                    180,
                    0.08,
                    0.04
                );


                return;

            }


            doorSound();

            winGame();

        }

    }


    /* =========================================================
       MOVEMENT
    ========================================================= */

    function updateMovement(
        dt
    ) {

        let x =
            0;

        let z =
            0;


        if (keys.w) {
            z -= 1;
        }

        if (keys.s) {
            z += 1;
        }

        if (keys.a) {
            x -= 1;
        }

        if (keys.d) {
            x += 1;
        }


        if (
            x === 0 &&
            z === 0
        ) {

            return false;

        }


        const length =
            Math.hypot(
                x,
                z
            );


        x /= length;

        z /= length;


        const sin =
            Math.sin(
                player.yaw
            );


        const cos =
            Math.cos(
                player.yaw
            );


        const worldX =
            x * cos -
            z * sin;


        const worldZ =
            x * sin +
            z * cos;


        const amount =
            player.speed *
            dt;


        const newX =
            player.position.x +
            worldX * amount;


        const newZ =
            player.position.z +
            worldZ * amount;


        if (
            !collidesAt(
                newX,
                player.position.z
            )
        ) {

            player.position.x =
                newX;

        }


        if (
            !collidesAt(
                player.position.x,
                newZ
            )
        ) {

            player.position.z =
                newZ;

        }


        const now =
            performance.now();


        if (
            audioReady &&
            now >
            nextStep
        ) {

            footstep();


            nextStep =
                now +
                430;

        }


        return true;

    }


    /* =========================================================
       PROMPT
    ========================================================= */

    function updatePrompt() {

        const prompt =
            document.getElementById(
                "prompt"
            );


        if (!running) {

            prompt.style.opacity =
                "0";

            return;

        }


        let text =
            "";


        if (
            key.visible &&
            player.position.distanceTo(
                key.position
            ) < 1.15
        ) {

            text =
                "[E] Pick up key";

        }
        else if (
            flashlightItem.visible &&
            player.position.distanceTo(
                flashlightItem.position
            ) < 1.15
        ) {

            text =
                "[E] Pick up flashlight";

        }
        else {

            const drawer =
                nearbyDrawer();


            if (drawer) {

                text =
                    drawer.open
                        ? "[E] Close drawer"
                        : "[E] Open drawer";

            }

        }


        if (
            distance2D(
                player.position.x,
                player.position.z,
                0,
                exitZ
            ) < 1.7
        ) {

            text =
                keyCollected
                    ? "[E] Open exit"
                    : "[E] Locked";

        }


        prompt.textContent =
            text;


        prompt.style.opacity =
            text
                ? "1"
                : "0";

    }


    /* =========================================================
       MESSAGE
    ========================================================= */

    let messageTimer =
        null;


    function showMessage(
        text
    ) {

        const message =
            document.getElementById(
                "message"
            );


        message.textContent =
            text;


        message.style.opacity =
            "1";


        clearTimeout(
            messageTimer
        );


        messageTimer =
            setTimeout(
                () => {

                    message.style.opacity =
                        "0";

                },
                2200
            );

    }


    /* =========================================================
       LOOP RESET
    ========================================================= */

    function resetLoop() {

        player.position.set(
            0,
            1.65,
            5.2
        );


        player.yaw =
            0;


        player.pitch =
            0;


        timeRemaining =
            60;


        for (
            const drawer of drawers
        ) {

            drawer.open =
                false;

        }


        key.visible =
            false;


        flashlightItem.visible =
            false;


        mazeKey.visible =
            false;


        watcher.visible =
            false;


        watcherActive =
            false;


        flashlightOn =
            false;


        document.getElementById(
            "flashlight"
        ).textContent =
            flashlightCollected
                ? "Flashlight: OFF"
                : "Flashlight: NOT FOUND";


        document.getElementById(
            "objective"
        ).textContent =
            keyCollected
                ? "FIND THE EXIT"
                : "FIND THE KEY";

    }


    /* =========================================================
       UPDATE
    ========================================================= */

    function update(
        dt
    ) {

        timeRemaining -=
            dt;


        if (
            timeRemaining <= 0
        ) {

            timeRemaining =
                0;


            gameOver();


            return;

        }


        updateMovement(
            dt
        );


        updateDrawers(
            dt
        );


        /*
            The second key becomes available
            once the player reaches the maze.
        */

        if (
            keyCollected &&
            player.position.z >
            mazeStartZ + 1
        ) {

            mazeKey.visible =
                true;

        }


        updateWatcher(
            dt
        );


        updateFlashlight();

        updatePrompt();


        if (
            audioReady
        ) {

            nextAmbient -=
                dt;


            if (
                nextAmbient <= 0
            ) {

                nextAmbient =
                    8 +
                    Math.random() * 12;


                if (
                    Math.random() <
                    0.35
                ) {

                    strangeAmbient();

                }

            }

        }


        camera.position.copy(
            player.position
        );


        camera.rotation.x =
            player.pitch;


        camera.rotation.y =
            player.yaw;


        document.getElementById(
            "timer"
        ).textContent =
            timeRemaining.toFixed(
                1
            );


        document.getElementById(
            "loop"
        ).textContent =
            "LOOP " +
            loopNumber;

    }


    /* =========================================================
       GAME OVER
    ========================================================= */

    function gameOver() {

        running =
            false;


        document.exitPointerLock();


        document.getElementById(
            "gameOver"
        ).style.display =
            "flex";

    }


    /* =========================================================
       WIN
    ========================================================= */

    function winGame() {

        if (won) {
            return;
        }


        won =
            true;


        running =
            false;


        document.exitPointerLock();


        document.getElementById(
            "winScreen"
        ).style.display =
            "flex";

    }


    /* =========================================================
       START
    ========================================================= */

    function startGame() {

        /*
            Audio is started directly from the
            button click so browsers allow it.
        */

        startAudio();


        running =
            true;


        won =
            false;


        loopNumber =
            1;


        timeRemaining =
            60;


        keyCollected =
            false;


        flashlightCollected =
            false;


        flashlightOn =
            false;


        keyDrawer.containsKey =
            true;


        flashlightDrawer.containsFlashlight =
            true;


        document.getElementById(
            "startScreen"
        ).style.display =
            "none";


        document.getElementById(
            "gameOver"
        ).style.display =
            "none";


        document.getElementById(
            "winScreen"
        ).style.display =
            "none";


        resetLoop();


        lastTime =
            performance.now();


        canvas.requestPointerLock();

    }


    /* =========================================================
       BUTTONS
    ========================================================= */

    document.getElementById(
        "startButton"
    ).addEventListener(
        "click",
        event => {

            event.stopPropagation();

            startGame();

        }
    );


    document.getElementById(
        "restartButton"
    ).addEventListener(
        "click",
        event => {

            event.stopPropagation();

            startGame();

        }
    );


    document.getElementById(
        "winButton"
    ).addEventListener(
        "click",
        event => {

            event.stopPropagation();

            startGame();

        }
    );


    /* =========================================================
       BUILD
    ========================================================= */

    buildOffice();

    setupImportantDrawers();

    buildMaze();


    /* =========================================================
       LIGHTING
    ========================================================= */

    const ambientLight =
        new THREE.HemisphereLight(
            0x161922,
            0x010102,
            0.13
        );


    scene.add(
        ambientLight
    );


    const weakOfficeLight =
        new THREE.PointLight(
            0x39404c,
            0.22,
            10
        );


    weakOfficeLight.position.set(
        0,
        3,
        0
    );


    weakOfficeLight.castShadow =
        true;


    scene.add(
        weakOfficeLight
    );


    /* =========================================================
       INITIAL CAMERA
    ========================================================= */

    camera.position.copy(
        player.position
    );


    camera.rotation.x =
        player.pitch;


    camera.rotation.y =
        player.yaw;


    /* =========================================================
       RESIZE
    ========================================================= */

    window.addEventListener(
        "resize",
        () => {

            camera.aspect =
                window.innerWidth /
                window.innerHeight;


            camera.updateProjectionMatrix();


            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );

        }
    );


    /* =========================================================
       MAIN LOOP
    ========================================================= */

    function animate(
        time
    ) {

        requestAnimationFrame(
            animate
        );


        if (running) {

            const dt =
                Math.min(
                    (time - lastTime) /
                    1000,
                    0.05
                );


            lastTime =
                time;


            update(
                dt
            );

        }


        renderer.render(
            scene,
            camera
        );

    }


    animate(
        performance.now()
    );

</script>
