<!DOCTYPE html>

<html lang="en">

<head>

```
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>LOOP</title>

<style>

    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;

        background: #080b12;

        font-family:
            Arial,
            Helvetica,
            sans-serif;

        user-select: none;
    }

    canvas {
        display: block;

        width: 100vw;
        height: 100vh;

        cursor: crosshair;
    }

    #hud {
        position: fixed;

        inset: 0;

        pointer-events: none;

        color: white;

        z-index: 10;
    }

    #timer {
        position: absolute;

        top: 18px;
        left: 20px;

        font-size: 26px;
        font-weight: bold;

        text-shadow:
            0 2px 8px black;
    }

    #loopCounter {
        position: absolute;

        top: 52px;
        left: 20px;

        font-size: 14px;

        color: #cbd5e1;

        text-shadow:
            0 2px 5px black;
    }

    #crosshair {
        position: absolute;

        left: 50%;
        top: 50%;

        width: 7px;
        height: 7px;

        margin-left: -3.5px;
        margin-top: -3.5px;

        border-radius: 50%;

        background: white;

        box-shadow:
            0 0 8px black;
    }

    #prompt {
        position: absolute;

        left: 50%;
        bottom: 90px;

        transform:
            translateX(-50%);

        padding:
            8px 15px;

        border-radius: 9px;

        background:
            rgba(0, 0, 0, 0.7);

        font-size: 15px;

        opacity: 0;
    }

    #message {
        position: absolute;

        left: 50%;
        bottom: 42px;

        transform:
            translateX(-50%);

        padding:
            8px 14px;

        border-radius: 8px;

        background:
            rgba(0, 0, 0, 0.55);

        color: #dbeafe;

        font-size: 14px;

        opacity: 0;

        transition:
            opacity 0.2s;
    }

    #flashlightHud {
        position: absolute;

        top: 18px;
        right: 20px;

        padding:
            7px 11px;

        border-radius: 8px;

        background:
            rgba(0, 0, 0, 0.55);

        font-size: 13px;

        display: none;
    }

    .screen {
        position: fixed;

        inset: 0;

        display: flex;

        align-items: center;
        justify-content: center;

        flex-direction: column;

        background:
            radial-gradient(
                circle at center,
                rgba(30, 41, 59, 0.8),
                rgba(2, 6, 23, 0.97)
            );

        color: white;

        z-index: 50;
    }

    .screen h1 {
        margin:
            0 0 8px;

        font-size: 64px;

        letter-spacing: 8px;
    }

    .screen p {
        margin:
            0 0 24px;

        max-width: 550px;

        color: #cbd5e1;

        font-size: 16px;

        line-height: 1.6;

        text-align: center;
    }

    .screen button {
        padding:
            13px 30px;

        border: 0;

        border-radius: 10px;

        background: #2563eb;

        color: white;

        font-size: 19px;

        font-weight: bold;

        cursor: pointer;
    }

    .screen button:hover {
        background: #3b82f6;
    }

    .hidden {
        display: none !important;
    }

</style>
```

</head>

<body>

```
<canvas id="game"></canvas>


<div id="hud">

    <div id="timer">
        60.0
    </div>

    <div id="loopCounter">
        Loop 1
    </div>

    <div id="crosshair"></div>

    <div id="prompt"></div>

    <div id="message"></div>

    <div id="flashlightHud">
        🔦 Flashlight: OFF
    </div>

</div>


<div
    id="startScreen"
    class="screen"
>

    <h1>
        LOOP
    </h1>

    <p>

        You have 60 seconds.

        <br>

        Search the office,
        find the key,
        enter the maze,
        and find the exit.

        <br><br>

        <b>WASD</b> — Move
        <br>

        <b>Mouse</b> — Look
        <br>

        <b>E</b> — Interact
        <br>

        <b>F</b> — Flashlight

    </p>

    <button id="startButton">
        ENTER
    </button>

</div>


<div
    id="gameOverScreen"
    class="screen hidden"
>

    <h1>
        LOOP RESET
    </h1>

    <p>
        Time ran out...
        but your discoveries remain.
    </p>

    <button id="restartButton">
        TRY AGAIN
    </button>

</div>


<div
    id="winScreen"
    class="screen hidden"
>

    <h1>
        ESCAPED
    </h1>

    <p>
        You found the exit.
    </p>

    <button id="winRestartButton">
        PLAY AGAIN
    </button>

</div>


<script type="module">

    import * as THREE from
        "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


    /* =====================================================
       RENDERER
    ===================================================== */

    const canvas =
        document.getElementById("game");

    const renderer =
        new THREE.WebGLRenderer({
            canvas: canvas,
            antialias: true
        });

    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.shadowMap.enabled = true;

    renderer.shadowMap.type =
        THREE.PCFSoftShadowMap;


    /* =====================================================
       SCENE
    ===================================================== */

    const scene =
        new THREE.Scene();

    scene.background =
        new THREE.Color(
            0x080b12
        );


    /* =====================================================
       CAMERA
    ===================================================== */

    const camera =
        new THREE.PerspectiveCamera(

            75,

            window.innerWidth /
            window.innerHeight,

            0.05,

            200

        );


    /* =====================================================
       LIGHTING
    ===================================================== */

    const ambientLight =
        new THREE.HemisphereLight(

            0x9aaed0,
            0x111111,
            0.65

        );

    scene.add(
        ambientLight
    );


    const officeLight =
        new THREE.PointLight(

            0xffe6b3,
            11,
            18

        );

    officeLight.position.set(
        0,
        2.8,
        0
    );

    officeLight.castShadow =
        true;

    scene.add(
        officeLight
    );


    /* =====================================================
       MATERIALS
    ===================================================== */

    const floorMaterial =
        new THREE.MeshStandardMaterial({

            color: 0x292d34,

            roughness: 0.85

        });


    const wallMaterial =
        new THREE.MeshStandardMaterial({

            color: 0x3b414a,

            roughness: 0.8

        });


    const ceilingMaterial =
        new THREE.MeshStandardMaterial({

            color: 0x171a20,

            roughness: 0.9

        });


    const woodMaterial =
        new THREE.MeshStandardMaterial({

            color: 0x593824,

            roughness: 0.7

        });


    const darkWoodMaterial =
        new THREE.MeshStandardMaterial({

            color: 0x302016,

            roughness: 0.75

        });


    const metalMaterial =
        new THREE.MeshStandardMaterial({

            color: 0x555b64,

            metalness: 0.5,

            roughness: 0.5

        });


    const blackMaterial =
        new THREE.MeshStandardMaterial({

            color: 0x101217,

            roughness: 0.45

        });


    const screenMaterial =
        new THREE.MeshStandardMaterial({

            color: 0x1d4ed8,

            emissive: 0x0b3b9e,

            emissiveIntensity: 0.4

        });


    const redMaterial =
        new THREE.MeshStandardMaterial({

            color: 0xa71919,

            roughness: 0.5

        });


    /* =====================================================
       HELPER
    ===================================================== */

    function createBox(
        x,
        y,
        z,
        width,
        height,
        depth,
        material,
        parent = scene
    ) {

        const mesh =
            new THREE.Mesh(

                new THREE.BoxGeometry(

                    width,
                    height,
                    depth

                ),

                material

            );

        mesh.position.set(
            x,
            y,
            z
        );

        mesh.castShadow =
            true;

        mesh.receiveShadow =
            true;

        parent.add(
            mesh
        );

        return mesh;

    }


    function createCylinder(
        x,
        y,
        z,
        radius,
        height,
        material,
        parent = scene
    ) {

        const mesh =
            new THREE.Mesh(

                new THREE.CylinderGeometry(

                    radius,
                    radius,
                    height,
                    20

                ),

                material

            );

        mesh.position.set(
            x,
            y,
            z
        );

        mesh.castShadow =
            true;

        mesh.receiveShadow =
            true;

        parent.add(
            mesh
        );

        return mesh;

    }


    /* =====================================================
       OFFICE SIZE
       
       Everything here is approximately HALF the
       dimensions of the previous version.
    ===================================================== */

    const officeWidth =
        9;

    const officeDepth =
        8;

    const officeHalfWidth =
        officeWidth / 2;

    const officeHalfDepth =
        officeDepth / 2;


    const mazeStartZ =
        4.5;


    /* =====================================================
       OFFICE FLOOR
    ===================================================== */

    createBox(

        0,
        -0.075,
        0,

        officeWidth,
        0.15,
        officeDepth,

        floorMaterial

    );


    /* =====================================================
       OFFICE WALLS
    ===================================================== */

    createBox(

        0,
        1.25,
        -officeHalfDepth,

        officeWidth,
        2.5,
        0.2,

        wallMaterial

    );


    createBox(

        -officeHalfWidth,
        1.25,
        0,

        0.2,
        2.5,
        officeDepth,

        wallMaterial

    );


    createBox(

        officeHalfWidth,
        1.25,
        0,

        0.2,
        2.5,
        officeDepth,

        wallMaterial

    );


    /*
        BACK WALL

        Split around the entrance.
    */

    createBox(

        -3.3,
        1.25,
        4,

        2.9,
        2.5,
        0.2,

        wallMaterial

    );


    createBox(

        3.3,
        1.25,
        4,

        2.9,
        2.5,
        0.2,

        wallMaterial

    );


    createBox(

        0,
        2.2,
        4,

        3.8,
        0.6,
        0.2,

        wallMaterial

    );


    /* =====================================================
       CEILING
    ===================================================== */

    createBox(

        0,
        2.5,
        0,

        officeWidth,
        0.15,
        officeDepth,

        ceilingMaterial

    );


    /* =====================================================
       MAZE ENTRANCE FRAME
    ===================================================== */

    const frameMaterial =
        new THREE.MeshStandardMaterial({

            color: 0x252b35,

            metalness: 0.5,

            roughness: 0.45

        });


    createBox(

        -1.05,
        1.25,
        4.05,

        0.18,
        2.1,
        0.25,

        frameMaterial

    );


    createBox(

        1.05,
        1.25,
        4.05,

        0.18,
        2.1,
        0.25,

        frameMaterial

    );


    createBox(

        0,
        2.2,
        4.05,

        2.25,
        0.18,
        0.25,

        frameMaterial

    );


    /* =====================================================
       ENTRANCE SIGN
    ===================================================== */

    const entranceCanvas =
        document.createElement(
            "canvas"
        );

    entranceCanvas.width =
        512;

    entranceCanvas.height =
        128;

    const entranceContext =
        entranceCanvas.getContext(
            "2d"
        );

    entranceContext.fillStyle =
        "#06140a";

    entranceContext.fillRect(
        0,
        0,
        512,
        128
    );

    entranceContext.fillStyle =
        "#4ade80";

    entranceContext.font =
        "bold 60px Arial";

    entranceContext.textAlign =
        "center";

    entranceContext.textBaseline =
        "middle";

    entranceContext.fillText(
        "MAZE",
        256,
        64
    );


    const entranceTexture =
        new THREE.CanvasTexture(
            entranceCanvas
        );


    const entranceSign =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                2.0,
                0.5
            ),

            new THREE.MeshBasicMaterial({

                map:
                    entranceTexture

            })

        );

    entranceSign.position.set(
        0,
        2.35,
        3.9
    );

    scene.add(
        entranceSign
    );


    /* =====================================================
       DESK
    ===================================================== */

    createBox(

        -1.9,
        1.05,
        -1.0,

        3.0,
        0.18,
        1.05,

        woodMaterial

    );


    createBox(

        -3.05,
        0.5,
        -1.0,

        0.22,
        1.0,
        0.9,

        darkWoodMaterial

    );


    createBox(

        -0.75,
        0.5,
        -1.0,

        0.22,
        1.0,
        0.9,

        darkWoodMaterial

    );


    /* =====================================================
       MONITOR
    ===================================================== */

    createBox(

        -1.9,
        1.65,
        -1.0,

        1.45,
        0.8,
        0.1,

        blackMaterial

    );


    createBox(

        -1.9,
        1.65,
        -0.93,

        1.25,
        0.62,
        0.025,

        screenMaterial

    );


    createBox(

        -1.9,
        1.16,
        -1.0,

        0.12,
        0.4,
        0.12,

        metalMaterial

    );


    createBox(

        -1.9,
        1.03,
        -1.0,

        0.55,
        0.07,
        0.3,

        blackMaterial

    );


    /* =====================================================
       KEYBOARD
    ===================================================== */

    createBox(

        -1.9,
        1.14,
        -1.55,

        0.9,
        0.04,
        0.35,

        blackMaterial

    );


    /* =====================================================
       CHAIR
    ===================================================== */

    createBox(

        -1.9,
        0.75,
        -2.55,

        1.0,
        1.25,
        0.18,

        blackMaterial

    );


    createBox(

        -1.9,
        0.4,
        -2.55,

        1.05,
        0.12,
        1.05,

        blackMaterial

    );


    createCylinder(

        -1.9,
        0.2,
        -2.55,

        0.07,
        0.4,

        metalMaterial

    );


    /* =====================================================
       BOOKSHELF
       
       THIS ONE IS NOW ACTUALLY INTERACTIVE.
       
       Each compartment can be searched separately.
    ===================================================== */

    const shelfInteractions = [];


    const shelfX =
        2.65;


    const shelfZ =
        -2.15;


    const shelfWidth =
        2.0;


    const shelfHeight =
        3.4;


    createBox(

        shelfX,
        1.7,
        shelfZ,

        shelfWidth,
        shelfHeight,
        0.4,

        darkWoodMaterial

    );


    /*
        Five individual shelf compartments.
    */

    for (
        let row = 0;
        row < 5;
        row++
    ) {

        const shelfY =
            0.35 +
            row * 0.68;


        createBox(

            shelfX,
            shelfY,
            shelfZ + 0.25,

            1.75,
            0.08,
            0.65,

            woodMaterial

        );


        /*
            Interactive shelf front.

            These are deliberately slightly
            in front of the bookshelf so
            E can find them.
        */

        const shelfFront =
            createBox(

                shelfX,
                shelfY + 0.25,
                shelfZ + 0.48,

                1.65,
                0.42,
                0.08,

                darkWoodMaterial

            );


        shelfInteractions.push({

            mesh:
                shelfFront,

            x:
                shelfX,

            z:
                shelfZ + 0.48,

            row:
                row,

            searched:
                false

        });


        /*
            Books in the shelf.
        */

        for (
            let book = 0;
            book < 4;
            book++
        ) {

            const bookMaterial =
                new THREE.MeshStandardMaterial({

                    color:
                        [
                            0x7f1d1d,
                            0x1d4ed8,
                            0x166534,
                            0x78350f
                        ][
                            (book + row) % 4
                        ]

                });


            createBox(

                shelfX -
                0.62 +
                book * 0.4,

                shelfY +
                0.28,

                shelfZ + 0.39,

                0.28,
                0.48,
                0.38,

                bookMaterial

            );

        }

    }


    /* =====================================================
       FILING CABINETS
    ===================================================== */

    const cabinetXPositions = [

        -3.35,
        -2.0

    ];


    const drawerObjects = [];


    for (
        let cabinetIndex = 0;
        cabinetIndex <
        cabinetXPositions.length;
        cabinetIndex++
    ) {

        const cabinetX =
            cabinetXPositions[
                cabinetIndex
            ];


        createBox(

            cabinetX,
            1.25,
            2.15,

            1.05,
            2.5,
            0.9,

            metalMaterial

        );


        for (
            let row = 0;
            row < 4;
            row++
        ) {

            const drawer =
                new THREE.Group();


            drawer.position.set(

                cabinetX,

                2.05 -
                row * 0.55,

                1.68

            );


            scene.add(
                drawer
            );


            const drawerFront =
                createBox(

                    0,
                    0,
                    0,

                    0.84,
                    0.42,
                    0.08,

                    darkWoodMaterial,

                    drawer

                );


            createBox(

                0,
                0,
                -0.07,

                0.22,
                0.05,
                0.05,

                metalMaterial,

                drawer

            );


            drawerObjects.push({

                group:
                    drawer,

                front:
                    drawerFront,

                open:
                    false,

                row:
                    row,

                cabinet:
                    cabinetIndex,

                hasKey:
                    false,

                hasFlashlight:
                    false

            });

        }

    }


    /* =====================================================
       GUARANTEED ITEM LOCATIONS
    ===================================================== */

    const keyDrawer =
        drawerObjects[3];


    const flashlightDrawer =
        drawerObjects[6];


    keyDrawer.hasKey =
        true;


    flashlightDrawer.hasFlashlight =
        true;


    /* =====================================================
       KEY MODEL
    ===================================================== */

    const keyGroup =
        new THREE.Group();


    const keyMetal =
        new THREE.MeshStandardMaterial({

            color: 0xfacc15,

            metalness: 0.85,

            roughness: 0.25

        });


    createCylinder(

        0,
        0,
        0,

        0.07,
        0.4,

        keyMetal,

        keyGroup

    ).rotation.z =
        Math.PI / 2;


    const keyRing =
        new THREE.Mesh(

            new THREE.TorusGeometry(

                0.12,
                0.035,
                10,
                20

            ),

            keyMetal

        );


    keyRing.position.x =
        -0.22;


    keyGroup.add(
        keyRing
    );


    keyGroup.visible =
        false;


    scene.add(
        keyGroup
    );


    /* =====================================================
       FLASHLIGHT PICKUP
    ===================================================== */

    const flashlightPickup =
        new THREE.Group();


    createCylinder(

        0,
        0,
        0,

        0.08,
        0.42,

        blackMaterial,

        flashlightPickup

    ).rotation.z =
        Math.PI / 2;


    const flashlightLens =
        createCylinder(

            0.23,
            0,
            0,

            0.09,
            0.06,

            new THREE.MeshStandardMaterial({

                color: 0xfef3c7,

                emissive: 0xfef3c7,

                emissiveIntensity: 0.8

            }),

            flashlightPickup

        );


    flashlightLens.rotation.z =
        Math.PI / 2;


    flashlightPickup.visible =
        false;


    scene.add(
        flashlightPickup
    );


    /* =====================================================
       PLAYER FLASHLIGHT
    ===================================================== */

    let hasFlashlight =
        false;


    let flashlightOn =
        false;


    const playerFlashlight =
        new THREE.SpotLight(

            0xffffff,

            0,

            22,

            Math.PI / 7,

            0.5,

            1.4

        );


    playerFlashlight.castShadow =
        true;


    camera.add(
        playerFlashlight
    );


    const flashlightTarget =
        new THREE.Object3D();


    flashlightTarget.position.set(
        0,
        0,
        -10
    );


    camera.add(
        flashlightTarget
    );


    playerFlashlight.target =
        flashlightTarget;


    const flashlightHud =
        document.getElementById(
            "flashlightHud"
        );


    function toggleFlashlight() {

        if (
            !hasFlashlight
        ) {

            showMessage(
                "You haven't found a flashlight yet."
            );

            return;

        }


        flashlightOn =
            !flashlightOn;


        playerFlashlight.intensity =
            flashlightOn
                ? 18
                : 0;


        flashlightHud.style.display =
            "block";


        flashlightHud.textContent =
            flashlightOn
                ? "🔦 Flashlight: ON"
                : "🔦 Flashlight: OFF";

    }


    /* =====================================================
       MAZE
    ===================================================== */

    const maze = [

        "#######.#######",

        "#S............#",

        "#.#####.#####.#",

        "#.#...#.#.....#",

        "#.#.#.#.#.###.#",

        "#...#...#...#.#",

        "###.#####.#.#.#",

        "#...#.....#...#",

        "#.###.#########",

        "#.....#.......#",

        "#.#####.#####.#",

        "#.......#...K.#",

        "#######.#######"

    ];


    const mazeCell =
        1;


    const mazeRows =
        maze.length;


    const mazeColumns =
        maze[0].length;


    const mazeWidth =
        mazeColumns *
        mazeCell;


    const mazeHeight =
        mazeRows *
        mazeCell;


    const mazeOriginX =
        -mazeWidth / 2 +
        mazeCell / 2;


    const mazeOriginZ =
        mazeStartZ +
        mazeCell / 2;


    const mazeWalls = [];


    /* =====================================================
       MAZE FLOOR
    ===================================================== */

    createBox(

        0,
        -0.075,

        mazeStartZ +
        mazeHeight / 2,

        mazeWidth,
        0.15,
        mazeHeight,

        new THREE.MeshStandardMaterial({

            color: 0x171b22,

            roughness: 0.9

        })

    );


    /* =====================================================
       MAZE WALLS
    ===================================================== */

    for (
        let row = 0;
        row < mazeRows;
        row++
    ) {

        for (
            let column = 0;
            column < mazeColumns;
            column++
        ) {

            if (
                maze[row][column] !== "#"
            ) {

                continue;

            }


            const x =
                mazeOriginX +
                column *
                mazeCell;


            const z =
                mazeOriginZ +
                row *
                mazeCell;


            createBox(

                x,
                1.25,
                z,

                mazeCell,
                2.5,
                mazeCell,

                wallMaterial

            );


            mazeWalls.push({

                x:
                    x,

                z:
                    z,

                halfWidth:
                    mazeCell / 2,

                halfDepth:
                    mazeCell / 2

            });

        }

    }


    /* =====================================================
       MAZE ENTRANCE LIGHT
    ===================================================== */

    const entranceLight =
        new THREE.PointLight(

            0x22c55e,

            4,

            6

        );


    entranceLight.position.set(

        0,
        1.8,
        mazeStartZ

    );


    scene.add(
        entranceLight
    );


    /* =====================================================
       MAZE EXIT
    ===================================================== */

    const exitRow =
        mazeRows - 1;


    const exitColumn =
        7;


    const exitX =
        mazeOriginX +
        exitColumn *
        mazeCell;


    const exitZ =
        mazeOriginZ +
        exitRow *
        mazeCell;


    /*
        Exit frame.
    */

    createBox(

        exitX - 0.75,
        1.2,
        exitZ + 0.35,

        0.15,
        2.4,
        0.25,

        frameMaterial

    );


    createBox(

        exitX + 0.75,
        1.2,
        exitZ + 0.35,

        0.15,
        2.4,
        0.25,

        frameMaterial

    );


    createBox(

        exitX,
        2.35,
        exitZ + 0.35,

        1.65,
        0.15,
        0.25,

        frameMaterial

    );


    /*
        Actual visible exit door.
    */

    const exitDoor =
        createBox(

            exitX,
            1.15,
            exitZ + 0.2,

            1.25,
            2.3,
            0.1,

            redMaterial

        );


    /* =====================================================
       EXIT SIGN
    ===================================================== */

    const exitCanvas =
        document.createElement(
            "canvas"
        );


    exitCanvas.width =
        512;

    exitCanvas.height =
        128;


    const exitContext =
        exitCanvas.getContext(
            "2d"
        );


    exitContext.fillStyle =
        "#250606";


    exitContext.fillRect(
        0,
        0,
        512,
        128
    );


    exitContext.fillStyle =
        "#ff5555";


    exitContext.font =
        "bold 62px Arial";


    exitContext.textAlign =
        "center";


    exitContext.textBaseline =
        "middle";


    exitContext.fillText(
        "EXIT",
        256,
        64
    );


    const exitTexture =
        new THREE.CanvasTexture(
            exitCanvas
        );


    const exitSign =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                1.7,
                0.43
            ),

            new THREE.MeshBasicMaterial({

                map:
                    exitTexture

            })

        );


    exitSign.position.set(

        exitX,
        2.55,
        exitZ + 0.02

    );


    exitSign.rotation.y =
        Math.PI;


    scene.add(
        exitSign
    );


    const exitLight =
        new THREE.PointLight(

            0xff2222,

            7,

            7

        );


    exitLight.position.set(

        exitX,
        1.8,
        exitZ

    );


    scene.add(
        exitLight
    );


    /* =====================================================
       PLAYER
    ===================================================== */

    const player = {

        x:
            0,

        y:
            1.65,

        z:
            -2.75,

        yaw:
            0,

        pitch:
            0,

        radius:
            0.22,

        speed:
            2.3

    };


    camera.position.set(

        player.x,
        player.y,
        player.z

    );


    /* =====================================================
       MOUSE LOOK
    ===================================================== */

    let pointerLocked =
        false;


    canvas.addEventListener(
        "click",
        () => {

            if (
                document.pointerLockElement !==
                canvas
            ) {

                canvas.requestPointerLock();

            }

        }
    );


    document.addEventListener(
        "pointerlockchange",
        () => {

            pointerLocked =
                document.pointerLockElement ===
                canvas;

        }
    );


    document.addEventListener(
        "mousemove",
        event => {

            if (
                !pointerLocked
            ) {

                return;

            }


            player.yaw -=
                event.movementX *
                0.0022;


            player.pitch -=
                event.movementY *
                0.0022;


            player.pitch =
                THREE.MathUtils.clamp(

                    player.pitch,

                    -1.45,
                    1.45

                );

        }
    );


    /* =====================================================
       KEYBOARD
    ===================================================== */

    const keys = {

        w:
            false,

        a:
            false,

        s:
            false,

        d:
            false

    };


    window.addEventListener(
        "keydown",
        event => {

            if (
                event.code ===
                "KeyW"
            ) {

                keys.w =
                    true;

                event.preventDefault();

            }


            if (
                event.code ===
                "KeyA"
            ) {

                keys.a =
                    true;

                event.preventDefault();

            }


            if (
                event.code ===
                "KeyS"
            ) {

                keys.s =
                    true;

                event.preventDefault();

            }


            if (
                event.code ===
                "KeyD"
            ) {

                keys.d =
                    true;

                event.preventDefault();

            }


            if (
                event.code ===
                "KeyE"
            ) {

                interact();

            }


            if (
                event.code ===
                "KeyF"
            ) {

                toggleFlashlight();

            }

        }
    );


    window.addEventListener(
        "keyup",
        event => {

            if (
                event.code ===
                "KeyW"
            ) {

                keys.w =
                    false;

            }


            if (
                event.code ===
                "KeyA"
            ) {

                keys.a =
                    false;

            }


            if (
                event.code ===
                "KeyS"
            ) {

                keys.s =
                    false;

            }


            if (
                event.code ===
                "KeyD"
            ) {

                keys.d =
                    false;

            }

        }
    );


    window.addEventListener(
        "blur",
        () => {

            keys.w =
                false;

            keys.a =
                false;

            keys.s =
                false;

            keys.d =
                false;

        }
    );


    /* =====================================================
       COLLISION
    ===================================================== */

    function circleIntersectsBox(

        px,
        pz,
        radius,

        cx,
        cz,

        halfWidth,
        halfDepth

    ) {

        const closestX =
            Math.max(

                cx - halfWidth,

                Math.min(
                    px,
                    cx + halfWidth
                )

            );


        const closestZ =
            Math.max(

                cz - halfDepth,

                Math.min(
                    pz,
                    cz + halfDepth
                )

            );


        const dx =
            px -
            closestX;


        const dz =
            pz -
            closestZ;


        return (

            dx * dx +
            dz * dz

        ) <
        radius * radius;

    }


    function officeCollision(
        x,
        z
    ) {

        const r =
            player.radius;


        /*
            Outer walls.
        */

        if (
            x - r <
            -officeHalfWidth
        ) {

            return true;

        }


        if (
            x + r >
            officeHalfWidth
        ) {

            return true;

        }


        if (
            z - r <
            -officeHalfDepth
        ) {

            return true;

        }


        /*
            Back wall.

            Leave central entrance open.
        */

        if (
            z + r >
            4
        ) {

            if (
                Math.abs(x) >
                1.05
            ) {

                return true;

            }

        }


        /*
            Desk.
        */

        if (
            circleIntersectsBox(

                x,
                z,
                r,

                -1.9,
                -1.0,

                1.5,
                0.53

            )
        ) {

            return true;

        }


        /*
            Bookshelf.
        */

        if (
            circleIntersectsBox(

                x,
                z,
                r,

                2.65,
                -2.15,

                1.0,
                0.25

            )
        ) {

            return true;

        }


        /*
            Cabinets.

            Slightly smaller collision
            so the drawers can be reached.
        */

        for (
            const cabinetX of
            cabinetXPositions
        ) {

            if (
                circleIntersectsBox(

                    x,
                    z,
                    r,

                    cabinetX,
                    2.15,

                    0.53,
                    0.45

                )
            ) {

                return true;

            }

        }


        /*
            Chair.
        */

        if (
            circleIntersectsBox(

                x,
                z,
                r,

                -1.9,
                -2.55,

                0.53,
                0.53

            )
        ) {

            return true;

        }


        return false;

    }


    function mazeCollision(
        x,
        z
    ) {

        const r =
            player.radius;


        for (
            const wall of
            mazeWalls
        ) {

            if (
                circleIntersectsBox(

                    x,
                    z,
                    r,

                    wall.x,
                    wall.z,

                    wall.halfWidth,
                    wall.halfDepth

                )
            ) {

                return true;

            }

        }


        return false;

    }


    function collidesAt(
        x,
        z
    ) {

        /*
            Office.
        */

        if (
            z <
            mazeStartZ
        ) {

            return officeCollision(
                x,
                z
            );

        }


        /*
            Maze.
        */

        return mazeCollision(
            x,
            z
        );

    }


    /* =====================================================
       MOVEMENT
    ===================================================== */

    function updateMovement(
        delta
    ) {

        let forward =
            0;

        let strafe =
            0;


        if (
            keys.w
        ) {

            forward +=
                1;

        }


        if (
            keys.s
        ) {

            forward -=
                1;

        }


        if (
            keys.d
        ) {

            strafe +=
                1;

        }


        if (
            keys.a
        ) {

            strafe -=
                1;

        }


        if (
            forward === 0 &&
            strafe === 0
        ) {

            return;

        }


        const length =
            Math.hypot(

                forward,
                strafe

            );


        forward /=
            length;


        strafe /=
            length;


        const forwardX =
            -Math.sin(
                player.yaw
            );


        const forwardZ =
            -Math.cos(
                player.yaw
            );


        const rightX =
            Math.cos(
                player.yaw
            );


        const rightZ =
            -Math.sin(
                player.yaw
            );


        const moveX =
            (

                forwardX *
                forward +

                rightX *
                strafe

            ) *
            player.speed *
            delta;


        const moveZ =
            (

                forwardZ *
                forward +

                rightZ *
                strafe

            ) *
            player.speed *
            delta;


        const nextX =
            player.x +
            moveX;


        if (
            !collidesAt(
                nextX,
                player.z
            )
        ) {

            player.x =
                nextX;

        }


        const nextZ =
            player.z +
            moveZ;


        if (
            !collidesAt(
                player.x,
                nextZ
            )
        ) {

            player.z =
                nextZ;

        }


        /*
            Keep player inside the world.
        */

        player.x =
            THREE.MathUtils.clamp(

                player.x,

                -mazeWidth / 2 -
                0.5,

                mazeWidth / 2 +
                0.5

            );


        player.z =
            THREE.MathUtils.clamp(

                player.z,

                -officeHalfDepth +
                player.radius,

                mazeStartZ +
                mazeHeight +
                1

            );

    }


    /* =====================================================
       DRAWERS
    ===================================================== */

    function updateDrawers(
        delta
    ) {

        for (
            const drawer of
            drawerObjects
        ) {

            const targetZ =
                drawer.open
                    ? 0.42
                    : 0;


            drawer.group.position.z =
                THREE.MathUtils.lerp(

                    drawer.group.position.z,

                    1.68 +
                    targetZ,

                    Math.min(
                        1,
                        delta * 10
                    )

                );

        }

    }


    function getClosestDrawer() {

        let closest =
            null;

        let closestDistance =
            Infinity;


        for (
            const drawer of
            drawerObjects
        ) {

            const distance =
                Math.hypot(

                    player.x -
                    drawer.group.position.x,

                    player.z -
                    drawer.group.position.z

                );


            if (
                distance <
                closestDistance
            ) {

                closestDistance =
                    distance;

                closest =
                    drawer;

            }

        }


        return {

            drawer:
                closest,

            distance:
                closestDistance

        };

    }


    /* =====================================================
       SHELF INTERACTION
    ===================================================== */

    function getClosestShelf() {

        let closest =
            null;

        let closestDistance =
            Infinity;


        for (
            const shelf of
            shelfInteractions
        ) {

            const distance =
                Math.hypot(

                    player.x -
                    shelf.x,

                    player.z -
                    shelf.z

                );


            if (
                distance <
                closestDistance
            ) {

                closestDistance =
                    distance;

                closest =
                    shelf;

            }

        }


        return {

            shelf:
                closest,

            distance:
                closestDistance

        };

    }


    /* =====================================================
       ITEMS
    ===================================================== */

    let keyFound =
        false;


    let flashlightFound =
        false;


    function placeItemInDrawer(
        drawer,
        item
    ) {

        item.position.set(

            drawer.group.position.x,

            drawer.group.position.y +
            0.03,

            drawer.group.position.z +
            0.25

        );

    }


    /* =====================================================
       INTERACTION
    ===================================================== */

    function interact() {

        /*
            DRAWERS
        */

        const drawerResult =
            getClosestDrawer();


        if (
            drawerResult.drawer &&
            drawerResult.distance <
            1.0
        ) {

            const drawer =
                drawerResult.drawer;


            drawer.open =
                !drawer.open;


            /*
                KEY
            */

            if (
                drawer.hasKey &&
                drawer.open
            ) {

                keyGroup.visible =
                    true;


                placeItemInDrawer(

                    drawer,
                    keyGroup

                );


                keyFound =
                    true;


                showMessage(
                    "You found the key."
                );

            }


            /*
                FLASHLIGHT
            */

            if (
                drawer.hasFlashlight &&
                drawer.open
            ) {

                flashlightPickup.visible =
                    true;


                placeItemInDrawer(

                    drawer,
                    flashlightPickup

                );


                flashlightFound =
                    true;


                hasFlashlight =
                    true;


                flashlightHud.style.display =
                    "block";


                showMessage(
                    "You found the flashlight. Press F."
                );

            }


            return;

        }


        /*
            SHELVES
        */

        const shelfResult =
            getClosestShelf();


        if (
            shelfResult.shelf &&
            shelfResult.distance <
            1.0
        ) {

            const shelf =
                shelfResult.shelf;


            shelf.searched =
                true;


            if (
                shelf.row === 2
            ) {

                showMessage(
                    "Old files. Nothing useful."
                );

            }
            else if (
                shelf.row === 4
            ) {

                showMessage(
                    "Just some dusty books."
                );

            }
            else {

                showMessage(
                    "Nothing useful here."
                );

            }


            return;

        }


        /*
            EXIT
        */

        const exitDistance =
            Math.hypot(

                player.x -
                exitX,

                player.z -
                exitZ

            );


        if (
            exitDistance <
            1.4
        ) {

            winGame();

        }

    }


    /* =====================================================
       PROMPT
    ===================================================== */

    const prompt =
        document.getElementById(
            "prompt"
        );


    function updatePrompt() {

        let text =
            "";


        const drawerResult =
            getClosestDrawer();


        if (
            drawerResult.drawer &&
            drawerResult.distance <
            1.0
        ) {

            text =
                drawerResult.drawer.open

                    ? "E — Close drawer"

                    : "E — Open drawer";

        }


        const shelfResult =
            getClosestShelf();


        if (
            shelfResult.shelf &&
            shelfResult.distance <
            1.0 &&
            drawerResult.distance >=
            1.0
        ) {

            text =
                shelfResult.shelf.searched

                    ? "E — Search shelf again"

                    : "E — Search shelf";

        }


        const exitDistance =
            Math.hypot(

                player.x -
                exitX,

                player.z -
                exitZ

            );


        if (
            exitDistance <
            1.4
        ) {

            text =
                "E — EXIT";

        }


        prompt.textContent =
            text;


        prompt.style.opacity =
            text
                ? "1"
                : "0";

    }


    /* =====================================================
       MESSAGE
    ===================================================== */

    const message =
        document.getElementById(
            "message"
        );


    let messageTimer =
        0;


    function showMessage(
        text
    ) {

        message.textContent =
            text;


        message.style.opacity =
            "1";


        messageTimer =
            2.3;

    }


    /* =====================================================
       GAME STATE
    ===================================================== */

    let running =
        false;


    let loopNumber =
        1;


    let timeRemaining =
        60;


    const memory = {

        keyFound:
            false,

        flashlightFound:
            false,

        mazeEntered:
            false,

        exitFound:
            false

    };


    /* =====================================================
       RESET PLAYER
    ===================================================== */

    function resetPlayer() {

        player.x =
            0;

        player.z =
            -2.75;

        player.yaw =
            0;

        player.pitch =
            0;

    }


    /* =====================================================
       RESET DRAWERS
    ===================================================== */

    function resetDrawers() {

        for (
            const drawer of
            drawerObjects
        ) {

            drawer.open =
                false;


            drawer.group.position.z =
                1.68;

        }


        keyGroup.visible =
            false;


        flashlightPickup.visible =
            false;


        keyDrawer.hasKey =
            !memory.keyFound;


        flashlightDrawer.hasFlashlight =
            !memory.flashlightFound;

    }


    /* =====================================================
       RESET LOOP
    ===================================================== */

    function resetLoop() {

        timeRemaining =
            60;


        resetPlayer();


        resetDrawers();


        flashlightOn =
            false;


        playerFlashlight.intensity =
            0;


        hasFlashlight =
            memory.flashlightFound;


        flashlightHud.style.display =
            hasFlashlight
                ? "block"
                : "none";


        if (
            memory.keyFound
        ) {

            keyDrawer.hasKey =
                false;

        }


        if (
            memory.flashlightFound
        ) {

            flashlightDrawer.hasFlashlight =
                false;

        }


        document.getElementById(
            "loopCounter"
        ).textContent =
            "Loop " +
            loopNumber;

    }


    /* =====================================================
       MEMORY
    ===================================================== */

    function updateMemory() {

        if (
            keyFound
        ) {

            memory.keyFound =
                true;

        }


        if (
            flashlightFound
        ) {

            memory.flashlightFound =
                true;

        }


        if (
            player.z >
            mazeStartZ + 0.5
        ) {

            memory.mazeEntered =
                true;

        }


        const distanceToExit =
            Math.hypot(

                player.x -
                exitX,

                player.z -
                exitZ

            );


        if (
            distanceToExit <
            1.8
        ) {

            memory.exitFound =
                true;

        }

    }


    /* =====================================================
       TIMER
    ===================================================== */

    function updateTimer(
        delta
    ) {

        timeRemaining -=
            delta;


        if (
            timeRemaining <= 0
        ) {

            timeRemaining =
                0;


            loopNumber++;


            resetLoop();


            showMessage(
                "Time ran out. The loop resets..."
            );

        }


        document.getElementById(
            "timer"
        ).textContent =
            timeRemaining.toFixed(1);

    }


    /* =====================================================
       WIN
    ===================================================== */

    function winGame() {

        running =
            false;


        if (
            document.pointerLockElement
        ) {

            document.exitPointerLock();

        }


        document.getElementById(
            "winScreen"
        ).classList.remove(
            "hidden"
        );

    }


    /* =====================================================
       CAMERA
    ===================================================== */

    function updateCamera() {

        camera.position.set(

            player.x,
            player.y,
            player.z

        );


        camera.rotation.order =
            "YXZ";


        camera.rotation.y =
            player.yaw;


        camera.rotation.x =
            player.pitch;

    }


    /* =====================================================
       GAME LOOP
    ===================================================== */

    let lastTime =
        performance.now();


    function gameLoop(
        time
    ) {

        if (
            !running
        ) {

            render();

            return;

        }


        const delta =
            Math.min(

                (time -
                lastTime) /
                1000,

                0.033

            );


        lastTime =
            time;


        updateMovement(
            delta
        );


        updateDrawers(
            delta
        );


        updateMemory();


        updateTimer(
            delta
        );


        updateCamera();


        updatePrompt();


        if (
            messageTimer >
            0
        ) {

            messageTimer -=
                delta;


            if (
                messageTimer <=
                0
            ) {

                message.style.opacity =
                    "0";

            }

        }


        render();


        requestAnimationFrame(
            gameLoop
        );

    }


    /* =====================================================
       RENDER
    ===================================================== */

    function render() {

        renderer.render(
            scene,
            camera
        );

    }


    /* =====================================================
       START GAME
    ===================================================== */

    function startGame() {

        document.getElementById(
            "startScreen"
        ).classList.add(
            "hidden"
        );


        document.getElementById(
            "gameOverScreen"
        ).classList.add(
            "hidden"
        );


        document.getElementById(
            "winScreen"
        ).classList.add(
            "hidden"
        );


        loopNumber =
            1;


        memory.keyFound =
            false;


        memory.flashlightFound =
            false;


        memory.mazeEntered =
            false;


        memory.exitFound =
            false;


        keyFound =
            false;


        flashlightFound =
            false;


        hasFlashlight =
            false;


        resetLoop();


        running =
            true;


        lastTime =
            performance.now();


        requestAnimationFrame(
            gameLoop
        );

    }


    /* =====================================================
       BUTTONS
    ===================================================== */

    document.getElementById(
        "startButton"
    ).addEventListener(
        "click",
        startGame
    );


    document.getElementById(
        "restartButton"
    ).addEventListener(
        "click",
        startGame
    );


    document.getElementById(
        "winRestartButton"
    ).addEventListener(
        "click",
        startGame
    );


    /* =====================================================
       RESIZE
    ===================================================== */

    window.addEventListener(
        "resize",
        () => {

            camera.aspect =
                window.innerWidth /
                window.innerHeight;


            camera.updateProjectionMatrix();


            renderer.setSize(

                window.innerWidth,
                window.innerHeight

            );

        }
    );


    /* =====================================================
       INITIAL STATE
    ===================================================== */

    resetLoop();

    updateCamera();

    render();

</script>
