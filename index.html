html,

    position: absolute;
    left: 50%;

}

#controls {
    position: absolute;
    bottom: 18px;
    left: 20px;

    position: absolute;
    top: 18px;
    right: 20px;

    color: #aaa;

.overlay {

    inset: 0;

            rgba(30,30,30,.45),

}

.panel {
    width: min(520px, 90vw);
    padding: 42px;
    text-align: center;
    background: rgba(8,8,8,.94);
    border: 1px solid rgba(255,255,255,.1);

.panel h1 {

}

.panel p {

}

button {

    color: white;

button:hover {

const collisionData = [

    [-27, -15, 0.4, 66],
    [27, -15, 0.4, 66],
    [0, -15, 54, 0.4],
    [0, 51, 54, 0.4],

    [-14, -5, 0.3, 18],

    [5, 34, 0.3, 10],
    [15, 34, 0.3, 10],

    [-20, 43, 0.3, 8],
    [-10, 43, 0.3, 8],

    [0, 43, 0.3, 8],
    [10, 43, 0.3, 8],

    [20, 43, 0.3, 8]
];


function collides(
    x,
    z
) {

    const r =
        player.radius;

    for (
        const c of collisionData
    ) {

        const cx = c[0];
        const cz = c[1];
        const w = c[2];
        const d = c[3];

        const closestX =
            Math.max(
                cx - w / 2,
                Math.min(
                    x,
                    cx + w / 2
                )
            );

        const closestZ =
            Math.max(
                cz - d / 2,
                Math.min(
                    z,
                    cz + d / 2
                )
            );

        const dx =
            x - closestX;

        const dz =
            z - closestZ;

        if (
            dx * dx +
            dz * dz <
            r * r
        ) {

            return true;

        }

    }

    return false;

}


/* =========================================================
   INPUT
========================================================= */

const keys = {};

window.addEventListener(
    "keydown",
    e => {

        keys[e.code] = true;

        if (
            e.code === "KeyF" &&
            running
        ) {

            flashlightOn =
                !flashlightOn;

            updateFlashlightUI();

        }

        if (
            e.code === "KeyE" &&
            running
        ) {

            interact();

        }

    }
);


window.addEventListener(
    "keyup",
    e => {

        keys[e.code] = false;

    }
);


/* =========================================================
   MOUSE LOOK
========================================================= */

renderer.domElement.addEventListener(
    "click",
    () => {

        if (running) {

            renderer.domElement
                .requestPointerLock();

        }

    }
);


document.addEventListener(
    "mousemove",
    e => {

        if (
            document.pointerLockElement !==
            renderer.domElement
        ) {

            return;

        }

        player.yaw -=
            e.movementX * 0.0022;

        player.pitch -=
            e.movementY * 0.0022;

        player.pitch =
            Math.max(
                -1.45,
                Math.min(
                    1.45,
                    player.pitch
                )
            );

    }
);


/* =========================================================
   FLASHLIGHT
========================================================= */

let flashlightOn = true;


const flashlight =
    new THREE.SpotLight(
        0xffffff,
        7,
        22,
        Math.PI / 7,
        0.5,
        1.4
    );

flashlight.castShadow = true;

flashlight.shadow.mapSize.set(
    1024,
    1024
);

camera.add(
    flashlight
);


const flashlightTarget =
    new THREE.Object3D();

scene.add(
    flashlightTarget
);

flashlight.target =
    flashlightTarget;


function updateFlashlight() {

    flashlight.intensity =
        flashlightOn
            ? 7
            : 0;

    flashlightTarget.position.copy(
        camera.position
    );

    const direction =
        new THREE.Vector3(
            0,
            0,
            -1
        );

    direction.applyQuaternion(
        camera.quaternion
    );

    flashlightTarget.position.add(
        direction.multiplyScalar(12)
    );

}


function updateFlashlightUI() {

    document.getElementById(
        "flashlightStatus"
    ).textContent =
        "FLASHLIGHT: " +
        (
            flashlightOn
                ? "ON"
                : "OFF"
        );

}

        new THREE.BoxGeometry(
            0.12,
            0.04,
            0.35
        ),
        new THREE.MeshStandardMaterial({
            color: 0xffcc55,
            emissive: 0x553300,
            emissiveIntensity: 0.4
        })
    );


key.position.set(
    -11,
    1.2,
    17
);

key.rotation.y =
    0.6;

key.visible = false;

worldGroup.add(
    key
);


/* Drawer marker */

const drawerPosition =
    new THREE.Vector3(
        -11,
        1.1,
        17
    );


function distanceToPlayer(
    position
) {

    return player.position
        .distanceTo(position);

}


function interact() {

    const distance =
        distanceToPlayer(
            drawerPosition
        );


    if (
        distance < 2.2 &&
        !keyCollected
    ) {

        if (!drawerOpen) {

            drawerOpen = true;

            key.visible = true;

            showMessage(
                "The drawer slides open."
            );

            playTone(
                180,
                0.12,
                "sawtooth"
            );

        }
        else {

            keyCollected = true;

            key.visible = false;

            showMessage(
                "You found a key."
            );

            playTone(
                660,
                0.08,
                "sine"
            );

            setTimeout(
                () => {

                    playTone(
                        880,
                        0.12,
                        "sine"
                    );

                },
                90
            );

        }

        return;

    }


    if (
        keyCollected
    ) {

        const mazeDoor =
            new THREE.Vector3(
                0,
                1.5,
                25
            );

        if (
            distanceToPlayer(
                mazeDoor
            ) < 3
        ) {

            showMessage(
                "The key fits."
            );

            setTimeout(
                () => {

                    showMessage(
                        ""
                    );

                },
                1600
            );

        }

    }

}


/* =========================================================
   PROMPT
========================================================= */

function updatePrompt() {

    const distance =
        distanceToPlayer(
            drawerPosition
        );

    if (
        distance < 2.2 &&
        !keyCollected
    ) {

        document.getElementById(
            "prompt"
        ).textContent =
            drawerOpen
                ? "[E] Take the key"
                : "[E] Open drawer";

        return;

    }


    document.getElementById(
        "prompt"
    ).textContent = "";

}


/* =========================================================
   MOVEMENT
========================================================= */

function updateMovement(
    dt
) {

    const forward =
        keys["KeyW"]
            ? 1
            : keys["KeyS"]
                ? -1
                : 0;

    const side =
        keys["KeyD"]
            ? 1
            : keys["KeyA"]
                ? -1
                : 0;


    const direction =
        new THREE.Vector3();


    const forwardVector =
        new THREE.Vector3(
            Math.sin(player.yaw),
            0,
            Math.cos(player.yaw)
        );


    const rightVector =
        new THREE.Vector3(
            Math.cos(player.yaw),
            0,
            -Math.sin(player.yaw)
        );


    direction
        .addScaledVector(
            forwardVector,
            forward
        )
        .addScaledVector(
            rightVector,
            side
        );


    if (
        direction.lengthSq() > 0
    ) {

        direction.normalize();

    }


    const speed =
        player.speed *
        dt;


    const nextX =
        player.position.x +
        direction.x *
        speed;


    const nextZ =
        player.position.z +
        direction.z *
        speed;


    if (
        !collides(
            nextX,
            player.position.z
        )
    ) {

        player.position.x =
            nextX;

    }


    if (
        !collides(
            player.position.x,
            nextZ
        )
    ) {

        player.position.z =
            nextZ;

    }

}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera() {

    camera.position.copy(
        player.position
    );

    camera.rotation.order =
        "YXZ";

    camera.rotation.y =
        player.yaw;

    camera.rotation.x =
        player.pitch;

    updateFlashlight();

}


/* =========================================================
   AUDIO
========================================================= */

let audioContext = null;
let masterGain = null;
let lastFootstep = 0;


function startAudio() {

    if (
        audioContext
    ) {

        if (
            audioContext.state ===
            "suspended"
        ) {

            audioContext.resume();

        }

        return;

    }


    audioContext =
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();


    masterGain =
        audioContext.createGain();

    masterGain.gain.value =
        0.22;

    masterGain.connect(
        audioContext.destination
    );


    const hum =
        audioContext
            .createOscillator();

    const humGain =
        audioContext
            .createGain();

    hum.type =
        "sine";

    hum.frequency.value =
        45;

    humGain.gain.value =
        0.035;

    hum.connect(
        humGain
    );

    humGain.connect(
        masterGain
    );

    hum.start();

}


function playTone(
    frequency,
    duration,
    type = "sine"
) {

    if (
        !audioContext
    ) {

        return;

    }

    const now =
        audioContext.currentTime;


    const oscillator =
        audioContext
            .createOscillator();

    const gain =
        audioContext
            .createGain();


    oscillator.type =
        type;

    oscillator.frequency.value =
        frequency;


    gain.gain.setValueAtTime(
        0.0001,
        now
    );

    gain.gain.exponentialRampToValueAtTime(
        0.08,
        now + 0.01
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + duration
    );


    oscillator.connect(
        gain
    );

    gain.connect(
        masterGain
    );


    oscillator.start(
        now
    );

    oscillator.stop(
        now + duration + 0.03
    );

}


function updateFootsteps(
    moving,
    dt
) {

    if (!moving) {

        lastFootstep = 0;

        return;

    }


    lastFootstep -= dt;


    if (
        lastFootstep <= 0
    ) {

        playTone(
            65,
            0.055,
            "triangle"
        );

        lastFootstep =
            0.43;

    }

}


/* =========================================================
   MESSAGE
========================================================= */

let messageTimeout;


function showMessage(
    text
) {

    const element =
        document.getElementById(
            "message"
        );

    element.textContent =
        text;


    clearTimeout(
        messageTimeout
    );


    if (text) {

        messageTimeout =
            setTimeout(
                () => {

                    element.textContent =
                        "";

                },
                2200
            );

    }

}


/* =========================================================
   HORROR SYSTEM
========================================================= */

/*
    Intentionally kept separate from
    the normal gameplay systems.
*/

let horrorTimer = 0;
let horrorActive = false;


const horror =
    new THREE.Group();

scene.add(
    horror
);


function updateHorror(
    dt
) {

    if (
        !keyCollected
    ) {

        return;

    }


    horrorTimer +=
        dt;


    /*
       The encounter logic deliberately
       remains subtle.
    */

    if (
        horrorTimer > 9
    ) {

        horrorActive = true;

    }


    if (
        horrorActive
    ) {

        /* Atmosphere changes happen here. */

    }

}


/* =========================================================
   LOOP SYSTEM
========================================================= */

let running = false;

let loopNumber = 1;

let timeLeft = 60;

let lastTime =
    performance.now();


function resetLoop() {

    player.position.set(
        0,
        1.65,
        -10
    );

    player.yaw = 0;
    player.pitch = 0;

    keyCollected = false;
    drawerOpen = false;

    key.visible = false;

    horrorTimer = 0;
    horrorActive = false;

    timeLeft = 60;

    updateCamera();

    showMessage(
        ""
    );

}


function endLoop() {

    running = false;

    if (
        document.pointerLockElement
    ) {

        document.exitPointerLock();

    }


    loopNumber++;


    document.getElementById(
        "loopCounter"
    ).textContent =
        "LOOP " +
        loopNumber;


    resetLoop();

    running = true;

    lastTime =
        performance.now();

    requestAnimationFrame(
        gameLoop
    );

}


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop(
    time
) {

    if (!running) {

        return;

    }


    const dt =
        Math.min(
            (time - lastTime) /
            1000,
            0.05
        );


    lastTime =
        time;


    timeLeft -=
        dt;


    if (
        timeLeft <= 0
    ) {

        timeLeft = 0;

        endLoop();

        return;

    }


    const moving =
        keys["KeyW"] ||
        keys["KeyA"] ||
        keys["KeyS"] ||
        keys["KeyD"];


    updateMovement(
        dt
    );

    updateCamera();

    updatePrompt();

    updateFootsteps(
        moving,
        dt
    );

    updateHorror(
        dt
    );


    document.getElementById(
        "timer"
    ).textContent =
        timeLeft.toFixed(1);


    renderer.render(
        scene,
        camera
    );


    requestAnimationFrame(
        gameLoop
    );

}


/* =========================================================
   START
========================================================= */

function startGame() {

    startAudio();

    loopNumber = 1;

    document.getElementById(
        "loopCounter"
    ).textContent =
        "LOOP 1";


    resetLoop();


    document.getElementById(
        "startScreen"
    ).classList.add(
        "hidden"
    );


    document.getElementById(
        "gameOverScreen"
    ).classList.add(
        "hidden"
    );


    running = true;

    lastTime =
        performance.now();


    renderer.domElement
        .requestPointerLock();


    requestAnimationFrame(
        gameLoop
    );

}


document.getElementById(
    "startButton"
).addEventListener(
    "click",
    startGame
);


document.getElementById(
    "restartButton"
).addEventListener(
    "click",
    startGame
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


/* =========================================================
   INITIAL STATE
========================================================= */

updateFlashlightUI();

updateCamera();

renderer.render(
    scene,
    camera
);

</script>
